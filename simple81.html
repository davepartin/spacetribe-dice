      '<div class="dir"><div class="n">' + p.direct + '</div><div class="l">Direct</div></div>' +
      '<div class="h"><div class="n">' + Math.max(0, G.you.hp + p.you.heal) + '</div>' +
        '<div class="l">Your flagship</div></div>' +
    '</div>' +
    '<p class="say">The <span class="red">volley</span> can be taken on a ship instead. ' +
    '<b class="dir">Direct</b> cannot be stopped by anything \u2014 it always reaches your flagship.</p>';

  if (p.fed && p.fed.length){
    h += '<p class="say">' + p.fed.map(function(f){
      return 'Your <b>d' + f.s + '</b> in slot ' + f.slot + ' took <b>' + f.soak + '</b>';
    }).join(' \u00b7 ') + '.</p>';
  }

  if (left > 0 && room > 0 && canSoak(G.you)){
    h += '<div class="choose">Choose as many ships as you want</div>' +
      '<p class="hint">Each selected ship blocks damage equal to its size, then it is ' +
      '<b>damaged</b> for the next round. Protect more health now, or keep more dice ' +
      'rolling next round.</p>';
  } else if (left > 0){
    // Say WHICH limit you have hit. "No ship can take this one" blamed the fleet
    // even when the real answer was that you had already used your one ship.
    h += '<p class="hint">' + (room <= 0
      ? 'That is your ' + (K("soakMax") === 1 ? 'one ship' : K("soakMax") + ' ships') +
        ' for this round \u2014 the rest lands on the flagship.'
      : 'Every ship is damaged, so nothing can step in \u2014 this lands on the flagship.') +
      '</p>';
  }

  // The same 3x3 the roll screen uses, so the board never changes shape. Empty
  // empty slots still show, because "slot 5 is empty" is information too.
  var cells = [], fleet = G.you.dice, i, ix, d, hurt, pick;
  for (i = 0; i < 9; i++){
    if (i === 4){
      cells.push('<div class="die flag brace-flag"><div class="flbl">Flagship</div>' +
        '<div class="fcap hp">' + Math.max(0, G.you.hp + p.you.heal) + '</div></div>');
      continue;
    }
    ix = i < 4 ? i : i - 1;
    d = fleet[ix];
    if (!d){ cells.push('<div class="slot"><span class="slotno">' + (ix+1) + '</span></div>'); continue; }
    hurt = isDamaged(d);
    pick = !hurt && left > 0 && room > 0;
    cells.push('<div class="die' + (hurt ? " hurt" : "") + (pick ? "" : " noPick") + '"' +
      (pick ? ' data-brace="' + ix + '"' : '') + '>' +
      '<span class="slotno">' + (ix+1) + '</span>' +
      hullSvg(d.s, "", hurt ? "dry" : "defense") +
      '<div class="kind">' + (hurt ? "Damaged" : pick ? "d" + d.s + " \u00b7 blocks " + soakOf(d.s)
        : "d" + d.s) + '</div></div>');
  }
  h += '<div class="grid">' + cells.join("") + '</div>';

  h += '<div class="row"><button id="brace-reset">Reset choices on this page</button>' +
    '<button class="go" id="brace-done">' +
    (total > 0
      ? 'Continue \u2014 flagship takes ' + total
      : 'Continue \u2014 nothing gets through') +
    '</button></div>';
  return h;
}

// Both rolls, side by side, sorted low to high. Sorting is what makes a straight
// legible: any value inside the run sits contiguously once sorted, so the whole
// line can be wrapped in one gold box and read as 3-4-5-6-7 at a glance. Slot
// order carries no meaning by the time the round is over - the notes below still
// name the slot for anything that mattered.
function rollRow(label, dice, run, taken){
  var sorted = dice.slice().sort(function(a, b){ return a.value - b.value; });
  var lo = run ? run.start : 1e9, hi = run ? run.top : -1;
  var pre = [], mid = [], post = [], i, d;

  function chip(d){
    var k = kindOf(d.value);
    return '<span class="chip ' + (d.flag ? "fl" : k === "attack" ? "red" : k === "defense" ? "blue" : "nrg") +
      '">' + d.value + '</span>';
  }
  for (i = 0; i < sorted.length; i++){
    d = sorted[i];
    if (d.value < lo) pre.push(chip(d));
    else if (d.value <= hi) mid.push(chip(d));
    else post.push(chip(d));
  }

  var verdict;
  if (!run){
    verdict = '<span class="no">no straight</span>';
  } else if (taken && taken < run.length){
    verdict = '<b>' + run.length + ' in a row</b> \u2014 cashed as ' + taken +
      ' for <b>' + run.reward.label + '</b>';
  } else {
    verdict = '<b>' + run.length + ' in a row</b> \u2014 <b>' + run.reward.label + '</b>';
  }

  return '<div class="rr"><div class="rl">' + label + '</div>' +
    '<div class="chips">' + pre.join("") +
      (mid.length ? '<span class="runbox">' + mid.join("") + '</span>' : "") +
      post.join("") + '</div></div>' +
    '<div class="verd' + (run ? " win" : "") + '">' + verdict + '</div>';
}

function reportView(){
  var r = G.report, bump = r.bump || 0;

  // Every line has to add up on screen. Before v67 the total quietly folded in
  // Direct, so a player reading "attacked with 12, shields blocked 7, so 9 got
  // through" was looking at arithmetic that was wrong by exactly the Direct.
  function lr(label, val, cls, kind){
    return '<div class="lr' + (kind ? " " + kind : "") + '"><span>' + label + '</span>' +
      '<b' + (cls ? ' class="' + cls + '"' : '') + '>' + val + '</b></div>';
  }

  // ── your shot ──
  var yAtk = r.you.attack + bump;
  var yStopped = Math.min(yAtk, r.them.defense);
  var yWasted  = Math.max(0, r.them.defense - yAtk);
  var yThrough = r.youVolley - (r.youBlocked || 0);
  var mine = lr("Your fleet attacked", r.you.attack, "red");
  if (bump) mine += lr("War escalation", "+" + bump, "red");
  mine += lr("Their shields", yStopped ? "−" + yStopped : "0", "blue");
  if (r.themFed && r.themFed.length){
    mine += lr("They put " + r.themFed.map(function(f){ return "a d" + f.s; }).join(" and ") +
      " in the way", "−" + r.youBlocked, "blue");
  }
  mine += lr("Through to their flagship", yThrough, "", "sub");
  mine += lr(r.you.direct ? "Direct — no shield stops it" : "Direct",
    (r.you.direct ? "+" : "") + r.you.direct, "dir");
  mine += lr("Damage to their flagship", r.youDealt, "red", "end");

  // ── their shot ──
  var tAtk = r.them.attack + bump;
  var tStopped = Math.min(tAtk, r.you.defense);
  var tWasted  = Math.max(0, r.you.defense - tAtk);
  var tThrough = Math.max(0, r.volley - r.soaked);
  var theirs = lr("Their fleet attacked", r.them.attack, "red");
  if (bump) theirs += lr("War escalation", "+" + bump, "red");
  theirs += lr("Your shields", tStopped ? "−" + tStopped : "0", "blue");
  if (r.fed && r.fed.length){
    theirs += lr("You put " + r.fed.map(function(f){
      return "your d" + f.s + " in slot " + f.slot; }).join(" and ") + " in the way",
      "−" + Math.min(r.soaked, r.volley), "blue");
  }
  theirs += lr("Through to your flagship", tThrough, "", "sub");
  theirs += lr(r.direct ? "Direct — no shield stops it" : "Direct",
    (r.direct ? "+" : "") + r.direct, "dir");
  theirs += lr("Damage to your flagship", r.themDealt, "red", "end");

  // ── the notes that are not arithmetic ──
  var notes = "";
  if (r.you.run) notes += '<div class="line">Your <b>' + r.you.run.taken +
    ' in a row</b> paid <b>' + r.you.run.reward.label + '</b>.</div>';
  if (r.shipBuilt) notes += '<div class="line">Your straight built you a free <b>d' +
    r.shipBuilt + '</b>.</div>';
  if (yWasted) notes += '<div class="line"><b class="blue">' + yWasted +
    '</b> of their shielding went to waste — they over-defended.</div>';
  if (tWasted) notes += '<div class="line"><b class="blue">' + tWasted +
    '</b> of your shielding went to waste — you out-shielded their shot.</div>';
  if (r.fed && r.fed.length) notes += '<div class="line">' + r.fed.map(function(f){
    return 'Your <b>d' + f.s + '</b> in slot ' + f.slot; }).join(" and ") +
    ' took the hit, so ' + (r.fed.length === 1 ? 'it is' : 'they are') +
    ' <b>damaged</b> next round — no roll, no scrapping.</div>';
  notes += '<div class="line">Your flagship fired <b style="color:var(--gold)">' +
    FACES[r.youFace].name +
    '</b>; theirs fired <b style="color:var(--gold)">' + FACES[r.themFace].name + '</b>.</div>';
  notes += '<div class="line">You banked <b class="nrg">' + r.you.energy +
    ' Energy</b> from low rolls.</div>';

  function healthCard(side, before, after, damage, repair){
    var previousLabel = G.round === 1 ? "Start" : "Round " + (G.round - 1);
    return '<div class="healthcard"><div class="side">' + side + ' flagship</div>' +
      '<div class="healthline"><div class="healthpoint"><b>' + Math.max(0, before) +
        '</b><small>' + previousLabel + '</small></div>' +
      '<div class="healtharrow">→</div>' +
      '<div class="healthpoint"><b>' + Math.max(0, after) +
        '</b><small>Round ' + G.round + '</small></div></div>' +
      '<div class="healthmoves"><span class="hurt">−' + damage + ' damage</span>' +
      '<span class="repair">+' + repair + ' repaired</span></div></div>';
  }

  return '<h2>Round ' + G.round + ' result</h2>' +
    '<div class="healthchange">' +
      healthCard("Your", r.youHpBefore, r.youHpAfter, r.themDealt, r.you.heal) +
      healthCard("Their", r.themHpBefore, r.themHpAfter, r.youDealt, r.them.heal) +
    '</div>' +
    '<div class="card rolls">' +
      rollRow("You",  r.youDice,  r.you.run,  r.you.run  && r.you.run.taken) +
      rollRow("Them", r.themDice, r.them.run, r.them.run && r.them.run.taken) +
      '<div class="leg">The white die ringed in gold is a flagship \u2014 its number ' +
      'joins the line but never fires on its own.</div>' +
    '</div>' +
    '<div class="leds">' +
      '<div class="card led"><div class="ledh"><span>Your shot</span>' +
        '<b class="red">' + r.youDealt + '</b></div>' + mine + '</div>' +
      '<div class="card led"><div class="ledh"><span>Their shot</span>' +
        '<b class="red">' + r.themDealt + '</b></div>' + theirs + '</div>' +
    '</div>' +
    '<div class="card"><div class="rep">' + notes + '</div></div>';
}


// Upgrade the whole flagship a level. The bonus on every face rises together, so it
// is one purchase and one number rather than six little decisions.
function flagUpgradeHtml(){
  var lvl = G.you.flag.lvl || 1;
  if (lvl >= 3){
    return '<div class="card"><div class="rep"><div class="line">' +
      'Your flagship is at <b style="color:var(--gold)">level 3</b> \u2014 every matching ' +
      'die gets <b>+4</b>. That is the ceiling.</div></div></div>';
  }
  var next = lvl + 1, cost = flagLvlCost(next), broke = G.you.energy < cost;
  return '<div class="buy"><div class="i"><b>Flagship \u2014 level ' + next + '</b><small>' +
    'The bonus on every face rises from <b>+' + (lvl + 1) + '</b> to <b>+' + (next + 1) +
    '</b> \u2014 including the Reactor.</small></div>' +
    '<button data-flagup="1"' + (broke ? ' disabled' : '') + '>' + cost + '\u26a1</button></div>';
}


// What a hull actually carries. The old shop said a d10 had "4 attack faces,
// 4 shield" - it was quietly skipping the 1 and the 2, which was true of a rule
// we dropped long ago. Every face fights: evens hit, odds block, and the 1 and 2
// pay Energy ON TOP of that. Counted here rather than described, so the shop
// cannot drift away from the engine again.
// A heading should say what you can DO here. "Shipyard" is a place; "Buy a new
// ship" is an action, and the colour says which of the three rooms you are in.
function shopHead(tone, title, sub){
  return '<div class="shead ' + tone + '"><h3>' + title + '</h3>' +
    '<div class="ssub">' + sub + '</div></div>';
}

// The only thing you can buy for the flagship. There is nothing to choose - one
// purchase lifts all six faces together - so there is nothing here to get wrong.
function flagshipSectionHtml(){
  var lvl = G.you.flag.lvl || 1;
  return '<div class="card">' +
    shopHead("gold", "Upgrade your flagship",
      lvl >= 3 ? "Fully upgraded \u2014 every matching die gets +4"
               : "One purchase raises the bonus on all six faces") +
    '<p>Your flagship rolls one of its six faces each round. It adds a <b>bonus</b> ' +
    'to the ships that match that face — a flagship <b>3</b> adds repair to each ' +
    'of your 3s, while a flagship <b>6</b> adds attack to every even die. A level ' +
    'raises that bonus on all six faces at once.</p>' +
    '<p class="hint">The <b>#1</b> face is the exception: it does not match a die. ' +
    'It raises your standing Energy instead, and a level raises that too.</p>' +
    '<div class="lvlbar">' + [1,2,3].map(function(n){
      return '<div class="lvl' + (n === lvl ? " now" : n < lvl ? " past" : "") + '">' +
        '<div class="ln">Level ' + n + '</div>' +
        '<div class="lp">each matching die<br>gets <b>+' + (n + 1) + '</b></div></div>';
    }).join("") + '</div>' +
    '<div class="faceref">' + [1,2,3,4,5,6].map(flagFaceReferenceHtml).join("") + '</div>' +
    flagUpgradeHtml() + '</div>';
}

function flagFaceReferenceHtml(n){
  var m = flagMul(G.you), p = FACES[G.you.flag.faces[n-1]], detail =
      n === 1 ? 'Raise base Energy by ' + m
    : n === 2 ? 'Each ship showing 2 gets +' + m + ' Direct'
    : n === 3 ? 'Each ship showing 3 repairs +' + m
    : n === 4 ? 'Each ship showing 4 earns +' + m + ' Energy'
    : n === 5 ? 'Each odd ship blocks +' + m
    : 'Each even ship attacks +' + m;
  return '<div class="fref"><b>' + n + '</b><span><strong>' + p.name +
    '</strong><small>' + detail + '</small></span></div>';
}

function hullFacts(sides){
  var f = { hit:0, block:0, energy:0, repair:0, direct:0 }, v;
  for (v = 1; v <= sides; v++){
    if (v % 2 === 0) f.hit++; else f.block++;
    if (energyOf(v)) f.energy++;
    if (healOf(v))   f.repair++;
    if (directOf(v)) f.direct++;
  }
  return f;
}
function growthMarksHtml(sides){
  if (sides < 6) return 'the four low marks only';
  var topOdd = sides - 1, repair = healOf(topOdd), direct = directOf(sides);
  return 'new top faces: <b class="hp">' + topOdd + ' repairs ' + repair +
    '</b> · <b class="dir">' + sides + ' fires ' + direct + ' Direct</b>';
}

// A ship you are thinking of buying should look like the ship you will get, so
// this is the same hull the board draws. Reading a row of text and then finding
// a shape on the grid was two different languages for one object.
function buyCardHtml(sides){
  var cost = priceOf(sides), f = hullFacts(sides);
  var full = G.you.dice.length >= openSlots(G.you);
  var can = !full && G.you.energy >= cost;
  return '<div class="ship' + (can ? " can" : " cant") + '">' +
    hullSvg(sides, "", can ? "attack" : "dry") +
    '<div class="sname">d' + sides + '</div>' +
    '<div class="sfaces"><b class="red">' + f.hit + '</b> hit · ' +
      '<b class="blue">' + f.block + '</b> block</div>' +
    '<div class="sfaces avg">averages <b>' + ((sides + 1) / 2).toFixed(1) + '</b> a roll</div>' +
    '<div class="sline">straights pay at the <b>d' + sides + '</b> tier</div>' +
    '<div class="sline">' + growthMarksHtml(sides) + '</div>' +
    '<button class="sbuy" data-buysize="' + sides + '"' + (can ? '' : ' disabled') + '>' +
      '<b>' + cost + '⚡</b>' +
      (full ? '<i>' + (openSlots(G.you) < K("maxDice") ? 'open a slot first' : 'no slot free') +
        '</i>' : '') +
    '</button></div>';
}

// The scrapyard is your own board, not a list. Same 3x3, same hulls, same slot
// numbers - so "scrap the d4 in slot 2" is a thing you can see rather than
// something you have to translate.
function fleetGridHtml(){
  var cells = [], i, ix, d, hurt, next, cost;
  for (i = 0; i < 9; i++){
    if (i === 4){
      cells.push('<div class="die flag shopflag"><div class="flbl">Flagship</div>' +
        '<div class="fcap hp">' + Math.max(0, G.you.hp) + '</div>' +
        '<div class="chg">level ' + (G.you.flag.lvl || 1) + '</div></div>');
      continue;
    }
    ix = i < 4 ? i : i - 1;
    if (ix >= openSlots(G.you)){
      cells.push('<div class="slot locked"><span class="slotno">' + (ix + 1) + '</span>' +
        '<span class="free">locked</span></div>');
      continue;
    }
    d = G.you.dice[ix];
    if (!d){
      cells.push('<div class="slot"><span class="slotno">' + (ix + 1) + '</span>' +
        '<span class="free">slot free</span></div>');
      continue;
    }
    hurt = isDamaged(d);
    next = nextSize(d.s);
    cost = growCost(d.s);
    cells.push('<div class="die noPick' + (hurt ? " hurt" : "") + '">' +
      '<span class="slotno">' + (ix + 1) + '</span>' +
      (next ? '<div class="shipacts top"><button class="growb" data-grow="' + ix + '"' +
        (hurt || G.you.energy < cost ? ' disabled' : '') + '>' +
        (hurt ? 'Damaged' : 'Grow to d' + next + ' · ' + cost + '⚡') + '</button></div>' : '') +
      hullSvg(d.s, "", hurt ? "dry" : "defense") +
      '<div class="kind">d' + d.s + '</div>' +
      '<div class="shipacts">' +
        '<button class="scrapb" data-sell="' + ix + '"' +
          (hurt || G.you.dice.length <= 1 ? ' disabled' : '') + '>' +
          (hurt ? 'Damaged' : 'Scrap · ' + sellValue(d.s) + '⚡') + '</button>' +
      '</div></div>');
  }
  return '<div class="grid">' + cells.join("") + '</div>';
}

function slotSectionHtml(){
  var open = openSlots(G.you), next = open + 1;
  if (open >= K("maxDice")){
    return '<div class="card">' +
      shopHead("blue", "Open another fleet slot", "All " + K("maxDice") + " slots are open") +
      '<p>Your formation is at full width. Spend Energy growing the ships already in it.</p></div>';
  }
  var cost = slotCost(next), can = G.you.energy >= cost;
  return '<div class="card">' +
    shopHead("blue", "Open another fleet slot", open + " of " + K("maxDice") + " slots open") +
    '<p>Width is permanent: once a slot is open, any ship in it rolls every round. ' +
    'Opening it does not include a ship.</p>' +
    '<div class="slotoffer"><div class="i"><b>Open slot ' + next + '</b>' +
      '<small>Then buy any ship to fill it.</small></div>' +
      '<button data-unlock="1"' + (can ? '' : ' disabled') + '>' + cost + '⚡' +
      '</button></div></div>';
}

function shopView(){
  var full = G.you.dice.length >= openSlots(G.you);
  var filled = G.you.dice.length, cap = openSlots(G.you);
  var theirBig = Math.max.apply(null, G.them.dice.map(function(d){ return d.s; }));

  return '<h2>Between rounds</h2>' +

    '<div class="tot three purse">' +
      '<div class="e"><div class="n">' + G.you.energy + '</div><div class="l">Energy to spend</div></div>' +
      '<div><div class="n">' + filled + '/' + cap + '</div><div class="l">Ships / open slots</div></div>' +
      '<div><div class="n">' + G.them.dice.length + ' ships</div>' +
        '<div class="l">Their fleet · largest d' + theirBig + '</div></div>' +
    '</div>' +
    '<p class="say">Every price is listed on the <b class="nrg">Upgrade costs</b> page.</p>' +

    '<div class="card">' +
    shopHead("gold", "Grow the ships you own",
      'Grow one step: d4 → d6 → d8 → d10') +
    '<p>Growing keeps the same slot and costs <b>' + growCost(4) + '⚡, then ' +
    growCost(6) + '⚡, then ' + growCost(8) + '⚡</b> at today’s prices. ' +
    'Or scrap for ' + K("sellBack") + '% if you truly want the slot empty. A damaged ship must wait.</p>' +
    fleetGridHtml() + '</div>' +

    slotSectionHtml() +

    '<div class="card">' +
    shopHead("blue", "Buy a new ship",
      full ? (cap < K("maxDice") ? 'Every open slot is full — open another or grow'
                                  : 'Every slot is full — grow or scrap instead')
           : (cap - filled) + ' of ' + cap + ' slots still free') +
    '<p>A new ship makes you wider; growing a ship makes you taller. Wider fleets roll ' +
    'more dice and cover more numbers. Taller fleets hit harder and lift straight prizes.</p>' +
    '<div class="samefaces">Every ship begins with the same low marks — ' +
      glyph(BOLT, "var(--nrg)", 0.6) + '<b class="nrg">1</b> ' +
      glyph(CHEV, "var(--direct)", 0.62) + '<b class="dir">2</b> ' +
      glyph(CROSS, "var(--hp)", 0.55) + '<b class="hp">3</b> ' +
      glyph(BOLT, "var(--nrg)", 0.6) + '<b class="nrg">4</b>' +
      '. Growth then adds escalating marks: <b class="hp">5 / 7 / 9 repair 1 / 2 / 3</b>, ' +
      'and <b class="dir">6 / 8 / 10 fire 1 / 2 / 3 Direct</b>.</div>' +
    '<div class="ships">' + [4,6,8,10].map(buyCardHtml).join("") + '</div></div>' +

    flagshipSectionHtml();
}
// ── the two reference screens ────────────────────────────────────────────────
// Energy was the one number on the board with no explanation anywhere. You could
// watch it climb for six rounds without ever learning that a single point of it,
// spent at the right moment, is what turns four-in-a-row into five.
function costsView(){
  function row(what, price, why){
    return '<div class="cr"><div class="cw">' + what + '</div>' +
      '<div class="cp">' + price + '</div>' +
      '<div class="cy">' + why + '</div></div>';
  }
  var e = G.you.energy;

  return '<h2>Upgrade costs</h2>' +
    '<p class="say">You have <b class="nrg">' + e + ' Energy</b>' +

    '.</p>' +

    '<div class="card">' +
    shopHead("blue", "Ships", "Bought between rounds") +
    '<div class="ctab">' +
      [4,6,8,10].map(function(sd){
        return row('A <b>d' + sd + '</b>',
          priceOf(sd) + '⚡',
          'Averages ' + ((sd + 1) / 2).toFixed(1) + ' a roll, hits on ' + (sd / 2) +

      }).join("") +
    '</div>' +
    '<p class="hint">You have ' + (openSlots(G.you) - G.you.dice.length) + ' of ' + openSlots(G.you) +

    '<div class="card">' +
    shopHead("gold", "Grow ships in place", "Between rounds, without losing the ship") +
    '<div class="ctab">' +
      row('<b>d4 → d6</b>', growCost(4) + '⚡', 'Adds 1 repair on the 5 and 1 Direct on the 6.') +
      row('<b>d6 → d8</b>', growCost(6) + '⚡', 'Adds 2 repair on the 7 and 2 Direct on the 8.') +
      row('<b>d8 → d10</b>', growCost(8) + '⚡', 'Adds 3 repair on the 9 and 3 Direct on the 10. The ceiling.') +

    '</div>' +
    '<p class="hint">You are on <b style="color:var(--gold)">level ' +

    '</b>.</p></div>' +

    '<div class="card">' +
    shopHead("nrg", "Extra rerolls", "Spent during a round, not after") +
    '<div class="ctab">' +
      row('One more roll of a die, past your ' + K("rollsPerRound") + ' free ones',
          K("rerollCost") + '⚡ each',
          'The only thing Energy buys mid-round. Whatever you send back gambles the ' +

    '</div></div>' +

    '<div class="card">' +
    shopHead("nrg", "Where it comes from", "Every round, without asking") +
    '<div class="ctab">' +
      row('Every <b>1</b> you roll', '+' + K("oneEnergy") + '⚡', 'The best low roll on any die.') +
      row('Every <b>4</b> you roll', '+' + K("fourEnergy") + '⚡', 'And it still hits for 4.') +
      row('Your standing income', '+' + G.you.base + '⚡ a round',
          'The flagship\'s <b>#1</b> face raises this for the rest of the match.') +

}

    '2, 3 and 4 match that exact number; 5 boosts every odd shield and 6 boosts every even ' +
    'attack. ' +
    'Those dice get a thin ring in the flagship\'s colour so you can see it happening. ' +
    'The <b>#1</b> face is the exception: it raises your standing Energy for the rest ' +
    'of the match, so it rings nothing.</p>' +
    '<div class="faceref">' + [1,2,3,4,5,6].map(flagFaceReferenceHtml).join("") +
    '</div></div>' +

    '<div class="card">' +
    shopHead("blue", "Straights", "The reason to reroll") +
    '<p>' + K("runMin") + ' or more numbers in a row across your whole fleet — and your ' +
    'flagship\'s number counts toward the line. <b>Length</b> decides what kind of prize ' +
    'you get; the <b>biggest ship</b> in the line decides how large it is. You may ' +
    'always cash a long straight as a shorter one if you would rather have the Energy ' +
    'than the hit.</p>' + straightTableHtml() + '</div>' +

    '<div class="card">' +
    shopHead("red", "Taking damage", "The defender always chooses") +
    '<p>When their volley gets through you may put <b>as many available ships as you ' +
    'want</b> in front of it. Each blocks damage equal to its own size — a d10 blocks ' +
    '10 — and is then <b>damaged</b> for the next round. Every ship you use is one less ' +
    'die you will roll next round. It returns the round after that.</p>' +
    '<p><b class="dir">Direct</b> is the exception. A <b>2</b> fires ' +
    K("twoDirect") + ' Direct, and growing ships add more chevrons on 6 / 8 / 10. ' +
    'Nothing stops Direct — not shields, not a ship thrown ' +
    'in the way. It always reaches the flagship.</p></div>' +

    '<div class="card">' +
    shopHead("gold", "Winning", "And the long game") +
    '<p>Destroy their flagship. If both fall in the same round, the heavier final volley ' +
    'wins; if those are level, damage across the whole match breaks the tie.</p>' +
    '<p><b>War escalation is the long-game timer.</b> It begins after round ' +
    K("escFrom") + ': both fleets add <b class="red">+' + K("escPer") +
    ' attack in round ' + (K("escFrom") + 1) + '</b>, <b class="red">+' +
    (K("escPer") * 2) + ' in round ' + (K("escFrom") + 2) + '</b>, and another +' +
    K("escPer") + ' each round after that. It does not change your dice or Direct; it ' +
    'only makes ordinary volleys hit harder so a defensive match cannot stall forever.</p>' +
    '</div>' +

    '<div class="row"><button class="go" id="back">Back to the game</button></div>';
}

function tuneView(){
  var rows = Object.keys(C).map(function(k){
    var c = C[k];
    return '<div class="tune">' +
      '<div class="i"><b>' + c.label + '</b>' +
      (c.note ? '<small>' + c.note + '</small>' : '') + '</div>' +
      '<input type="number" data-set="' + k + '" value="' + c.v + '" ' +
      'min="' + c.min + '" max="' + c.max + '" step="' + (c.step || 1) + '"></div>';
  }).join("");
  return '<h2>Tune the game</h2>' +
    '<p class="say">Change anything, then start a fresh match to feel it. ' +
    'These are the numbers worth arguing about \u2014 nothing here is settled.</p>' +
    '<div class="card">' + rows + '</div>' +
    '<div class="row"><button class="go" id="restart">Start a fresh match</button>' +
    '<button id="back">Back to the game</button>' +
    '<button id="reset">Reset to defaults</button></div>';
}

// Everyone fires at once across the galaxy, so both flagships going up in the
// same volley is not an edge case - measured at 18.9% of matches, near enough
// one in five. It needs a real answer rather than a shrug.
//
// The cascade, in order:
//   1. the heavier final volley - decided by the round you just watched, and it
//      lets someone steal it with one enormous last salvo
//   2. most damage across the whole match - level only 4.7% of the time after
//      step one, so this almost always settles it
//   3. a true mutual destruction - which lands in about 1 match in 5,000
function winner(){
  var mine = G.you.hp, yours = G.them.hp, r = G.report || {};
  if (mine > 0 && yours > 0)
    return { who: mine > yours ? "you" : mine < yours ? "them" : "draw", why: "health" };
  if (yours <= 0 && mine > 0) return { who: "you",  why: "kill" };
  if (mine <= 0 && yours > 0) return { who: "them", why: "kill" };
  if ((r.youDealt || 0) !== (r.themDealt || 0))
    return { who: r.youDealt > r.themDealt ? "you" : "them", why: "volley" };
  if (G.you.damage !== G.them.damage)
    return { who: G.you.damage > G.them.damage ? "you" : "them", why: "total" };
  return { who: "draw", why: "mutual" };
}

function overView(){
  var yours = Math.max(0, G.you.hp), theirs = Math.max(0, G.them.hp);
  var v = winner(), r = G.report || {}, headline, sub;
  var won = v.who === "you";

  if (v.why === "kill"){
    headline = won ? "Their flagship is destroyed" : "Your flagship is destroyed";
    var rd = G.round + (G.round === 1 ? " round" : " rounds");
    sub = won ? "You won it in " + rd + "." : "They finished it in " + rd + ".";
  } else if (v.why === "volley"){
    headline = won ? "You win the exchange" : "You lose the exchange";
    sub = "Both flagships went up in round " + G.round +
      ". The heavier final volley takes it — <b>" + (r.youDealt || 0) + "</b> against <b>" +
      (r.themDealt || 0) + "</b>.";
  } else if (v.why === "total"){
    headline = won ? "You win on the record" : "You lose on the record";
    sub = "Both flagships destroyed, and the last volleys were level. " +
      "Damage across the whole match decides it.";
  } else if (v.why === "mutual"){
    headline = "Mutual destruction";
    sub = "Both flagships gone, the final volleys level, and neither of you " +
      "dealt a point more than the other across " + G.round + " rounds. Nobody wins this one.";
  } else {
    headline = v.who === "draw" ? "Dead heat" : won ? "You win on health" : "You lose on health";
    sub = "Neither flagship fell inside " + K("rounds") + " rounds.";
  }
  return '<div class="card center">' +
    '<h3>' + headline + '</h3>' +
    '<div style="font-size:46px;font-weight:800;margin:10px 0" class="hp">' + yours + ' – ' + theirs + '</div>' +
    '<p>' + sub + '</p>' +
    '<p class="say">You dealt <b>' + G.you.damage + '</b> damage across the match; they dealt <b>' +
      G.them.damage + '</b>.</p>' +
    '<button class="go" id="again">Play again</button></div>';
}

function render(){
  var body = G.phase === "tune" ? tuneView()
           : G.phase === "costs" ? costsView()
           : G.phase === "help" ? helpView()
           : G.phase === "brace" ? braceView()
           : G.phase === "roll" ? rollView()
           : G.phase === "report" ? reportView()
           : G.phase === "shop" ? shopView() : overView();
  var label = G.phase === "brace" ? ""
            : G.phase === "roll" ? "Submit round"
            : G.phase === "report" ? (matchOver() ? "See result" : "Continue")
            : G.phase === "shop" ? "Go to round " + G.round : "";

  document.getElementById("app").innerHTML =
    '<div class="wrap"><header><h1>Fleet Dice <button class="ver" id="tune">v' + VERSION + '</button></h1>' +
    '<span><button class="tiny nrg" id="costs">Upgrade costs</button> ' +
    '<span class="pill">' + (G.phase === "over" ? "Finished" : "Round " + G.round) + '</span></span></header>' +
    '<div class="board"><div><div class="who">You</div><div class="val hp">' + Math.max(0, G.you.hp) + '</div></div>' +
    (G.phase === "roll" ? rerollBtnHtml() : '<div class="mid">FLAGSHIP<br>HEALTH</div>') +
    '<div class="r"><div class="who">Them</div><div class="val hp">' + Math.max(0, G.them.hp) + '</div></div></div>' +
    body + '</div>' +
    (G.phase === "over" || G.phase === "tune" || G.phase === "costs" ||
      G.phase === "help" || G.phase === "brace" ? "" :
      '<div class="dock"><div class="dockin"><div class="met">' + dockMetrics() +
      '</div><button class="tiny howto" id="help">How<br>to play</button>' +
      (G.phase === "shop" || (G.phase === "roll" && G.you.rolls > 0)
        ? '<button class="tiny resetpage" id="page-reset">Reset choices<br>on this page</button>' : '') +
      '<button class="go" id="next"' +
        (G.phase === "roll" && G.you.rolls === 0 ? ' disabled' : '') +
        '>' + label + '</button></div></div>');

  wire();
  animate = {};        // consumed - a tap re-renders without replaying it
}

function wire(){
  var n = document.getElementById("next");
  if (n) n.onclick = function(){
    if (G.phase === "roll") submit();
    else if (G.phase === "report") nextRound();
    else if (G.phase === "shop") startRound();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-take]"), function(el){
    el.onclick = function(){
      straightPick = +el.getAttribute("data-take");
      render();
    };
  });
  var rr = document.getElementById("reroll");
  if (rr) rr.onclick = doReroll;
  var pr = document.getElementById("page-reset");
  if (pr) pr.onclick = resetPageChoices;
  var ag = document.getElementById("again");
  if (ag) ag.onclick = newGame;

  Array.prototype.forEach.call(document.querySelectorAll("[data-brace]"), function(el){
    el.onclick = function(){
      var i = +el.getAttribute("data-brace");
      feedShip(i);
    };
  });
  function feedShip(i){
    var d = G.you.dice[i], previousOut = d.out, soak = soakWith(G.you, i);
    pending.fed = pending.fed || [];
    pending.fed.push({ s: d.s, slot: i + 1, soak: soak, previousOut: previousOut });
    pending.soaked += soak;
    render();
  }
  var br = document.getElementById("brace-reset");
  if (br) br.onclick = function(){
    (pending.fed || []).forEach(function(f){
      if (G.you.dice[f.slot - 1]) G.you.dice[f.slot - 1].out = f.previousOut || 0;
    });
    pending.fed = [];
    pending.soaked = 0;
    render();
  };
  var bd = document.getElementById("brace-done");  if (bd) bd.onclick = settleRound;

  var fu = document.querySelector("[data-flagup]");
  if (fu) fu.onclick = function(){
    var lvl = G.you.flag.lvl || 1, cost = flagLvlCost(lvl + 1);
    if (lvl >= 3 || G.you.energy < cost) return;
    G.you.energy -= cost;
    G.you.flag.lvl = lvl + 1;
    toast("Flagship upgraded \u2014 each matching die now gets +" + flagMul(G.you));
    render();
  };

  function returnFromReference(){
    var resume = G.resume || "roll";
    delete G.resume;
    G.phase = resume;
    render();
  }
  function openReference(phase){
    if (G.phase === phase) return returnFromReference();
    if (G.phase !== "costs" && G.phase !== "help" && G.phase !== "tune")
      G.resume = G.phase;
    G.phase = phase;
    render();
  }
  var cs = document.getElementById("costs");
  if (cs) cs.onclick = function(){ openReference("costs"); };
  var hp = document.getElementById("help");
  if (hp) hp.onclick = function(){ openReference("help"); };
  var tn = document.getElementById("tune");
  if (tn) tn.onclick = function(){
    if (G.phase === "tune") return returnFromReference();
    openReference("tune");
  };
  var bk = document.getElementById("back");
  if (bk) bk.onclick = returnFromReference;
  var rs = document.getElementById("restart");
  if (rs) rs.onclick = newGame;
  var rd = document.getElementById("reset");
  if (rd) rd.onclick = function(){ Object.keys(C).forEach(function(k){ C[k].v = DEFAULTS[k]; }); newGame(); };

  Array.prototype.forEach.call(document.querySelectorAll("[data-set]"), function(el){
    el.onchange = function(){
      var k = el.getAttribute("data-set"), c = C[k];
      var v = parseFloat(el.value);
      if (isNaN(v)) v = c.v;
      C[k].v = Math.max(c.min, Math.min(c.max, v));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-die]"), function(el){
    el.onclick = function(){
      var i = el.getAttribute("data-die");
      sel[i] = !sel[i];
      render();
    };
  });
  var fl = document.querySelector("[data-flag]");
  if (fl) fl.onclick = function(){
    sel.flag = !sel.flag;
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-buysize]"), function(el){
    el.onclick = function(){ buyDie(+el.getAttribute("data-buysize")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-grow]"), function(el){
    el.onclick = function(){ growDie(+el.getAttribute("data-grow")); };
  });
  var us = document.querySelector("[data-unlock]");
  if (us) us.onclick = unlockSlot;
  Array.prototype.forEach.call(document.querySelectorAll("[data-sell]"), function(el){
    el.onclick = function(){ sellDie(+el.getAttribute("data-sell")); };
  });
}

function toast(msg){
  var old = document.querySelector(".toast");
  if (old) old.remove();
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2200);
}

newGame();
</script>
</body>
</html>

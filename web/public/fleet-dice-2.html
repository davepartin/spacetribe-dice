// The opponent picks one plan per match so you can read what they want.
// botPace is still the overall rate. The plans spend the same kind of free
// growth actions the old schedule used — they just aim them differently.
var ENEMY_PLANS = {
  width: {
    id: "width",
    name: "Width",
    short: "going wide",
    line: "Enemy is going wide — more ships first, then upgrades."
  },
  capital: {
    id: "capital",
    name: "Capital",
    short: "building capital",
    line: "Enemy is building capital — fewer ships, upgrading the biggest."
  },
  command: {
    id: "command",
    name: "Command",
    short: "flagship command",
    line: "Enemy is on flagship command — levels early, then the fleet."
  }
};
var ENEMY_PLAN_ORDER = ["width", "capital", "command"];

function pickEnemyPlan(){
  var forced = K("enemyPlan");
  if (forced >= 1 && forced <= ENEMY_PLAN_ORDER.length)
    return ENEMY_PLAN_ORDER[forced - 1];
  return ENEMY_PLAN_ORDER[Math.floor(Math.random() * ENEMY_PLAN_ORDER.length)];
}
function enemyPlanInfo(plan){
  return ENEMY_PLANS[plan] || ENEMY_PLANS.width;
}
function enemyPlanLabel(plan){
  return enemyPlanInfo(plan).short;
}

// How often something happens, given a rate per round. A rate of 0.25 fires in one
// round out of four; a rate of 1.5 fires once every round and twice in half of them.
function timesPerRound(rate){
  var n = Math.floor(rate);
  if (Math.random() < rate - n) n++;
  return n;
}

// botPace USED TO BE A COIN FLIP - "Math.random() < pace" - which meant every value
// at or above 1 was identical, because the gate always passed. The Tune panel
// offered a dial up to 3 and two thirds of it did nothing, so there was no way to
// make the opponent harder. It is a RATE now, and it moves in both directions.
//
// Each plan keeps roughly the old action budget at pace 1 (~0.25 buys and ~0.33
// upgrades a round across a match), but aims those actions at width, capital, or
// flagship command so the Enemy fleet has a readable shape.
function themGrow(){
  var t = G.them, pace = K("botPace"), plan = t.plan || "width";
  var i, nx, n, buyRate, growRate, sides, best, score, bestScore;
  if (pace <= 0) return;

  // Levels: command early, capital late, width on the old rounds 4 and 8.
  if (plan === "command"){
    if (G.round === Math.max(2, Math.round(3 / pace))) t.flag.lvl = Math.max(t.flag.lvl || 1, 2);
    if (G.round === Math.max(3, Math.round(6 / pace))) t.flag.lvl = Math.max(t.flag.lvl || 1, 3);
  } else if (plan === "capital"){
    if (G.round === Math.max(3, Math.round(6 / pace))) t.flag.lvl = Math.max(t.flag.lvl || 1, 2);
    if (G.round === Math.max(5, Math.round(11 / pace))) t.flag.lvl = Math.max(t.flag.lvl || 1, 3);
  } else {
    if (G.round === Math.max(2, Math.round(4 / pace))) t.flag.lvl = Math.max(t.flag.lvl || 1, 2);
    if (G.round === Math.max(3, Math.round(8 / pace))) t.flag.lvl = Math.max(t.flag.lvl || 1, 3);
  }

  buyRate  = plan === "width" ? 0.34 : plan === "capital" ? 0.16 : 0.24;
  growRate = plan === "width" ? 0.24 : plan === "capital" ? 0.40 : 0.30;

  for (n = timesPerRound(buyRate * pace); n > 0; n--){
    if (t.dice.length >= K("maxDice")) break;
    if (t.dice.length >= openSlots(t)) t.slots = Math.min(K("maxDice"), openSlots(t) + 1);
    sides = 4;
    if (plan === "capital" && t.dice.length >= 5) sides = 6;
    t.dice.push(newShip(sides));
  }

  for (n = timesPerRound(growRate * pace); n > 0; n--){
    best = -1;
    bestScore = null;
    for (i = 0; i < t.dice.length; i++){
      nx = nextSize(t.dice[i].s);
      if (!nx) continue;
      // Width upgrades the smallest; capital the largest; command prefers mid
      // sizes so the board stays mixed rather than one hero ship.
      if (plan === "capital") score = t.dice[i].s * 10 + i;
      else if (plan === "command") score = (t.dice[i].s === 6 ? 30 : t.dice[i].s === 4 ? 20 : 10) - i;
      else score = (20 - t.dice[i].s) * 10 - i;
      if (best < 0 || score > bestScore){ best = i; bestScore = score; }
    }
    if (best < 0) break;
    t.dice[best].s = nextSize(t.dice[best].s);
  }
}

// ── views ────────────────────────────────────────────────────────────────
// The hull is the shape: triangle for a d4, square for a d6, diamond for a d8,
// pentagon for a d10. Once the silhouette carries the size, the little "d4"
// caption is redundant and comes off - you read the ship at a glance instead of
// reading a label.
//
// Numbers sit at each shape's visual centre, which is not the same as its
// geometric one. A triangle's mass is low so the digit drops; a pentagon's is
// slightly high so it lifts.
// Each hull has its own centre of mass, so the number and the Energy bolts sit
// where they would actually be printed on that face rather than at the geometric
// middle. A triangle is widest at the bottom, so its bolts tuck low; a diamond
// narrows fast, so its number rides higher to leave room beneath.
//
// The bolts are large now, which makes the polygon walls the real constraint. A
// bolt at scale r is 12r tall and about 7r wide, so two of them at boltY need
// (9r + 7r) of clear width there. The diamond is the tightest — at y 76 it is
// only 34 units across — so it runs smaller bolts than the others.
var HULLS = {
  // Placed by measuring, not by eye. A checker walks every corner of the digit
  // and every vertex of every mark, and reports its distance to the hull outline
  // - negative if it has escaped. Nothing sits closer than 3.5 units to an edge.
  //
  // Eyeballing this failed three times in a row, because the two hulls that go
  // wrong are the two that narrow: the triangle toward its apex and its base
  // corners, and the diamond in both directions at once. The square and the
  // pentagon have room everywhere and never needed touching.
  //
  // The triangle carries the smallest marks in the game (1.10 against the
  // pentagon's 1.80) and that is simply how much room a triangle has once a
  // full-size number is in it.
  4:  { pts:"50,10 93,84 7,84",            textY:63, scale:0.95, boltY:73, boltR:1.10 },
  6:  { pts:"15,15 85,15 85,85 15,85",     textY:48, scale:0.92, boltY:68, boltR:1.70 },
  8:  { pts:"50,6 92,50 50,94 8,50",       textY:50, scale:0.95, boltY:62, boltR:1.42 },
  10: { pts:"50,5 94,38 77,92 23,92 6,38", textY:52, scale:1.00, boltY:72, boltR:1.80 }
};

// One small lightning glyph, drawn rather than typed, so it scales cleanly and
// never turns into an emoji on someone's phone.
var BOLT = "M0,-6 L-3.4,1 L-0.6,1 L-2.4,6 L3.4,-1.4 L0.6,-1.4 Z";
// A medical cross, drawn at the same 12-unit height as the bolt so the two
// symbols sit in exactly the same place on the face and read as siblings.
var CROSS = "M-2,-6 L2,-6 L2,-2 L6,-2 L6,2 L2,2 L2,6 L-2,6 L-2,2 L-6,2 L-6,-2 L-2,-2 Z";
// Direct: a double chevron. It points, because that is what the damage does - it
// goes through rather than landing on something.
var CHEV = "M-4,-6 L1.2,0 L-4,6 L-1.2,6 L4,0 L-1.2,-6 Z";

// One row of symbols, centred, drawn inside the hull below the number. Bolts on
// a 1 or a 2, crosses on a 3 - never both, so they can share the same slot.
function marksSvg(count, glyph, colour, y, r, gap, cls){
  if (!count) return "";
  var out = "", start = -(gap * (count - 1)) / 2, i;
  for (i = 0; i < count; i++){
    out += '<path class="' + cls + '" d="' + glyph + '" fill="' + colour + '" ' +
      'transform="translate(' + (50 + start + i * gap) + ',' + y + ') scale(' + r + ')"/>';
  }
  return out;
}
function boltsSvg(count, boltY, r){
  return marksSvg(count, BOLT, "var(--nrg)", boltY, r, 9 * r, "mk");
}
// The cross is 12 units across where the bolt is only 7. Two things ran the
// three of them together into a solid bar: the bolt's gap was narrower than a
// cross, and the hull's glow is a 5px drop-shadow, which bled across whatever
// space was left. So crosses get a smaller scale, a much wider gap, and a
// tighter shadow of their own (see .hull path.cr).
// Gap tuned by eye against the glyph: a space about 60% of a cross's width
// reads as three symbols without drifting apart. 13r was too airy, 9r too tight.
function crossesSvg(count, y, r){
  return marksSvg(count, CROSS, "var(--hp)", y, r * 0.52, 10 * r, "cr");
}
// The chevrons are PRINTED on every 2 in full violet, always - the same as the
// yellow bolts on a 1 and a 4, and the green crosses on a 3. A face's picture does
// not come and go, and it does not fade either.
//
// I got this wrong twice: first hiding the mark, then dimming it, both times
// reasoning that it should not advertise damage that is not landing. It is the
// wrong worry. The die must read the same every time you look at it, and the
// signal for "Direct is live this round" belongs on the CARD, not on the ink -
// which is what the violet border does.
function chevronsSvg(count, y, r){
  return marksSvg(count, CHEV, "var(--direct)", y, r * 0.9, 9 * r, "ch");
}

// The flagship is a die too, so it gets a hull like everything else - a rounded
// d6 face. Its solid face colour teaches which bonus fired this round, while the
// gold ring says "flagship." Same number size as the ships, so the grid reads as
// one family.
// Which colour a face is boosting. The flagship is painted SOLID in it - not a
// percentage of it - so it is exactly the red you see on a red ship, the exact
// green of the crosses, the exact violet of the chevrons.
//
// A solid face needs a number you can read on it, and white fails on the light
// colours: on yellow it measures 1.2:1, which is barely there. So each face
// carries its own dark ink, tinted toward its own colour rather than plain
// black. Every one clears 5:1, and yellow clears 13:1.
var FLAGTINT = {
  energy2: { fill:"var(--nrg)",    ink:"#211a02" },
  reactor: { fill:"var(--nrg)",    ink:"#211a02" },
  repair:  { fill:"var(--hp)",     ink:"#06291b" },
  direct:  { fill:"var(--direct)", ink:"#1e1233" },
  defEach: { fill:"var(--blue)",   ink:"#062a47" },
  atkEach: { fill:"var(--red)",    ink:"#3d0812" }
};
function flagTint(id){ return FLAGTINT[id] || { fill:"#f2f5ff", ink:"#101828" }; }
function parsePts(pts){
  return String(pts).trim().split(/\s+/).map(function(p){
    var xy = p.split(",");
    return { x:+xy[0], y:+xy[1] };
  });
}
function die3d(svg, delay){
  return '<div class="die-3d"' +
    (delay ? ' style="animation-delay:' + delay + 'ms"' : "") + '>' + svg + '</div>';
}
function flagHullSvg(n, id){
  var t = flagTint(id);
  var gid = "fg" + (++hullGradSeq);
  var show = n === "" || n === 0 || n == null ? "" : String(n);
  return '<svg class="hull" viewBox="-6 -6 112 118" aria-hidden="true">' +
    '<defs>' +
      '<linearGradient id="' + gid + '" x1="18%" y1="8%" x2="88%" y2="92%">' +
        '<stop offset="0%" stop-color="#fff6d0"/>' +
        '<stop offset="42%" stop-color="' + t.fill + '"/>' +
        '<stop offset="100%" stop-color="#7a5a10"/>' +
      '</linearGradient>' +
    '</defs>' +
    '<ellipse cx="50" cy="102" rx="30" ry="7" fill="#000" opacity=".42"/>' +
    '<rect x="18" y="20" width="70" height="70" rx="16" fill="#6b4e0c"/>' +
    '<rect x="11" y="11" width="78" height="78" rx="17" fill="url(#' + gid + ')" ' +
      'stroke="#f7e7a0" stroke-width="3"/>' +
    '<rect x="20" y="20" width="60" height="60" rx="11" fill="none" ' +
      'stroke="' + t.ink + '" stroke-opacity="0.22" stroke-width="1"/>' +
    '<ellipse cx="36" cy="30" rx="22" ry="12" fill="#fff" opacity=".22"/>' +
    (show
      ? '<g class="face-ink"><text x="50" y="63" text-anchor="middle" fill="' + t.ink +
        '" font-size="36.8" font-weight="800" style="font-variant-numeric:tabular-nums">' +
        show + '</text></g>'
      : '') +
    '</svg>';
}

// The legend draws the SAME paths the dice do, at a readable size. If a symbol
// ever changes, the key changes with it - it cannot go stale.
function glyph(path, colour, scale){
  return '<svg class="gly" viewBox="-8 -8 16 16" aria-hidden="true">' +
    '<path d="' + path + '" fill="' + colour + '" transform="scale(' + (scale || 1) + ')"/></svg>';
}
// How to read a die. One row per face, so the 1 and the 2 are visibly separate
// things - they were crammed into one run before and you could not tell where
// one ended and the next began.
function keyRow(face, colour, marks, does){
  return '<div class="krow">' +
    '<b style="color:' + colour + '">' + face + '</b>' +
    '<span class="kmark">' + marks + '</span>' +
    '<span class="kdoes">' + does + '</span></div>';
}
function legendHtml(){
  return '<h3 class="ktitle">How to read a die</h3>' +
    '<p class="say">Every ship rolls one face. <span class="red">Even numbers hit</span>, ' +
    '<span class="blue">odd numbers block</span>. Printed marks do a second job on top, ' +
    'and every mark always pays.</p>' +
    '<div class="ktab">' +
      keyRow("1", "var(--nrg)", glyph(BOLT, "var(--nrg)", 1.05).repeat(K("oneEnergy")),
        'blocks for <b>1</b>, and pays <b class="nrg">' + K("oneEnergy") + ' Energy</b>') +
      keyRow("2", "var(--direct)", glyph(CHEV, "var(--direct)", 0.95).repeat(K("twoDirect")),
        'hits for <b>2</b>, and fires <b class="dir">' + K("twoDirect") + ' Direct</b> \u2014 ' +
        'unblockable damage to the Enemy flagship, always') +
      keyRow("3", "var(--hp)", glyph(CROSS, "var(--hp)", 0.78).repeat(Math.min(K("healThree"), 4)),
        'blocks for <b>3</b>, and <b class="hp">repairs ' + K("healThree") + '</b>') +
      keyRow("4", "var(--nrg)", glyph(BOLT, "var(--nrg)", 1.05).repeat(K("fourEnergy")),
        'hits for <b>4</b>, and pays <b class="nrg">' + K("fourEnergy") + ' Energy</b>') +
      keyRow("5+", "var(--dim)", glyph(CROSS, "var(--hp)", 0.78) +
        glyph(CHEV, "var(--direct)", 0.95),
        'upgrading a ship adds escalating repair on 5 / 7 / 9 and Direct on 6 / 8 / 10') +
    '</div>';
}

function faceMarksHtml(value){
  var marks = "";
  if (energyOf(value)) marks += glyph(BOLT, "var(--nrg)", 0.78).repeat(energyOf(value));
  if (healOf(value)) marks += glyph(CROSS, "var(--hp)", 0.66).repeat(healOf(value));
  if (directOf(value)) marks += glyph(CHEV, "var(--direct)", 0.72).repeat(directOf(value));
  return marks || '<span style="color:var(--slot)">—</span>';
}
function faceEffectText(value){
  var parts = [value % 2 === 0 ? 'hits for ' + value : 'blocks for ' + value];
  if (energyOf(value)) parts.push('earns ' + energyOf(value) + ' Energy');
  if (healOf(value)) parts.push('repairs ' + healOf(value));
  if (directOf(value)) parts.push('fires ' + directOf(value) + ' Direct');
  return parts.join(' · ');
}
function allDiceFacesHtml(){
  var rows = "";
  for (var value = 1; value <= 10; value++){
    rows += keyRow(
      String(value),
      value % 2 === 0 ? "var(--red)" : "var(--blue)",
      faceMarksHtml(value),
      faceEffectText(value)
    );
  }
  return '<div class="ktab">' + rows + '</div>';
}

function hullSvg(size, value, kind){
  var h = HULLS[size] || HULLS[6];
  var pal = kind === "attack"
    ? { light:"#ff8b96", mid:"#ff4d5e", dark:"#8f1826", left:"#c43344", right:"#6d101c", ink:"#fff7f8" }
    : kind === "defense"
    ? { light:"#8ad4ff", mid:"#3aabef", dark:"#155a8c", left:"#2b86c4", right:"#0e3f66", ink:"#f4fbff" }
    : { light:"#d8e1ee", mid:"#8fa0b6", dark:"#3a4658", left:"#6b7a90", right:"#2a3444", ink:"#f4f7fb" };
  var gid = "dg" + (++hullGradSeq);
  var top = parsePts(h.pts);
  var lift = 6;
  var bot = top.map(function(p){ return { x:p.x, y:p.y + lift }; });
  var sides = "", i, j, a, b, c, d, mx;
  for (i = 0; i < top.length; i++){
    j = (i + 1) % top.length;
    a = top[i]; b = top[j]; c = bot[j]; d = bot[i];
    mx = (a.x + b.x) / 2;
    sides += '<polygon points="' +
      a.x + "," + a.y + " " + b.x + "," + b.y + " " + c.x + "," + c.y + " " + d.x + "," + d.y +
      '" fill="' + (mx < 50 ? pal.left : pal.right) + '"/>';
  }
  var show = value === "" || value == null ? "" : String(value);
  var marks = "";
  if (kind !== "dry" && value){
    marks = boltsSvg(energyOf(value), h.boltY, h.boltR) +
      crossesSvg(healOf(value) ? Math.min(healOf(value), 4) : 0, h.boltY, h.boltR) +
      chevronsSvg(Math.min(directOf(value), 4), h.boltY, h.boltR);
  }
  return '<svg class="hull" viewBox="-4 -4 108 118" aria-hidden="true">' +
    '<defs>' +
      '<linearGradient id="' + gid + '" x1="18%" y1="6%" x2="86%" y2="94%">' +
        '<stop offset="0%" stop-color="' + pal.light + '"/>' +
        '<stop offset="48%" stop-color="' + pal.mid + '"/>' +
        '<stop offset="100%" stop-color="' + pal.dark + '"/>' +
      '</linearGradient>' +
      '<clipPath id="cl' + gid + '"><polygon points="' + h.pts + '"/></clipPath>' +
    '</defs>' +
    '<ellipse cx="50" cy="104" rx="28" ry="7" fill="#000" opacity=".4"/>' +
    sides +
    '<polygon points="' + h.pts + '" fill="url(#' + gid + ')" ' +
      'stroke="' + pal.light + '" stroke-width="2.2" stroke-linejoin="round"/>' +
    '<g clip-path="url(#cl' + gid + ')">' +
      '<ellipse cx="38" cy="32" rx="18" ry="10" fill="#fff" opacity=".28"/>' +
    '</g>' +
    '<g class="face-ink">' +
      (show
        ? '<text x="50" y="' + h.textY + '" text-anchor="middle" fill="' + pal.ink + '" ' +
          'stroke="#1a1020" stroke-width=".7" paint-order="stroke" ' +
          'font-size="' + (40 * h.scale) + '" font-weight="800" ' +
          'style="font-variant-numeric:tabular-nums">' + show + '</text>'
        : '') +
      marks +
    '</g>' +
    '</svg>';
}

// A thin ring in the flagship's own colour round every die that is feeding it
// this round. It used to appear for Direct alone, which quietly said the other
// five faces were doing less - they are not, they multiply just as hard.
//
// The tests below must stay a mirror of applyFace: whatever it counts is what
// gets ringed. A ring round a die that is not paying would be worse than no ring
// at all. The #1 face is deliberately absent - the Reactor raises your standing
// income and does not care what any die shows, so there is nothing to point at.
function feedsFlag(value){
  if (!G || !G.you) return "";
  var f = FACES[flagFace(G.you)];
  if (!f || !f.gives) return "";          // the Reactor matches no die, so no ring
  return faceMatches(f, value) ? " feeds " + f.ring : "";
}

function dieHtml(d, i, clickable){
  var delay = (i % 4) * 45;
  var spin = animate[i] ? " rolled spin-" + (rollSpin[i] || 0) : "";
  if (d.dead){
    return '<div class="die fleet-die hurt ready-die"><span class="slotno">' + (i + 1) + '</span>' +
      die3d(hullSvg(d.sides, 0, "dry")) + '<div class="kind die-caption">Damaged</div></div>';
  }
  if (G.you.rolls === 0){
    return '<div class="die fleet-die ready noPick ready-die"><span class="slotno">' + (i + 1) + '</span>' +
      die3d(hullSvg(d.sides, "", "dry")) + '<div class="kind die-caption">Ready</div></div>';
  }
  var k = kindOf(d.value);
  var cls = k === "attack" ? "r attack-die" : "b shield-die";
  var label = k === "attack" ? "Attack" : "Shield";
  var extra = (d.inrun ? " inrun" : "") + spin + feedsFlag(d.value);
  return '<div class="die fleet-die ' + cls + (sel[i] ? " sel selected" : "") + extra + '"' +
    (clickable ? ' data-die="' + i + '"' : '') + '>' +
    (sel[i] ? '<span class="reroll-mark">REROLL</span>' : '') +
    (d.inline ? '<i class="nrg-line" aria-hidden="true"></i>' : '') +
    (d.incol ? '<i class="atk-line" aria-hidden="true"></i>' : '') +
    '<span class="slotno">' + (i + 1) + '</span>' +
    die3d(hullSvg(d.sides, d.value, k), animate[i] ? delay : 0) +
    '<div class="kind die-caption">' + label + '</div></div>';
}

// Nine cells. The flagship holds the middle; the fleet forms up around it.
// Every slot around the flagship is numbered 1 to 8, filled or empty, so a ship
// has an address. "The d8 in slot 3" beats "the third one along" the moment two
// ships are the same size - which is most of the time.
function gridHtml(){
  var cells = [], fleet = G.you.values.slice(0, 8), i, ix;
  for (i = 0; i < 9; i++){
    if (i === 4){ cells.push(flagHtml()); continue; }
    ix = i < 4 ? i : i - 1;
    cells.push(ix < fleet.length
      ? dieHtml(fleet[ix], ix, G.you.rolls > 0)
      : '<div class="empty-slot"><span>' + (ix + 1) + '</span><small>slot free</small></div>');
  }
  return '<div class="grid fleet-formation">' + cells.join("") + '</div>';
}

function flagHtml(){
  var id = flagFace(G.you), p = FACES[id], n = flagNumber(G.you);
  var spin = animate.flag ? " rolled spin-" + (rollSpin.flag || 0) : "";
  if (G.you.rolls === 0){
    return '<div class="die fleet-die flag ready noPick ready-die">' +
      die3d(flagHullSvg("", id)) + '<div class="fcap die-caption">Ready</div></div>';
  }
  return '<div class="die fleet-die flag' + (sel.flag ? ' sel selected' : '') +
    (flagInLine ? ' inrun' : '') + spin + '" data-flag="1">' +
    (sel.flag ? '<span class="reroll-mark">REROLL</span>' : '') +
    (flagInline ? '<i class="nrg-line" aria-hidden="true"></i>' : '') +
    (flagIncol ? '<i class="atk-line" aria-hidden="true"></i>' : '') +
    die3d(flagHullSvg(n, id), animate.flag ? 30 : 0) +
    '<div class="fcap die-caption flag-caption" style="color:' + flagTint(id).fill + '">' +
      (p.shortF ? p.shortF(flagMul(G.you)) : (p.short || p.name)) + '</div>' +
    '</div>';
}

// A small reference so the payoffs are never a mystery.
// How long a line a given biggest ship can head. Small ships (d4) can use the
// flagship to stretch one number past their hull. The flagship only rolls 1–6,
// so a d6 already covers the whole flagship range and cannot make seven in a
// row — that needs a d8 or d10 to show a 7.
function reachable(length, biggest){
  var maxLen = biggest < 6 ? biggest + 1 : biggest;
  return length <= maxLen;
}
function straightTableHtml(){
  var sizes = [4,6,8,10], rows = "";
  var lo = K("runMin");
  for (var L = lo; L <= lo + 2; L++){
    rows += '<tr><td>' + L + ' in a row</td>';
    for (var i = 0; i < sizes.length; i++){
      if (!reachable(L, sizes[i])){
        rows += '<td class="na" title="A d' + sizes[i] + ' only rolls 1 to ' + sizes[i] +
          ', so it cannot make ' + L + ' in a row">\u2014</td>';
        continue;
      }
      var r = straightReward(L, sizes[i]);
      // The top tier pays a hull AND damage; showing only the hull undersold the
      // best prize in the game.
      rows += '<td>' + (r.kind === "energy" ? r.energy + "\u26a1"
                      : r.kind === "ship" ? "d" + r.ship + " +" + r.attack
                      : r.attack) + '</td>';
    }
    rows += '</tr>';
  }
  return '<table class="stab"><tr><th>biggest ship</th>' +
    sizes.map(function(s){ return '<th>d' + s + '</th>'; }).join("") + '</tr>' + rows +
    '</table>';
}
function lineTableHtml(){
  var sizes = [4,6,8,10], nrg = '<tr><td>Across · Energy</td>', atk = '<tr><td>Down · Attack</td>', i, p;
  for (i = 0; i < sizes.length; i++){
    p = linePrize(sizes[i]);
    nrg += '<td class="pay-nrg">' + p + '\u26a1</td>';
    atk += '<td class="pay-atk">' + p + '</td>';
  }
  return '<table class="stab"><tr><th>die size</th>' +
    sizes.map(function(s){ return '<th>d' + s + '</th>'; }).join("") + '</tr>' +
    nrg + '</tr>' + atk + '</tr></table>';
}

// What this roll is currently worth. It belongs at the top, under the health,
// because it is the answer to "how am I doing" - and you want that before you
// start deciding which dice to send back.
function totalsHtml(t){
  return '<div class="tot live-tot">' +
    '<div class="a"><div class="n">' + t.attack + '</div><div class="l">Attack</div></div>' +
    '<div class="d"><div class="n">' + t.defense + '</div><div class="l">Shields</div></div>' +
    '<div class="e"><div class="n">' + t.energy + '</div><div class="l">Energy</div></div>' +
    '<div class="h"><div class="n">' + t.heal + '</div><div class="l">Repair</div></div>' +
    '<div class="dir"><div class="n">' + t.direct + '</div><div class="l">Direct</div></div>' +
    '</div>';
}

// Fire locks the roll from the top of the board — red, obvious, hard to miss.
// Roll / reroll lives under the dice, because that is the button you press most.
function fireBtnHtml(){
  if (G.phase !== "roll" || G.you.rolls === 0) return "";
  return '<button class="fire-btn" id="fire"' + (rollBusy ? ' disabled' : '') +
    '>Fire<small>' + (rollBusy ? 'Dice are rolling…' : 'Lock this roll') + '</small></button>';
}
function rerollBtnHtml(){
  if (G.you.rolls === 0){
    return '<button class="roll-under go" id="reroll"' + (rollBusy ? ' disabled' : '') +
      '>Roll 1 of ' + K("rollsPerRound") +
      '<small>' + (rollBusy ? 'Rolling…' : 'Roll every ready die') + '</small></button>';
  }
  var picked = pickedDice().length;
  var chosen = picked + (sel.flag ? 1 : 0);
  var payCost = chosen * K("rerollCost");
  if (G.you.rolls < K("rollsPerRound")){
    return '<button class="roll-under go" id="reroll"' +
      (chosen && !rollBusy ? '' : ' disabled') + '>' +
      'Roll ' + (G.you.rolls + 1) + ' of ' + K("rollsPerRound") +
      '<small>' + (rollBusy ? 'Rolling…' : chosen ? chosen + ' selected' : 'Select dice to reroll') +
      '</small></button>';
  }
  return '<button class="roll-under" id="reroll"' +
    (chosen && !rollBusy && G.you.energy >= payCost ? '' : ' disabled') + '>' +
    'Energy reroll' +
    '<small>' + (rollBusy ? 'Rolling…' : (payCost || K("rerollCost")) + '\u26a1') + '</small></button>';
}

// The bottom bar. Two different numbers on this screen were both called Energy -
// the counter at the top is what this ROLL earns, the bar is what you have BANKED
// to spend - so the bar now says Banked, and shows where it lands once the round
// is paid in. Base is the standing income the Reactor builds, which was invisible
// until now even though it is the only thing on your flagship that lasts.
function dockMetrics(){
  var earning = (G.phase === "roll" && lastTally) ? lastTally.energy + G.you.base : 0;
  return '<div class="big"><div class="n p">' + G.you.energy +
      (earning ? '<span class="soon">\u2192 ' + (G.you.energy + earning) + '</span>' : '') +
      '</div><div class="l">Energy bank</div></div>' +
    '<div><div class="n' + (G.you.base ? ' p' : '') + '">' +
      (G.you.base ? '+' + G.you.base : '0') + '</div>' +
      '<div class="l">Base energy<br>per round</div></div>' +
    '<div><div class="n">' + G.you.dice.length + '/' + openSlots(G.you) +
      '</div><div class="l">Ships /<br>open slots</div></div>';
}

// The straight is the biggest thing that can happen in a round and the board was
// nearly silent about it - four dice picked up an orange underline and that was
// all. Worse, the RULE that a long straight may be cashed as a shorter one had no
// control anywhere, so `straightPick` was never set by a human and the report's
// "cashed as 5" branch was unreachable. This is that missing screen.
function straightTiers(length){
  var out = [], L, top = Math.min(length, 7);
  for (L = K("runMin"); L <= top; L++) out.push(L);
  return out;
}

function straightBannerHtml(t){
  if (!t.run) return "";
  var r = t.run, tiers = straightTiers(r.length), taken = r.taken || r.length;
  var h = '<section class="straight-panel"><div>' +
    '<p class="eyebrow">STRAIGHT FOUND · ' + r.start + '\u2013' + r.top + '</p>' +
    '<h2>Choose how to cash it.</h2></div>';
  if (tiers.length > 1){
    h += '<div class="straight-options">' +
      tiers.slice().reverse().map(function(L){
        var rw = straightReward(L, r.biggest);
        return '<button class="' + (L === taken ? 'on' : '') + '" data-take="' + L + '">' +
          '<b>' + L + ' straight</b><span>' + rw.label + '</span></button>';
      }).join("") + '</div>';
  } else {
    h += '<div class="straight-options"><button class="on"><b>' + r.length +
      ' straight</b><span>' + r.reward.label + '</span></button></div>';
  }
  return h + '</section>';
}

function guideHtml(){
  // Guided tips removed — How to play is the teaching surface.
  return "";
}

function flagTokenHtml(t){
  if (G.you.rolls < 1) return "";
  var hint = (t && t.run)
    ? ""
    : '<em class="flag-token-hint">Straights earn a bonus</em>';
  var copy = '<div class="flag-token-copy"><span>Token</span>' +
    '<strong>' + (G.you.flag.token ? 'Turn flagship' : 'Spent') + '</strong>' +
    hint + '</div>';
  if (!G.you.flag.token){
    return '<section class="flag-token spent">' + copy + '</section>';
  }
  return '<section class="flag-token">' + copy +
    '<div class="flag-token-btns"><button data-flagturn="-1">−1</button>' +
    '<button data-flagturn="1">+1</button></div></section>';
}

function rollView(){
  if (G.you.rolls === 0){
    flagInLine = false;
    flagInline = false;
    flagIncol = false;
    lastTally = null;
    return '<p class="say">Every available ship and your flagship will roll. Use the button under the fleet.</p>' +
      gridHtml() +
      '<div class="roll-slot">' + rerollBtnHtml() + '</div>';
  }
  var live = runDice(G.you);
  var t = tally(live, flagFace(G.you), flagMul(G.you), straightPick, G.you.values);
  lastTally = t;
  var fn = flagNumber(G.you);
  flagInLine = !!(t.run && fn >= t.run.start && fn <= t.run.top);
  flagInline = false;
  flagIncol = false;
  for (var si = 0; si < G.you.values.length; si++){
    G.you.values[si].inrun = false;
    G.you.values[si].inline = false;
    G.you.values[si].incol = false;
  }
  if (t.run){
    for (var v = t.run.start; v <= t.run.top; v++){
      for (si = 0; si < G.you.values.length; si++){
        if (!G.you.values[si].dead && G.you.values[si].value === v){
          G.you.values[si].inrun = true;
          break;
        }
      }
    }
  }
  (t.lines || []).forEach(function(L){
    L.idx.forEach(function(cell){
      if (cell === 4){
        if (L.kind === "row") flagInline = true;
        else flagIncol = true;
        return;
      }
      var ix = cell < 4 ? cell : cell - 1;
      if (G.you.values[ix]){
        if (L.kind === "row") G.you.values[ix].inline = true;
        else G.you.values[ix].incol = true;
      }
    });
  });
  return flagTokenHtml(t) +
    straightBannerHtml(t) +
    totalsHtml(t) +
    gridHtml() +
    '<div class="roll-slot">' + rerollBtnHtml() + '</div>';
}

// You have seen the number. Now: does it all land on the flagship, or do you
// feed it a ship or two and limp into the next round?
function braceView(){
  var p = pending, left = Math.max(0, p.incoming - p.soaked);
  var used = p.fed ? p.fed.length : 0, room = K("soakMax") - used;
  var total = left + p.direct;
  var doomed = total >= G.you.hp + (p.you.heal || 0);

  var h = '<header class="brace-header">' +
    '<p class="eyebrow">ENEMY VOLLEY</p>' +
    '<h1 class="brace-title">' + (doomed ? 'Flagship will fall' : 'Taking damage') + '</h1>' +
    '<p class="brace-lead">Choose ships to protect your flagship. Each ship you tap blocks its size, then is <b>damaged for one round</b>. <b class="dir">Direct</b> cannot be blocked.</p>' +
    '</header>' +
    '<div class="tot three">' +
      '<div class="a"><div class="n">' + left + '</div><div class="l">Volley left</div></div>' +
      '<div class="dir"><div class="n">' + p.direct + '</div><div class="l">Direct</div></div>' +
      '<div class="h"><div class="n">' + total + '</div><div class="l">To flagship</div></div>' +
    '</div>';

  if (p.fed && p.fed.length){
    h += '<p class="say">' + p.fed.map(function(f){
      return 'Your <b>d' + f.s + '</b> in slot ' + f.slot + ' took <b>' + f.soak + '</b>';
    }).join(' \u00b7 ') + '.</p>';
  }

  var cells = [], fleet = G.you.dice, i, ix, d, hurt, pick;
  for (i = 0; i < 9; i++){
    if (i === 4){
      cells.push('<div class="die fleet-die flag brace-flagship static"><div class="brace-flag-label">Flagship Health</div>' +
        '<strong class="brace-flag-hp">' + Math.max(0, G.you.hp) + '</strong>' +
        '<span class="brace-flag-risk">' + (total > 0 ? 'Takes ' + total : 'Safe') + '</span></div>');
      continue;
    }
    ix = i < 4 ? i : i - 1;
    d = fleet[ix];
    if (!d){ cells.push('<div class="empty-slot"><span>' + (ix+1) + '</span></div>'); continue; }
    hurt = isDamaged(d);
    pick = !hurt && left > 0 && room > 0;
    var picked = p.fed && p.fed.some(function(f){ return f.slot === ix + 1; });
    cells.push('<div class="die fleet-die brace-ship-die' + (hurt ? " hurt" : "") + (picked ? " selected" : "") + (pick ? "" : " noPick") + '"' +
      (pick ? ' data-brace="' + ix + '"' : '') + '>' +
      '<span class="slotno">' + (ix+1) + '</span>' +
      die3d(hullSvg(d.s, "", hurt ? "dry" : "defense")) +
      '<div class="kind die-caption">' + (hurt ? "Damaged" : picked ? "Blocking " + soakOf(d.s) : pick ? "Tap — Block " + soakOf(d.s)
        : "d" + d.s) + '</div></div>');
  }
  h += '<div class="grid fleet-formation">' + cells.join("") + '</div>';
  return h;
}

// Both rolls, side by side, sorted low to high. Sorting is what makes a straight
// legible: any value inside the run sits contiguously once sorted, so the whole
// line can be wrapped in one gold box and read as 3-4-5-6-7 at a glance. Slot
// order carries no meaning by the time the round is over - the notes below still
// name the slot for anything that mattered.
function rollRow(label, dice, run, taken){
  var sorted = dice.slice().sort(function(a, b){ return a.value - b.value; });
  var lo = run ? run.start : 1e9, hi = run ? run.top : -1;
  var pre = [], mid = [], post = [], i, d;

  function chip(d){
    if (d.flag){
      var tint = flagTint(d.face);
      return '<span class="chip fl" style="background:' + tint.fill +
        ';color:' + tint.ink + '">' + d.value + '</span>';
    }
    var k = kindOf(d.value);
    return '<span class="chip ' + (k === "attack" ? "red" : k === "defense" ? "blue" : "nrg") +
      '">' + d.value + '</span>';
  }
  for (i = 0; i < sorted.length; i++){
    d = sorted[i];
    if (d.value < lo) pre.push(chip(d));
    else if (d.value <= hi) mid.push(chip(d));
    else post.push(chip(d));
  }

  var verdict;
  if (!run){
    verdict = '<span class="no">no straight</span>';
  } else if (taken && taken < run.length){
    verdict = '<b>' + run.length + ' in a row</b> \u2014 cashed as ' + taken +
      ' for <b>' + run.reward.label + '</b>';
  } else {
    verdict = '<b>' + run.length + ' in a row</b> \u2014 <b>' + run.reward.label + '</b>';
  }

  return '<div class="rr"><div class="rl">' + label + '</div>' +
    '<div class="chips">' + pre.join("") +
      (mid.length ? '<span class="runbox">' + mid.join("") + '</span>' : "") +
      post.join("") + '</div></div>' +
    '<div class="verd' + (run ? " win" : "") + '">' + verdict + '</div>';
}

function reportView(){
  var r = G.report, bump = r.bump || 0;

  // Every line has to add up on screen. Before v67 the total quietly folded in
  // Direct, so a player reading "attacked with 12, shields blocked 7, so 9 got
  // through" was looking at arithmetic that was wrong by exactly the Direct.
  function lr(label, val, cls, kind){
    return '<div class="lr' + (cls ? " tone-" + cls : "") +
      (kind ? " " + kind : "") + '"><span>' + label + '</span>' +
      '<b' + (cls ? ' class="' + cls + '"' : '') + '>' + val + '</b></div>';
  }
  function faceTone(id){
    var gives = FACES[id].gives;
    if (gives === "attack") return "red";
    if (gives === "defense") return "blue";
    if (gives === "heal") return "hp";
    if (gives === "direct") return "dir";
    return "nrg";
  }
  function faceEffect(id){
    return '<b class="' + faceTone(id) + '">' + FACES[id].name + '</b>';
  }
  function rewardEffect(run){
    var cls = run.reward.kind === "energy" ? "nrg" : "red";
    return '<b class="' + cls + '">' + run.reward.label + '</b>';
  }

  // ── your shot ──
  var yAtk = r.you.attack + bump;
  var yStopped = Math.min(yAtk, r.them.defense);
  var yWasted  = Math.max(0, r.them.defense - yAtk);
  var yThrough = r.youVolley - (r.youBlocked || 0);
  var mine = lr("Your fleet attacked", r.you.attack, "red");
  if (bump) mine += lr("War escalation", "+" + bump, "red");
  mine += lr("Enemy shields", yStopped ? "−" + yStopped : "0", "blue");
  if (r.themFed && r.themFed.length){
    mine += lr("Enemy put " + r.themFed.map(function(f){ return "a d" + f.s; }).join(" and ") +
      " in the way", "−" + r.youBlocked, "blue");
  }
  mine += lr("Through to Enemy flagship", yThrough, "", "sub");
  mine += lr(r.you.direct ? "Direct — no shield stops it" : "Direct",
    (r.you.direct ? "+" : "") + r.you.direct, "dir");
  mine += lr("Damage to Enemy flagship", r.youDealt, "red", "end");

  // ── their shot ──
  var tAtk = r.them.attack + bump;
  var tStopped = Math.min(tAtk, r.you.defense);
  var tWasted  = Math.max(0, r.you.defense - tAtk);
  var tThrough = Math.max(0, r.volley - r.soaked);
  var theirs = lr("Enemy fleet attacked", r.them.attack, "red");
  if (bump) theirs += lr("War escalation", "+" + bump, "red");
  theirs += lr("Your shields", tStopped ? "−" + tStopped : "0", "blue");
  if (r.fed && r.fed.length){
    theirs += lr("You put " + r.fed.map(function(f){
      return "your d" + f.s + " in slot " + f.slot; }).join(" and ") + " in the way",
      "−" + Math.min(r.soaked, r.volley), "blue");
  }
  theirs += lr("Through to your flagship", tThrough, "", "sub");
  theirs += lr(r.direct ? "Direct — no shield stops it" : "Direct",
    (r.direct ? "+" : "") + r.direct, "dir");
  theirs += lr("Damage to your flagship", r.themDealt, "red", "end");

  // Keep each fleet's explanation inside its own visual story. Before v82 these
  // notes mixed "you" and "Enemy" back into one neutral card, undoing the side
  // distinction precisely where the report became hardest to read.
  var yourNotes = "", enemyNotes = "";
  if (r.you.run) yourNotes += '<div class="line">Your <b>' + r.you.run.taken +
    ' in a row</b> paid ' + rewardEffect(r.you.run) + '.</div>';
  if (r.you.lines && r.you.lines.length){
    yourNotes += r.you.lines.map(function(L){
      return '<div class="line">Your <b>d' + L.sides + 's</b> showing <b>' + L.value +
        '</b> ' + (L.kind === "row" ? 'across paid <b class="nrg">+' + L.energy + ' Energy</b>'
          : 'down paid <b class="red">+' + L.attack + ' Attack</b>') + '.</div>';
    }).join("");
  }
  if (r.shipBuilt) yourNotes += '<div class="line">Your straight built a free <b>d' +
    r.shipBuilt + '</b>.</div>';
  if (tWasted) yourNotes += '<div class="line"><b class="blue">' + tWasted +
    ' Shields</b> went to waste — you out-shielded the Enemy shot.</div>';
  if (r.fed && r.fed.length) yourNotes += '<div class="line">' + r.fed.map(function(f){
    return 'Your <b>d' + f.s + '</b> in slot ' + f.slot; }).join(" and ") +
    ' took the hit, so ' + (r.fed.length === 1 ? 'it is' : 'they are') +
    ' <b>damaged</b> next round — no roll, no scrapping.</div>';
  yourNotes += '<div class="line">Your flagship fired ' + faceEffect(r.youFace) + '.</div>';
  if (r.youTokenMove) yourNotes += '<div class="line">You spent your <b>Flagship Token</b> ' +
    'to turn #' + r.youTokenMove.from + ' to <b>#' + r.youTokenMove.to + '</b>.</div>';
  yourNotes += '<div class="line">You banked <b class="nrg">' + r.you.energy +
    ' Energy</b> from low rolls.</div>';

  if (r.them.run) enemyNotes += '<div class="line">Enemy <b>' + r.them.run.taken +
    ' in a row</b> paid ' + rewardEffect(r.them.run) + '.</div>';
  if (r.them.lines && r.them.lines.length){
    enemyNotes += r.them.lines.map(function(L){
      return '<div class="line">Enemy <b>d' + L.sides + 's</b> showing <b>' + L.value +
        '</b> ' + (L.kind === "row" ? 'across paid <b class="nrg">+' + L.energy + ' Energy</b>'
          : 'down paid <b class="red">+' + L.attack + ' Attack</b>') + '.</div>';
    }).join("");
  }
  if (yWasted) enemyNotes += '<div class="line"><b class="blue">' + yWasted +
    ' Shields</b> went to waste — Enemy over-defended.</div>';
  if (r.themFed && r.themFed.length) enemyNotes += '<div class="line">Enemy put ' +
    r.themFed.map(function(f){ return 'a <b>d' + f.s + '</b>'; }).join(" and ") +
    ' in the way; ' + (r.themFed.length === 1 ? 'it is' : 'they are') +
    ' <b>damaged</b> next round.</div>';
  enemyNotes += '<div class="line">Enemy flagship fired ' + faceEffect(r.themFace) + '.</div>';
  if (r.themTokenMove) enemyNotes += '<div class="line">Enemy spent its <b>Flagship Token</b> ' +
    'to turn #' + r.themTokenMove.from + ' to <b>#' + r.themTokenMove.to + '</b>.</div>';
  enemyNotes += '<div class="line">' + enemyPlanInfo(G.them.plan).line + '</div>';

  function healthCard(kind, side, before, after, damage, repair){
    var previousLabel = G.round === 1 ? "Start" : "Round " + (G.round - 1);
    var shownBefore = Math.max(0, before), shownAfter = Math.max(0, after);
    var change = shownAfter - shownBefore;
    var changeText = change > 0 ? "+" + change : (change < 0 ? "−" + Math.abs(change) : "0");
    var changeKind = change > 0 ? "up" : (change < 0 ? "down" : "even");
    return '<div class="healthcard ' + kind + '"><div class="side">' + side + ' flagship</div>' +
      '<div class="healthline"><div class="healthpoint"><b>' + shownBefore +
        '</b><small>' + previousLabel + '</small></div>' +
      '<div class="healtharrow">→</div>' +
      '<div class="healthpoint"><b>' + shownAfter +
        '</b><small>Round ' + G.round + '</small></div></div>' +
      '<div class="healthmoves"><span class="hurt">−' + damage + ' damage</span>' +
      '<span class="repair">+' + repair + ' repaired</span>' +
      '<span class="healthnet ' + changeKind + '"><b>' + changeText +
        '</b><small>Total change</small></span></div></div>';
  }

  return '<div class="report-title"><p class="eyebrow">BOTH FLEETS REVEALED</p>' +
    '<h1>Round ' + G.round + ' result</h1></div>' +
    '<div class="report-sides">' +
      '<section class="reportside you">' +
        healthCard("you", "Your", r.youHpBefore, r.youHpAfter, r.themDealt, r.you.heal) +
        '<div class="sideblock rolls">' +
          rollRow("You", r.youDice, r.you.run, r.you.run && r.you.run.taken) +
        '</div>' +
        '<div class="sideblock led"><div class="ledh"><span>Damage to you</span>' +
          '<b class="red">' + r.themDealt + '</b></div>' + theirs + '</div>' +
        '<div class="sidenotes">' + yourNotes + '</div>' +
      '</section>' +
      '<section class="reportside enemy">' +
        healthCard("enemy", "Enemy", r.themHpBefore, r.themHpAfter, r.youDealt, r.them.heal) +
        '<div class="sideblock rolls">' +
          rollRow("Enemy", r.themDice, r.them.run, r.them.run && r.them.run.taken) +
        '</div>' +
        '<div class="sideblock led"><div class="ledh"><span>Damage to Enemy</span>' +
          '<b class="red">' + r.youDealt + '</b></div>' + mine + '</div>' +
        '<div class="sidenotes">' + enemyNotes + '</div>' +
      '</section>' +
    '</div>' +
    '<div class="leg reportleg">The die ringed in gold is the flagship \u2014 its color ' +
      'shows the bonus it fired, and its number joins the line but never fires on its own.</div>';
}


// Upgrade the whole flagship a level. The bonus on every face rises together, so it
// is one purchase and one number rather than six little decisions.
function flagUpgradeHtml(){
  var lvl = G.you.flag.lvl || 1;
  if (lvl >= 3){
    return '<div class="card"><div class="rep"><div class="line">' +
      'Your flagship is at <b style="color:var(--gold)">level 3</b> \u2014 every matching ' +
      'die gets <b>+4</b>. That is the ceiling.</div></div></div>';
  }
  var next = lvl + 1, cost = flagLvlCost(next), broke = G.you.energy < cost;
  return '<div class="buy"><div class="i"><b>Flagship \u2014 level ' + next + '</b><small>' +
    'The bonus on every face rises from <b>+' + (lvl + 1) + '</b> to <b>+' + (next + 1) +
    '</b> \u2014 including the Reactor.</small></div>' +
    '<button data-flagup="1"' + (broke ? ' disabled' : '') + '>' + cost + '\u26a1</button></div>';
}


// What a hull actually carries. The old shop said a d10 had "4 attack faces,
// 4 shield" - it was quietly skipping the 1 and the 2, which was true of a rule
// we dropped long ago. Every face fights: evens hit, odds block, and the 1 and 2
// pay Energy ON TOP of that. Counted here rather than described, so the shop
// cannot drift away from the engine again.
// A heading should say what you can DO here. "Shipyard" is a place; "Buy a new
// ship" is an action, and the colour says which of the three rooms you are in.
function shopHead(tone, title, sub){
  return '<div class="shead ' + tone + '"><h3>' + title + '</h3>' +
    '<div class="ssub">' + sub + '</div></div>';
}

// The only thing you can buy for the flagship. There is nothing to choose - one
// purchase lifts all six faces together - so there is nothing here to get wrong.
function flagshipSectionHtml(){
  var lvl = G.you.flag.lvl || 1;
  return '<div class="card">' +
    shopHead("gold", "Upgrade your flagship",
      lvl >= 3 ? "Fully upgraded \u2014 every matching die gets +4"
               : "One purchase raises the bonus on all six faces") +
    '<div class="lvlbar">' + [1,2,3].map(function(n){
      return '<div class="lvl' + (n === lvl ? " now" : n < lvl ? " past" : "") + '">' +
        '<div class="ln">Level ' + n + '</div>' +
        '<div class="lp">each matching die<br>gets <b>+' + (n + 1) + '</b></div></div>';
    }).join("") + '</div>' +
    flagUpgradeHtml() + '</div>';
}

function flagFaceDetail(n, m){
  return n === 1 ? 'Raise base Energy by ' + m
    : n === 2 ? 'Each ship showing 2 gets +' + m + ' Direct'
    : n === 3 ? 'Each ship showing 3 repairs +' + m
    : n === 4 ? 'Each ship showing 4 earns +' + m + ' Energy'
    : n === 5 ? 'Each odd ship blocks +' + m
    : 'Each even ship attacks +' + m;
}
function flagFaceReferenceHtml(n){
  var m = flagMul(G.you), p = FACES[G.you.flag.faces[n-1]], detail = flagFaceDetail(n, m);
  return '<div class="fref"><b>' + n + '</b><span><strong>' + p.name +
    '</strong><small>' + detail + '</small></span></div>';
}
function allFlagshipFacesHtml(){
  var faces = starterFaces(), m = flagMul(G.you);
  return '<div class="flagfaces">' + faces.map(function(id, i){
    var n = i + 1;
    return '<div class="flagface">' + die3d(flagHullSvg(n, id)) +
      '<strong>#' + n + ' · ' + FACES[id].name + '</strong>' +
      '<small>' + flagFaceDetail(n, m) + '</small></div>';
  }).join("") + '</div>';
}

function hullFacts(sides){
  var f = { hit:0, block:0, energy:0, repair:0, direct:0 }, v;
  for (v = 1; v <= sides; v++){
    if (v % 2 === 0) f.hit++; else f.block++;
    if (energyOf(v)) f.energy++;
    if (healOf(v))   f.repair++;
    if (directOf(v)) f.direct++;
  }
  return f;
}
function growthMarksHtml(sides){
  if (sides < 6) return 'the four low marks only';
  var topOdd = sides - 1, repair = healOf(topOdd), direct = directOf(sides);
  return 'new top faces: <b class="hp">' + topOdd + ' repairs ' + repair +
    '</b> · <b class="dir">' + sides + ' fires ' + direct + ' Direct</b>';
}

// A ship you are thinking of buying should look like the ship you will get, so
// this is the same hull the board draws. Reading a row of text and then finding
// a shape on the grid was two different languages for one object.
function buyCardHtml(sides){
  var cost = priceOf(sides), f = hullFacts(sides);
  var full = G.you.dice.length >= openSlots(G.you);
  var can = !full && G.you.energy >= cost;
  return '<div class="ship' + (can ? " can" : " cant") + '">' +
    die3d(hullSvg(sides, "", can ? "attack" : "dry")) +
    '<div class="sname">d' + sides + '</div>' +
    '<div class="sfaces"><b class="red">' + f.hit + '</b> hit · ' +
      '<b class="blue">' + f.block + '</b> block</div>' +
    '<div class="sfaces avg">averages <b>' + ((sides + 1) / 2).toFixed(1) + '</b> a roll</div>' +
    '<div class="sline">straights pay at the <b>d' + sides + '</b> tier</div>' +
    '<div class="sline">' + growthMarksHtml(sides) + '</div>' +
    '<button class="sbuy" data-buysize="' + sides + '"' + (can ? '' : ' disabled') + '>' +
      '<b>' + cost + '⚡</b>' +
      (full ? '<i>' + (openSlots(G.you) < K("maxDice") ? 'open a slot first' : 'no slot free') +
        '</i>' : '') +
    '</button></div>';
}

// The scrapyard is your own board, not a list. Same 3x3, same hulls, same slot
// numbers - so "scrap the d4 in slot 2" is a thing you can see rather than
// something you have to translate.
function fleetGridHtml(){
  var cells = [], i, ix, d, hurt, next, cost, open = openSlots(G.you);
  var nextSlot = open + 1, nextCost = open < K("maxDice") ? slotCost(nextSlot) : null;
  var lvl = G.you.flag.lvl || 1, flagCost = lvl >= 3 ? null : flagLvlCost(lvl + 1);
  for (i = 0; i < 9; i++){
    if (i === 4){
      cells.push('<div class="die fleet-die flag shop-flagship static"><div class="brace-flag-label">Flagship</div>' +
        '<strong class="brace-flag-hp">' + Math.max(0, G.you.hp) + '</strong>' +
        '<span class="shop-flag-level">level ' + lvl + '</span>' +
        (flagCost
          ? '<button class="ship-act flagship-upgrade-act" data-flagup="1"' +
            (G.you.energy < flagCost ? ' disabled' : '') + '>Upgrade to level ' + (lvl + 1) + ' ' + flagCost + '⚡</button>'
          : '<span class="ship-act">Level 3 maximum</span>') +
        '</div>');
      continue;
    }
    ix = i < 4 ? i : i - 1;
    if (ix >= open){
      if (ix === open && nextCost != null){
        cells.push('<button class="empty-slot unlock-slot" data-unlock="1"' +
          (G.you.energy < nextCost ? ' disabled' : '') + '>' +
          '<span class="slotno">' + (ix + 1) + '</span>' +
          '<span class="unlock-slot-label">Unlock fleet slot</span>' +
          '<strong class="unlock-slot-cost">' + nextCost + '⚡</strong></button>');
      } else {
        cells.push('<div class="empty-slot locked-slot"><span>' + (ix + 1) + '</span><small>locked</small></div>');
      }
      continue;
    }
    d = G.you.dice[ix];
    if (!d){
      cells.push('<div class="empty-slot"><span>' + (ix + 1) + '</span><small>slot free</small></div>');
      continue;
    }
    hurt = isDamaged(d);
    next = nextSize(d.s);
    cost = growCost(d.s);
    cells.push('<div class="die fleet-die shop-ship noPick' + (hurt ? " hurt" : "") + '">' +
      '<span class="slotno">' + (ix + 1) + '</span>' +
      die3d(hullSvg(d.s, "", hurt ? "dry" : "defense")) +
      '<div class="kind die-caption">d' + d.s + '</div>' +
      (next
        ? '<button class="ship-act ship-upgrade-act" data-grow="' + ix + '"' +
          (hurt || G.you.energy < cost ? ' disabled' : '') + '>' +
          (hurt ? 'Damaged' : 'Upgrade to d' + next + ' ' + cost + '⚡') + '</button>'
        : '<span class="ship-act">' + (hurt ? 'Damaged' : 'Max d10') + '</span>') +
      '</div>');
  }
  return '<div class="grid fleet-formation">' + cells.join("") + '</div>';
}

function slotSectionHtml(){
  var open = openSlots(G.you), next = open + 1;

    shopHead("blue", "Open another fleet slot", open + " of " + K("maxDice") + " slots open") +

    '<div class="card">' + rows + '</div>' +
    '<div class="row"><button class="go" id="restart">Start a fresh match</button>' +
    '<button id="back">Back to the game</button>' +
    '<button id="reset">Reset to defaults</button></div>';
}

// Everyone fires at once across the galaxy, so both flagships going up in the
// same volley is not an edge case - measured at 18.9% of matches, near enough
// one in five. It needs a real answer rather than a shrug.
//
// The cascade, in order:
//   1. the heavier final volley - decided by the round you just watched, and it
//      lets someone steal it with one enormous last salvo
//   2. most damage across the whole match - level only 4.7% of the time after
//      step one, so this almost always settles it
//   3. a true mutual destruction - which lands in about 1 match in 5,000
function winner(){
  var mine = G.you.hp, yours = G.them.hp, r = G.report || {};
  if (mine > 0 && yours > 0)
    return { who: mine > yours ? "you" : mine < yours ? "them" : "draw", why: "health" };
  if (yours <= 0 && mine > 0) return { who: "you",  why: "kill" };
  if (mine <= 0 && yours > 0) return { who: "them", why: "kill" };
  if ((r.youDealt || 0) !== (r.themDealt || 0))
    return { who: r.youDealt > r.themDealt ? "you" : "them", why: "volley" };
  if (G.you.damage !== G.them.damage)
    return { who: G.you.damage > G.them.damage ? "you" : "them", why: "total" };
  return { who: "draw", why: "mutual" };
}

function overView(){
  var yours = Math.max(0, G.you.hp), theirs = Math.max(0, G.them.hp);
  var v = winner(), r = G.report || {}, headline, sub;
  var won = v.who === "you";

  if (v.why === "kill"){
    headline = won ? "Enemy flagship is destroyed" : "Your flagship is destroyed";
    var rd = G.round + (G.round === 1 ? " round" : " rounds");
    sub = won ? "You won it in " + rd + "." : "Enemy finished it in " + rd + ".";
    sub += " They were " + enemyPlanLabel(G.them.plan) + ".";
  } else if (v.why === "volley"){
    headline = won ? "You win the exchange" : "You lose the exchange";
    sub = "Both flagships went up in round " + G.round +
      ". The heavier final volley takes it — <b>" + (r.youDealt || 0) + "</b> against <b>" +
      (r.themDealt || 0) + "</b>.";
  } else if (v.why === "total"){
    headline = won ? "You win on the record" : "You lose on the record";
    sub = "Both flagships destroyed, and the last volleys were level. " +
      "Damage across the whole match decides it.";
  } else if (v.why === "mutual"){
    headline = "Mutual destruction";
    sub = "Both flagships gone, the final volleys level, and neither of you " +
      "dealt a point more than the other across " + G.round + " rounds. Nobody wins this one.";
  } else {
    headline = v.who === "draw" ? "Dead heat" : won ? "You win on health" : "You lose on health";
    sub = "Neither flagship fell inside " + K("rounds") + " rounds.";
  }
  return '<div class="card center">' +
    '<h3>' + headline + '</h3>' +
    '<div style="font-size:46px;font-weight:800;margin:10px 0" class="hp">' + yours + ' – ' + theirs + '</div>' +
    '<p>' + sub + '</p>' +
    '<p class="say">You dealt <b>' + G.you.damage + '</b> damage across the match; Enemy dealt <b>' +
      G.them.damage + '</b>.</p>' +
    '<button class="go" id="again">Play again</button>' +
    '<button class="homeback" id="quit-home">Back home</button></div>';
}

/** Leave solo and return to the site home (iframe parent, or Pages root). */
function homeUrl(){
  try {
    var topWin = window.top || window.parent;
    if (topWin && topWin !== window) {
      var path = topWin.location.pathname.replace(/\/solo(?:-v2)?\/?$/, "") || "";
      if (!path || path === "/") return topWin.location.origin + "/";
      return topWin.location.origin + path.replace(/\/+$/, "") + "/";
    }
  } catch (e) {}
  if (/github\.io$/i.test(location.hostname)) {
    return location.origin + "/spacetribe-dice/";
  }
  if (location.protocol === "file:") {
    return "https://davepartin.github.io/spacetribe-dice/";
  }
  return location.origin + "/";
}

function quitToHome(ask){
  if (ask && !confirm("Quit this game and go back home?\n\nYour current match will be lost.")) {
    return;
  }
  var url = homeUrl();
  try {
    var topWin = window.top || window.parent;
    if (topWin && topWin !== window) {
      topWin.location.href = url;
      return;
    }
  } catch (e) {}
  location.href = url;
}

function render(){
  var body = G.phase === "tune" ? tuneView()
           : G.phase === "costs" ? costsView()
           : G.phase === "help" ? helpView()
           : G.phase === "brace" ? braceView()
           : G.phase === "roll" ? rollView()
           : G.phase === "report" ? reportView()
           : G.phase === "shop" ? shopView() : overView();
  var earning = (G.phase === "roll" && lastTally) ? lastTally.energy + G.you.base : 0;
  var boardMid = G.phase === "roll" && G.you.rolls > 0
    ? fireBtnHtml()
    : '<div class="mid fleet-mid">FLAGSHIP<br>HEALTH</div>';
  var p = pending;
  var braceLeft = p ? Math.max(0, p.incoming - p.soaked) : 0;
  var braceTotal = p ? braceLeft + p.direct : 0;
  var dockPrimary = "";
  if (G.phase === "brace"){
    dockPrimary = '<div class="dock-primary-stack">' +
      (p && p.fed && p.fed.length
        ? '<button class="outline-dock-btn" id="brace-reset" type="button">Reset</button>' : '') +
      '<button class="go-btn" id="brace-done" type="button">' +
        (braceTotal > 0 ? 'Continue — Flagship takes ' + braceTotal + ' Dmg'
          : 'Continue — Flagship is safe') +
      '</button></div>';
  } else if (G.phase === "report"){
    dockPrimary = '<button class="go-btn" id="next" type="button">' +
      (matchOver() ? "See result" : "Continue to upgrades") + '</button>';
  } else if (G.phase === "shop"){
    dockPrimary = '<button class="go-btn" id="next" type="button">Go to round ' + G.round + '</button>';
  }
  var staged = G.phase !== "tune" && G.phase !== "costs" && G.phase !== "help";
  var showDock = G.phase !== "tune" && G.phase !== "costs" && G.phase !== "help" && G.phase !== "over";

  hullGradSeq = 0;
  document.getElementById("app").innerHTML =
    '<div class="wrap"><header class="site-header">' +
      '<h1>Fleet Dice 2 <button class="ver" id="tune">v' + VERSION + '</button></h1>' +
      '<div class="header-pills">' +
        '<button class="header-ref-btn" id="costs" type="button">Upgrade costs</button>' +
        '<span class="quiet-pill">' + (G.phase === "over" ? "Finished" : "Round " + G.round) + '</span>' +
      '</div></header>' +
    '<div class="board">' +
      '<div class="score you-score"><div class="who">You</div><div class="val hp">' + Math.max(0, G.you.hp) + '</div></div>' +
      '<div class="score energy-score"><div class="who">Energy</div><div class="val">' + G.you.energy +
        (earning ? '<span class="soon">→' + (G.you.energy + earning) + '</span>' : '') + '</div></div>' +
      '<div class="score base-score"><div class="who">Base</div><div class="val">' +
        (G.you.base ? '+' + G.you.base : '0') + '</div></div>' +
      boardMid +
      '<div class="score enemy-score r"><div class="who">Enemy</div><div class="val hp">' +
        Math.max(0, G.them.hp) + '</div></div></div>' +
    (staged ? '<section class="stage stage-docked">' + body + '</section>' : body) +
    '</div>' +
    (showDock
      ? '<div class="dock"><div class="dockin">' + dockPrimary +
        '<div class="match-dock-links">' +
        '<button class="dock-cancel" id="quit-dock" type="button">Quit game</button>' +
        '<button class="howto-btn" id="help" type="button">How to play</button>' +
        '</div></div></div>'
      : '');

  wire();
  animate = {};
}

function wire(){
  var n = document.getElementById("next");
  if (n) n.onclick = function(){
    if (G.phase === "report") nextRound();
    else if (G.phase === "shop") startRound();
  };
  var fire = document.getElementById("fire");
  if (fire) fire.onclick = function(){ if (G.phase === "roll") submit(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-take]"), function(el){
    el.onclick = function(){
      straightPick = +el.getAttribute("data-take");
      render();
    };
  });
  var rr = document.getElementById("reroll");
  if (rr) rr.onclick = doReroll;
  var pr = document.getElementById("page-reset");
  if (pr) pr.onclick = resetPageChoices;
  var ag = document.getElementById("again");
  if (ag) ag.onclick = function(){ newGame(); };
  var qh = document.getElementById("quit-home");
  if (qh) qh.onclick = function(){ quitToHome(false); };
  function bindQuit(id, ask){
    var el = document.getElementById(id);
    if (el) el.onclick = function(){ quitToHome(ask); };
  }
  bindQuit("quit", G.phase !== "over");
  bindQuit("quit-dock", true);

  Array.prototype.forEach.call(document.querySelectorAll("[data-flagturn]"), function(el){
    el.onclick = function(){
      if (rollBusy || G.phase !== "roll" || G.you.rolls < 1) return;
      if (!useFlagToken(G.you, +el.getAttribute("data-flagturn"))) return;
      sel.flag = false;
      straightPick = null;
      var moved = [];
      moved.flag = true;
      playRollBump(moved);
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-brace]"), function(el){
    el.onclick = function(){
      var i = +el.getAttribute("data-brace");
      feedShip(i);
    };
  });
  function feedShip(i){
    var d = G.you.dice[i], previousOut = d.out, soak = soakWith(G.you, i);
    pending.fed = pending.fed || [];
    pending.fed.push({ s: d.s, slot: i + 1, soak: soak, previousOut: previousOut });
    pending.soaked += soak;
    render();
  }
  var br = document.getElementById("brace-reset");
  if (br) br.onclick = function(){
    (pending.fed || []).forEach(function(f){
      if (G.you.dice[f.slot - 1]) G.you.dice[f.slot - 1].out = f.previousOut || 0;
    });
    pending.fed = [];
    pending.soaked = 0;
    render();
  };
  var bd = document.getElementById("brace-done");  if (bd) bd.onclick = settleRound;

  var fu = document.querySelector("[data-flagup]");
  if (fu) fu.onclick = function(){
    var lvl = G.you.flag.lvl || 1, cost = flagLvlCost(lvl + 1);
    if (lvl >= 3 || G.you.energy < cost) return;
    G.you.energy -= cost;
    G.you.flag.lvl = lvl + 1;
    toast("Flagship upgraded \u2014 each matching die now gets +" + flagMul(G.you));
    render();
  };

  function returnFromReference(){
    var resume = G.resume || "roll";
    delete G.resume;
    G.phase = resume;
    render();
  }
  function openReference(phase){
    if (G.phase === phase) return returnFromReference();
    if (G.phase !== "costs" && G.phase !== "help" && G.phase !== "tune")
      G.resume = G.phase;
    G.phase = phase;
    render();
  }
  var cs = document.getElementById("costs");
  if (cs) cs.onclick = function(){ openReference("costs"); };
  var hp = document.getElementById("help");
  if (hp) hp.onclick = function(){ openReference("help"); };
  var tn = document.getElementById("tune");
  if (tn) tn.onclick = function(){
    if (G.phase === "tune") return returnFromReference();
    openReference("tune");
  };
  var bk = document.getElementById("back");
  if (bk) bk.onclick = returnFromReference;
  Array.prototype.forEach.call(document.querySelectorAll("[data-jump]"), function(el){
    el.onclick = function(){
      var target = document.getElementById(el.getAttribute("data-jump"));
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior:"smooth", block:"start" });
    };
  });
  var rs = document.getElementById("restart");
  if (rs) rs.onclick = function(){ newGame(false); };
  var rd = document.getElementById("reset");
  if (rd) rd.onclick = function(){
    Object.keys(C).forEach(function(k){ C[k].v = DEFAULTS[k]; });
    newGame(false);
  };

  Array.prototype.forEach.call(document.querySelectorAll("[data-set]"), function(el){
    el.onchange = function(){
      var k = el.getAttribute("data-set"), c = C[k];
      var v = parseFloat(el.value);
      if (isNaN(v)) v = c.v;
      C[k].v = Math.max(c.min, Math.min(c.max, v));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-die]"), function(el){
    el.onclick = function(){
      if (rollBusy) return;
      var i = el.getAttribute("data-die");
      sel[i] = !sel[i];
      render();
    };
  });
  var fl = document.querySelector("[data-flag]");
  if (fl) fl.onclick = function(){
    if (rollBusy) return;
    sel.flag = !sel.flag;
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-buysize]"), function(el){
    el.onclick = function(){ buyDie(+el.getAttribute("data-buysize")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-grow]"), function(el){
    el.onclick = function(){ growDie(+el.getAttribute("data-grow")); };
  });
  var us = document.querySelector("[data-unlock]");
  if (us) us.onclick = unlockSlot;
  Array.prototype.forEach.call(document.querySelectorAll("[data-sell]"), function(el){
    el.onclick = function(){ sellDie(+el.getAttribute("data-sell")); };
  });
}

function toast(msg){
  var old = document.querySelector(".toast");
  if (old) old.remove();
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2200);
}

newGame();
</script>

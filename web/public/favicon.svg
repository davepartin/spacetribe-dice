<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Fleet Dice">
  <!-- Full square canvas so home-screen icons keep proportions -->
  <rect width="512" height="512" rx="96" fill="#080c18"/>
  <rect x="40" y="40" width="432" height="432" rx="72" fill="#101828" stroke="#1d2a44" stroke-width="10"/>
  <!-- Wide, centered d4 #1 — sized to fill the square without looking squeezed -->
  <g transform="translate(256 268)">
    <polygon
      points="0,-168 188,148 -188,148"
      fill="#45b6ff"
      fill-opacity="0.16"
      stroke="#45b6ff"
      stroke-width="22"
      stroke-linejoin="round"
    />
    <text
      x="0"
      y="28"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="#45b6ff"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="168"
      font-weight="800"
      style="font-variant-numeric:tabular-nums"
    >1</text>
    <g fill="#ffe81f" transform="translate(0 92)">
      <path d="M0,-28 L-16,5 L-3,5 L-11,28 L16,-7 L3,-7 Z" transform="translate(-28 0)"/>
      <path d="M0,-28 L-16,5 L-3,5 L-11,28 L16,-7 L3,-7 Z" transform="translate(28 0)"/>
    </g>
  </g>
</svg>

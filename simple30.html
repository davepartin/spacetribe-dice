<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080c18">
<title>Fleet Dice</title>
<style>
:root{
  --bg:#080c18; --panel:#111a2e; --panel2:#16223c; --line:#26334f;
  --ink:#eaf0ff; --dim:#93a3c4; --faint:#61729a;
  --red:#ff5566; --blue:#45b6ff; --gold:#ffd75e; --nrg:#ffe81f; --hp:#7cf0a8;
  --orange:#ff9438; --direct:#b98bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;padding-bottom:96px;color:var(--ink);
  background:radial-gradient(900px 600px at 25% -8%,#1a2a5533,transparent 65%),
             radial-gradient(700px 500px at 85% 8%,#3a1f5a33,transparent 60%),var(--bg);
  font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 0}
header{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 14px}
h1{margin:0;font-size:21px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;
   background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.tiny{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:transparent}
.ver{font-size:11px;letter-spacing:.1em;-webkit-text-fill-color:var(--faint);color:var(--faint);font-weight:600}
.pill{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}

.board{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;background:linear-gradient(180deg,var(--panel),#0d1425);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.board .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.board .val{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.board .mid{align-self:center;font-size:11px;letter-spacing:.1em;color:var(--faint);text-align:center}
.board .r{text-align:right}

h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 2px 9px;font-weight:700}
.say{font-size:15px;color:var(--dim);margin:0 2px 12px}
.say b{color:var(--ink)}
.say .red{color:var(--red);font-weight:700}
.say .blue{color:var(--blue);font-weight:700}
.say .nrg{color:var(--nrg);font-weight:700}

.dice{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.grid .die{width:auto}
.slot{border:1px dashed var(--line);border-radius:15px;min-height:128px;opacity:.35}
.die.flag{border-color:var(--gold);background:linear-gradient(180deg,#1c1708,#12100a);
  box-shadow:0 0 26px -10px var(--gold);display:flex;flex-direction:column;justify-content:center}
.die.flag .lbl{color:var(--gold)}
.die.flag .pname{font-size:14px;font-weight:800;text-align:center;color:var(--gold);line-height:1.2;margin:4px 0 3px}
.die.flag .pdesc{font-size:10px;text-align:center;color:var(--dim);line-height:1.25;padding:0 2px}
.die.flag .chg{font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-align:center;
  color:var(--nrg);font-weight:800;margin-top:4px}
.die.flag.lit{box-shadow:0 0 30px -6px var(--nrg);border-color:var(--nrg)}
.die.flag.lit .chg{color:#fff}
.die{width:78px;border:1px solid var(--line);border-radius:15px;padding:6px 5px 5px;cursor:pointer;
  background:linear-gradient(180deg,var(--panel),#0d1425);transition:transform .1s,border-color .1s,box-shadow .1s;user-select:none}
/* The hull silhouette carries the ship's size, so no caption is needed. */
.hull{display:block;width:100%;height:auto;max-height:104px}
.hull polygon{transition:fill-opacity .15s}
.die:hover .hull polygon{fill-opacity:.22}
.die:active{transform:scale(.96)}
@keyframes tumble{
  0%{transform:rotate(0) scale(1)}
  30%{transform:rotate(-14deg) scale(.9)}
  60%{transform:rotate(11deg) scale(1.06)}
  100%{transform:rotate(0) scale(1)}
}
.die.rolled{animation:tumble .32s ease}
/* White is a thing you did: you tapped this die to reroll it.
   Gold is a thing the game did: this die is part of your straight.
   Keeping those two apart matters, because a straight lights up several dice at
   once and you could no longer tell which ones you had selected. */
.die.sel{border-color:#fff;box-shadow:0 0 0 1px #fff,0 0 24px -8px #fff}
.die.sel::after{content:"REROLL";position:absolute;top:5px;right:6px;font-size:8px;
  letter-spacing:.08em;font-weight:800;color:#fff}
.die{position:relative}
.die .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;margin-bottom:2px}
.die .kind{font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-align:center;font-weight:800;margin-top:-2px}
.die.r .kind{color:var(--red)}
.die.b .kind{color:var(--blue)}
.hull path{filter:drop-shadow(0 0 5px var(--nrg))}
/* A 5px glow is wider than the space between three crosses, so it welded them
   into one bar. Theirs is tight enough to leave the gap visible. */
.hull path.cr{filter:drop-shadow(0 0 1px var(--hp))}
.hull path.ch{filter:drop-shadow(0 0 2px var(--direct))}
.die.pierce{border-color:#4a3570}
.die.hurt{opacity:.55}
.die.hurt .kind{color:var(--faint)}
/* Orange, not gold. Gold is the flagship's colour and it was doing two jobs at
   once - now the bar along the bottom means one thing only: this ship is in your
   straight. */
.die.inrun{border-color:#5a3410}
.die.inrun::before{content:"";position:absolute;left:12px;right:12px;bottom:0;height:4px;
  border-radius:3px 3px 0 0;background:var(--orange);box-shadow:0 0 10px -1px var(--orange)}
.die.inrun.sel::before{left:8px;right:8px}
.warn{font-size:13px;color:var(--gold);background:#1a1608;border:1px solid #46391a;
  border-radius:11px;padding:9px 12px;margin:0 0 14px}

.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:7px;margin-bottom:14px}
.tot > div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center}
.tot .n{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tot .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.tot .a .n{color:var(--red)} .tot .d .n{color:var(--blue)} .tot .e .n{color:var(--nrg)}
.tot .h .n{color:var(--hp)}
.tot .dir .n{color:var(--direct)}
.dir{color:var(--direct)}
b.dir{color:var(--direct);font-weight:800}
.hp{color:var(--hp)}
b.hp{color:var(--hp);font-weight:800}

.run{display:flex;align-items:center;gap:11px;background:#241405;border:1px solid var(--orange);
  border-radius:12px;padding:10px 13px;margin-bottom:14px}
.run .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--orange);color:#1a0d02;
  border-radius:5px;padding:3px 8px;font-weight:800;white-space:nowrap}
.run .t{font-size:14px} .run .t small{display:block;color:var(--dim);font-size:12px}
.choose{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;
  color:var(--orange);margin:0 2px 7px}
.choose em{font-style:normal;color:var(--faint);letter-spacing:.06em;font-weight:600}
.picks{display:grid;gap:7px;margin-bottom:14px}
.pick{position:relative;text-align:left;padding:10px 74px 10px 12px;background:#0c1424;
  border:1px solid var(--line);border-radius:11px}
.pick b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.pick span{font-size:15px;color:var(--ink);font-weight:600}
.pick i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.pick.on{border-color:var(--orange);background:#231404}
.pick.on b{color:var(--orange)}
.pick.on i{background:var(--orange);border-color:var(--orange);color:#1a0d02}
.pick[disabled]{opacity:.45}

button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:11px 16px;transition:filter .1s,transform .07s}
button:hover:not(:disabled){filter:brightness(1.28)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.32;cursor:not-allowed}
button.go{background:linear-gradient(180deg,#3573ff,#1c46c6);border-color:#5182ff;font-weight:700}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.rollrow{margin-top:-4px;margin-bottom:10px}
.rollrow button{flex:1;min-width:0}

.card{background:linear-gradient(180deg,var(--panel),#0d1425);border:1px solid var(--line);
  border-radius:15px;padding:14px;margin-bottom:11px}
.card h3{margin:0 0 3px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.card p{margin:0 0 11px;font-size:14px;color:var(--dim)}
.buy{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;
  border:1px solid var(--line);border-radius:11px;background:#0b1322;margin-bottom:8px}
.buy:last-child{margin-bottom:0}
.buy.picked{border-color:var(--gold);background:#1a1608}
.buy .i b{display:block;font-size:14px}
.buy .i small{color:var(--faint);font-size:12px}
.cost{font-weight:800;color:var(--nrg);white-space:nowrap}

.rep{font-size:15px;line-height:1.7}
.rep .line{padding:9px 0;border-bottom:1px solid #1a2440}
.rep .line:last-child{border-bottom:0}
.rep b{color:var(--ink)}
.rep .red{color:var(--red)} .rep .blue{color:var(--blue)} .rep .nrg{color:var(--nrg)}
.hit{font-size:34px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.blk{font-size:34px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(10,15,28,.88),rgba(8,12,24,.99));backdrop-filter:blur(14px);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
.dockin{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:12px}
.met{display:flex;gap:16px;flex:1}
.met .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.met .n.p{color:var(--nrg)}
.met .l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--gold);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;
  box-shadow:0 10px 34px -10px #000}
.tune{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid #1a2440}
.tune:last-child{border-bottom:0}
.tune .i b{display:block;font-size:14px}
.tune .i small{color:var(--faint);font-size:12px}
.tune input{width:78px;font:inherit;text-align:center;padding:7px;border-radius:9px;
  border:1px solid var(--line);background:#0b1322;color:var(--ink)}
.stab{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stab th,.stab td{padding:6px 4px;text-align:center;color:var(--dim)}
.stab th{color:var(--faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.stab td:first-child,.stab th:first-child{text-align:left;padding-left:11px;color:var(--faint)}
.stab tr+tr{border-top:1px solid #1a2440}
.stab td:not(:first-child){color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--faint);margin:0 2px 14px}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

var VERSION = "30";   // bump this when saving a new simpleNN.html

// ── IDEAS NOT BUILT YET ──────────────────────────────────────────────────
// Kept here rather than in a doc so they stay next to the numbers they touch.
// Nothing below this line runs. Full working in PANELS.md.
//
// 1. THE ROCKET - a one-shot panel that leaves a blank behind
//    Buy a huge single-use weapon onto your flagship. When it launches, the
//    face it was mounted on goes BLANK - which is a hardpoint you can re-arm
//    later, so the blank is an opportunity rather than only a scar.
//
//    Why it belongs: a ship bought in round 2 adds 24 damage over the match; the
//    same ship bought in round 9 adds 0.6. Late Energy currently has nowhere
//    good to go (13.5 sits unspent at the end of an average match). A one-shot
//    is worth the same whenever you fire it, so it is the natural late buy.
//
//    The measured trap: if you may CHOOSE the round you fire it, the best line
//    wins 67% - and raising the price barely dents it (65% at cost 20), because
//    by round 8 the Energy you are hoarding was worthless anyway. Price cannot
//    balance this mechanic.
//
//    What does balance it is not knowing. Mounted across TWO faces and fired
//    whenever the flagship rolls it: 84% of matches it goes off, and the plan
//    wins 52.6%. One face is too cruel - it fires 56% of the time and the plan
//    wins 45.4%, a losing purchase. Two faces, no choosing. It is huge, so it
//    takes up two sides; that is the theme and the balance in one rule.
//
// 2. AN ENERGY CARRY CAP - open question, not solved
//    A ceiling on Energy carried from one round into the next, so nobody banks
//    a war chest. The thing to be careful about: A CAP IS A PRICE CEILING.
//    Nothing can cost more than the cap or it can never be bought. The average
//    bank already sits at 13-15 all match and a d10 costs 13, so a cap under 15
//    quietly deletes d10s, and a cap over 20 never binds at all. That is a
//    narrow window and it needs measuring before it goes in.
// ─────────────────────────────────────────────────────────────────────────

// ── rules ────────────────────────────────────────────────────────────────
// Every die: EVEN faces are red (attack), ODD faces 3+ are blue (defense),
// and the 1 is worth two Energy and no combat value. Pulling the 1 out is
// what makes red and blue exactly equal on average, on every die size.

// Every number worth arguing about lives here, and the Tune panel edits it
// live. Nothing about the rules is buried in the code below.
var C = {
  startHP:      { v:60, min:15, max:200,label:"Flagship hit points", step:5,
                  note:"The length dial. Measured in the real build: 40 gives an 8-round match, 50 gives 10, 60 gives 11." },
  healThree:    { v:3,  min:0,  max:6,  label:"Health a 3 heals" },
  panelAtkFlat: { v:2,  min:0,  max:10, label:"Attack panel: flat bonus",
                  note:"On top of +1 a red die. The four level-1 panels sit within 46-56% of each other." },
  panelDefFlat: { v:3,  min:0,  max:10, label:"Shield panel: flat bonus",
                  note:"Higher than attack's on purpose - surplus shields are wasted, surplus attack is not." },
  panelHeal:    { v:4,  min:0,  max:10, label:"Repair panel: health per 3" },
  panelEnergy:  { v:2,  min:0,  max:10, label:"Energy panel: Energy gained" },
  reactorNow:   { v:3,  min:0,  max:12, label:"Reactor: Energy if you take the cash" },
  reactorCap:   { v:3,  min:0,  max:8,  label:"Reactor: most you can raise your base by" },
  soakPerShip:  { v:2,  min:0,  max:12, label:"Damage a ship soaks",
                  note:"Flat, whatever the hull. Measured: at 5 you would always sacrifice, at 2 it stays a decision." },
  soakRounds:   { v:4,  min:1,  max:8,  label:"Rounds a crippled ship stays half dark" },
  panelDirect:  { v:3,  min:0,  max:8,  label:"Direct panel: Direct per 4 rolled",
                  note:"Direct goes past shields and past any ship soaking for you." },
  escFrom:      { v:8,  min:0,  max:20, label:"The war escalates after round",
                  note:"0 turns it off. Stops a match dragging into a fourth week." },
  escPer:       { v:2,  min:0,  max:6,  label:"Extra damage per round after that" },
  rounds:       { v:40, min:3,  max:60, label:"Longest a match may run",
                  note:"A safety net, not the ending. Matches end when a flagship dies." },
  startDice:    { v:4,  min:1,  max:8,  label:"Ships you start with" },
  maxDice:      { v:8,  min:3,  max:8,  label:"Fleet slots",
                  note:"Eight around the flagship, which holds the ninth." },
  maxSame:      { v:2,  min:1,  max:6,  label:"Most copies of one panel" },
  rollsPerRound:{ v:3,  min:1,  max:5,  label:"Rolls each round",
                  note:"Hold the dice you want, reroll the rest." },
  nudgeCost:    { v:1,  min:1,  max:4,  label:"Energy per nudge" },
  rerollCost:   { v:1,  min:1,  max:4,  label:"Energy per extra reroll",
                  note:"Per die, once your free rolls are gone." },
  oneEnergy:    { v:2,  min:0,  max:4,  label:"Energy a 1 also pays" },
  twoEnergy:    { v:1,  min:0,  max:4,  label:"Energy a 2 also pays",
                  note:"Both still fight. Energy is on top." },
  runMin:       { v:5,  min:3,  max:8,  label:"Dice needed for a straight",
                  note:"Prizes step up by length; see the table on the roll screen." },
  runMult:      { v:1,  min:0,  max:3,  label:"Straight bonus multiplier", step:0.25,
                  note:"Scales the whole straight table." },
  priceD4:      { v:4,  min:1,  max:20, label:"Price of a d4" },
  priceD6:      { v:6,  min:1,  max:20, label:"Price of a d6" },
  priceD8:      { v:9,  min:1,  max:30, label:"Price of a d8" },
  priceD10:     { v:13, min:1,  max:40, label:"Price of a d10" },
  sellBack:     { v:50, min:0,  max:100,label:"Sale price, % of cost", step:5 },
  rocketPay:    { v:25, min:5,  max:60, label:"Attack from a launched Rocket",
                  note:"One shot. It fills two flagship faces and leaves them blank." },
  rocketCost:   { v:20, min:5,  max:40, label:"Price of a Rocket",
                  note:"At 15 the best line wins 59%, which is too good. At 20 it is 55%." },
  botPace:      { v:1,  min:0,  max:3,  label:"How fast they grow", step:0.5,
                  note:"1 = even match. Lower is easier." }
};
function K(name){ return C[name].v; }

var DEFAULTS = {};
Object.keys(C).forEach(function(k){ DEFAULTS[k] = C[k].v; });

// Priced by what a die is actually worth, not by how many sides it has. At the
// old prices two d4s beat one d6 for the same money, so saving up was
// mathematically wrong and "buy the cheapest thing" always won.
function priceOf(sides){
  return { 4:K("priceD4"), 6:K("priceD6"), 8:K("priceD8"), 10:K("priceD10") }[sides];
}
function sellValue(sides){
  return Math.floor(priceOf(sides) * K("sellBack") / 100);
}

// A 1 fights for nobody but pays the most Energy. A 2 does both: it attacks
// AND pays, which is what makes a low roll worth keeping instead of a dud.
// ── the flagship ─────────────────────────────────────────────────────────
// Six faces you design yourself. Its faces are panels rather than numbers, so
// it cannot join a straight - that is the price of the most powerful ship.
// The starting six all SUPPORT the fleet rather than acting alone, which is
// what makes building ships worth doing.
//
// Nothing multiplies. A x2 panel tested 40% ahead of a flat one early and 69%
// ahead by mid-game, because multipliers grow with everything you build. Per-die
// bonuses grow too, but they stop at your slot count, so they stay proportionate.
// ── the four level-1 panels ──────────────────────────────────────────────
// One per thing the game is made of: attack, shields, health, Energy. Each
// round you find out which of the four your flagship is enhancing.
//
// Balanced by playing each one on all six faces against each of the others,
// 15,000 matches a pairing. Every pair lands between 46% and 56%:
//
//              Attack  Shield   Heal  Energy
//   Attack        --     50%    51%     46%
//   Shield       51%      --    47%     56%
//   Heal         49%     53%     --     56%
//   Energy       53%     44%    44%      --
//
// Two things fell out of the numbers that are worth keeping in mind.
//
// SHIELDS NEED MORE THAN ATTACK. Red and blue faces come up almost exactly as
// often (4.09 against 3.91 on a mid fleet), so +1 a die ought to be even - but
// attack beat shields 57/43 at equal rates, because surplus attack still counts
// and surplus shields are thrown away. Hence +3 flat against attack's +2.
//
// HEALING FADES AS YOUR FLEET GROWS, exactly as you predicted. Threes per round:
// 1.21 on the starting four d4s, 1.53 at mid game, 1.08 late, 0.69 on eight
// d10s. So the heal panel is at its best early and quietly becomes the weakest
// of the four in a capital fleet. That is a real arc rather than a flaw - it
// just means the panel you want in round two is not the one you want in nine.
var PANELS = {
  atkEach:  { name:"Attack",  starter:true,
              desc:"Every red die hits for 1 more, and 2 attack on top." },
  defEach:  { name:"Shields", starter:true,
              desc:"Every blue die holds for 1 more, and 3 shields on top." },
  repair:   { name:"Repair",  starter:true,
              desc:"Every 3 heals 4 more." },
  energy2:  { name:"Energy",  starter:true,
              desc:"Gain 2 Energy." },
  direct:   { name:"Direct Hit", starter:true,
              desc:"Every 4 you roll hits for 3 Direct — straight past shields." },
  // Face 2, deliberately empty while we finish the fodder rules. An honest blank
  // is better than a filler panel nobody wants to roll.
  // Face 2. The only panel that changes your future rather than your round, and
  // the only one you choose. +1 base is worth exactly the rounds remaining, so the
  // engine is right early and the cash is right late - the hinge is about round 7.
  // Capped, because a permanent gain from a random face is the one thing that can
  // still run away from us.
  reactor:  { name:"Reactor",    starter:true, choose:true,
              desc:"Take Energy now, or raise your base Energy for the rest of the match." },

  // The first panel that pays a small fleet more than a big one, and by a long
  // way: measured over three rolls a round, eight d4s show 2.81 threes while
  // eight d10s show 0.69. So it pays 5.6 to a swarm and 1.4 to a capital fleet -
  // a 4x spread, where every other panel is within 10% across fleets. Priced low
  // because on a normal fleet it is worth about a third of a starter panel.
  // "+1 to each 3" was the right idea; +1 measured at 1.5 a round on a mid fleet,
  // too little to give up a face for, so it is +2.
  //
  // Honest limit: this does NOT make a cheap wide fleet viable (2.1% -> 1.7%).
  // Nothing about healing can, because a d4 only carries 1-4, so eight of them
  // cap out at a straight of FOUR, which pays Energy - and every straight reward
  // scales with the biggest ship in it anyway. See TARGETING.md section 10.
  medbay:   { name:"Medical Bay",    cost:7,  desc:"Every 3 heals 6 more." },

  atkEach2: { name:"Attack +2 each", cost:7,  desc:"Every red die hits for 2 more." },
  defEach4: { name:"Shield +2 each", cost:7,  desc:"Every blue die holds for 2 more." },
  energy5:  { name:"Energy +5",      cost:10, desc:"Gain 5 Energy." },
  atk9:     { name:"Attack +9",      cost:9,  desc:"Add 9 attack." },

  // Charged panels. They cost Energy to fire in the round they come up, which
  // is what gives Energy an ongoing job now that upkeep is gone - a choice you
  // make rather than a bill you owe. Every one of them is worth roughly three
  // times its charge, so firing is usually right and skipping is never a
  // disaster.
  overload: { name:"Overload",  cost:11, charge:3,
              desc:"Pay 3 Energy: add 20 attack. Free: add 5." },
  bulwark:  { name:"Bulwark",   cost:11, charge:3,
              desc:"Pay 3 Energy: add 20 shields. Free: add 5." },
  fullSpread:{name:"Full Spread", cost:12, charge:2,
              desc:"Pay 2 Energy: every red die hits for 4 more. Free: 1 more." },
  refit:    { name:"Refit Bay", cost:11, charge:4,
              desc:"Pay 4 Energy: a free d6 joins your fleet. Free: gain 2 Energy." },

  // The rocket. It is huge, so it takes up two sides of the ship - and that one
  // rule is the theme and the balance at once. Measured: on a single face it
  // fires in 56% of matches and the plan LOSES at 45.4%; across two faces it
  // fires 84% and wins 52.6%. Letting the player choose the round instead wins
  // 67%, and raising the price barely touches that, because by round eight the
  // Energy you are hoarding was worthless anyway. Not knowing is the price.
  rocket:   { name:"Rocket", cost:20, oneShot:true, faces:2,
              desc:"Fills two faces. The first round either one comes up it launches, then both are left blank." },
  // What a launched rocket leaves behind. Not in the store - you reach it by
  // firing, and then it is a hardpoint you can arm again with anything.
  blank:    { name:"Empty hardpoint", hidden:true,
              desc:"Nothing mounted. Buy a panel for it." }
};
function chargeOf(id){ return PANELS[id] ? (PANELS[id].charge || 0) : 0; }
// The rocket's price lives in the Tune panel so it can be balanced without a
// rebuild; everything else carries its price on the panel itself.
function panelCost(id){
  if (id === "rocket") return K("rocketCost");
  return PANELS[id] ? (PANELS[id].cost || 0) : 0;
}
// THE FLAGSHIP IS A NORMAL d6, and its faces mean what the same numbers mean on
// every other ship. That is the whole trick: you already know what a 3 does, so
// you already know what the flagship's 3 does.
//
//   1  boosts Energy    - a 1 pays Energy on a ship
//   2  held open        - the last slot, for whatever we land on
//   3  boosts Health    - a 3 heals on a ship
//   4  boosts Direct    - a 4 is the Direct face on a ship
//   5  boosts Shields   - 5 is odd, and odd blocks
//   6  boosts Attack    - 6 is even, and even hits
//
// Nothing to memorise and nothing to look up, which is also why the whole game
// still works with physical dice on a table.
function starterPanels(){
  return ["energy2", "reactor", "repair", "direct", "defEach", "atkEach"];
}
function storePanels(){
  return Object.keys(PANELS).filter(function(k){
    return !PANELS[k].starter && !PANELS[k].hidden;
  });
}
function facesUsed(id){ return PANELS[id] && PANELS[id].faces ? PANELS[id].faces : 1; }
function isOneShot(id){ return !!(PANELS[id] && PANELS[id].oneShot); }
// A rocket sits on more than one face, so mounting it writes the picked face and
// the ones after it. Wrapping keeps it simple and predictable: you always know
// which sides you are giving up before you pay.
function mountPanel(flag, face, id){
  var n = facesUsed(id), i;
  for (i = 0; i < n; i++) flag.panels[(face + i) % flag.panels.length] = id;
}
// Fired the moment the flagship rolls it. Nothing to decide, which is exactly
// what stops it being the dominant play.
function launchIfRocket(side){
  if (!isOneShot(flagPanel(side))) return "";
  var id = flagPanel(side), i;
  for (i = 0; i < side.flag.panels.length; i++)
    if (side.flag.panels[i] === id) side.flag.panels[i] = "blank";
  return id;
}
function countPanel(flag, id){
  var n = 0, i;
  for (i = 0; i < flag.panels.length; i++) if (flag.panels[i] === id) n++;
  return n;
}

// Applied after the fleet is totalled, so support panels see the whole fleet.
function applyPanel(id, t, dice){
  var reds = 0, blues = 0, threes = 0, fours = 0, i, v;
  for (i = 0; i < dice.length; i++){
    v = dice[i].value;
    if (v % 2 === 0) reds++; else blues++;
    if (v === 3) threes++;
    if (v === 4) fours++;
  }
  // The level-1 panels, one per face of the flagship d6. Numbers justified in
  // the block above PANELS.
  if (id === "atkEach"){ t.attack  += reds  + K("panelAtkFlat"); }
  if (id === "defEach"){ t.defense += blues + K("panelDefFlat"); }
  if (id === "repair")   t.heal    += threes * K("panelHeal");
  if (id === "energy2")  t.energy  += K("panelEnergy");
  // Direct goes past shields and past the hulls, so it is tracked on its own and
  // never touches the attack total.
  if (id === "direct")   t.direct  += fours * K("panelDirect");
  // Level 2 of the heal line. It has to clear the starter, which now pays 4 a
  // three, so 2 would have been a downgrade.
  if (id === "medbay")   t.heal    += threes * 6;
  // ── level 2, bought in the shipyard ──
  if (id === "atkEach2") t.attack  += reds * 2;
  if (id === "defEach4") t.defense += blues * 2;
  if (id === "energy5")  t.energy  += 5;
  if (id === "atk9")     t.attack  += 9;

  var on = t.charged;                       // did the player pay to fire it?
  if (id === "overload")  t.attack  += on ? 20 : 5;
  if (id === "bulwark")   t.defense += on ? 20 : 5;
  if (id === "fullSpread")t.attack  += reds * (on ? 4 : 1);
  if (id === "refit"){ if (on) t.shipPrize = 6; else t.energy += 2; }

  // One-shots need no charge and offer no choice. Rolling the face IS the event.
  if (id === "rocket"){ t.attack += K("rocketPay"); t.launching = true; }

  t.rerolls = 0;
  return t;
}

// One rule for every face: odd numbers block, even numbers hit, and the two
// lowest also pay Energy on top. Nothing sits out the fight.
//
// That gives the die a shape worth holding. Valuing an Energy at about two
// attack, the faces of a d6 are worth 5, 4, 3, 4, 5, 6 - so the 1 is your best
// low roll, the middle is the dead zone you reroll, and the top is the top. Both
// ends of the die are good for opposite reasons.
//
// Energy has one job: it is what you spend. Rerolls, nudges, ships, panels. It
// is never a bill you owe - v11 removed the upkeep that used to tax big ships,
// because price already did that work.
function kindOf(n){ return n % 2 === 0 ? "attack" : "defense"; }
function energyOf(n){
  if (n === 1) return K("oneEnergy");
  if (n === 2) return K("twoEnergy");
  return 0;
}
// Health rides on the 3, the way Energy rides on the 1 and the 2 - and the 3 is
// a BLUE face, so it blocks and heals at once. That is what finally makes a
// defensive round pay for itself, which has been the game's biggest hole since
// v07. Every die has a 3, so no ship is left out of the rule.
function healOf(n){ return n === 3 ? K("healThree") : 0; }
function bolts(n){
  var e = energyOf(n), out = "", i;
  for (i = 0; i < e; i++) out += "\u26a1";
  return out;
}
function roll(sides){ return 1 + Math.floor(Math.random() * sides); }

// A straight is three or more numbers in a row. Its strength comes from the
// biggest SHIP taking part, not the highest number - so a d10 rolling a 3 still
// lifts a low straight, which is what makes the ships feel like they combine.
function bestRun(dice){
  var bySize = {}, i, v;
  for (i = 0; i < dice.length; i++){
    v = dice[i].value;
    if (!bySize[v] || dice[i].sides > bySize[v]) bySize[v] = dice[i].sides;
  }
  var best = null;
  for (var start = 1; start <= 10; start++){
    var len = 0;
    while (bySize[start + len]) len++;
    if (len >= K("runMin")){
      var top = start + len - 1, biggest = 0;
      for (v = start; v <= top; v++) if (bySize[v] > biggest) biggest = bySize[v];
      var pay = straightBonus(len, biggest);
      // LONGEST first, value only as a tiebreak. Ranking by value looked right
      // and quietly stole options: rolling 1-2-3-4-5-6 on d4s and d8s was
      // reported as "5 in a row", because the five-tier's 12 Energy scores higher
      // than the six-tier's 16 attack - and since you may only cash a straight at
      // its own length or shorter, the attack tier became unreachable. Find the
      // longest run and let the player decide what it is worth.
      if (!best || len > best.length || (len === best.length && pay > best.bonus)){
        best = { start: start, top: top, length: len, biggest: biggest, bonus: pay };
      }
    }
  }
  if (best) best.name = "d" + best.biggest + " straight of " + best.length;
  return best;
}

// Priced by how hard each straight actually is to roll, which turned out to be
// the opposite of the obvious guess. A d10 straight is not rarer than a d4 one -
// it is far MORE common, because once you own big ships they join almost every
// straight and quietly upgrade its tier. In an all-sizes fleet a d6 straight of
// three lands under 1% of rounds while a d10 straight of three lands 23%.
//
// LENGTH is what is rare: three-in-a-row happens most rounds, five is about one
// in ten, six about one in twenty. So length sets the size of the prize, and the
// biggest ship in the straight lifts it for what you invested to own it.
// The LENGTH of a straight decides what kind of prize you get; the biggest ship
// in it decides how big that prize is. Four in a row pays Energy, five in a row
// hits, six in a row builds you a ship the size of the largest one that took
// part. Paying attack for every length made straights 49% of all damage in a
// match, which was too much of the game; this spreads the reward across the three
// things you actually care about and lands near 29%.
// Tiers stepped up two lengths in v12, because three rolls makes a straight
// about two lengths easier to reach. Measured on a full eight-ship fleet with
// three rolls: 6 in a row lands 40% of rounds, 7 lands 16%, 8 lands 3.7% - which
// are almost exactly the odds that 4, 5 and 6 had on a single roll. Same feel,
// bigger numbers, and the whole upper ladder finally gets used.
function straightReward(length, biggest){
  var m = K("runMult"), r;
  if (length >= 8) r = { kind:"ship", ship: biggest, attack: Math.round(biggest * 2 * m),
                         label: "a free d" + biggest + " and " + Math.round(biggest * 2 * m) + " attack" };
  else if (length >= 7) r = { kind:"attack", attack: Math.round(biggest * 3 * m),
                         label: Math.round(biggest * 3 * m) + " attack" };
  else if (length >= 6) r = { kind:"attack", attack: Math.round(biggest * 2 * m),
                         label: Math.round(biggest * 2 * m) + " attack" };
  // Repriced in v15. A straight of four used to pay half the biggest ship, so on
  // a fleet of d4s it paid 2 Energy - exactly what a single die showing a 2 pays,
  // despite being enormously harder. It now pays the biggest ship outright, so
  // four in a row on d4s is worth 4, twice a lone 2.
  else if (length >= 5) r = { kind:"energy", energy: Math.round(biggest * 1.5 * m),
                         label: Math.round(biggest * 1.5 * m) + " Energy" };
  else r = { kind:"energy", energy: Math.round(biggest * m),
             label: Math.round(biggest * m) + " Energy" };
  return r;
}

// Ranked so the engine can pick the straight that is worth most.
function straightBonus(length, biggest){
  var r = straightReward(length, biggest);
  return (r.attack || 0) + (r.energy || 0) * 2 + (r.ship ? priceOf(r.ship) : 0);
}

// A longer straight may always be scored as a shorter one - take the Energy
// instead of the hit when you would rather build than fight.
function straightChoices(length, biggest){
  var out = [], L;
  for (L = K("runMin"); L <= length; L++){
    if (L >= 7 && length < 7) break;
    out.push({ length: L, reward: straightReward(L, biggest) });
  }
  return out;
}

function tally(dice, flagPanel, charged){
  var t = { attack: 0, defense: 0, energy: 0, heal: 0, direct: 0, rerolls: 0, panel: flagPanel || null,
            charged: !!charged };
  for (var i = 0; i < dice.length; i++){
    // The flagship lends its NUMBER to the straight and nothing else. Letting it
    // also score as a die would be gaining two things for one choice.
    if (dice[i].flag) continue;
    var n = dice[i].value;
    t.energy += energyOf(n);
    t.heal   += healOf(n);
    if (n % 2 === 0) t.attack += n; else t.defense += n;
  }
  var r = bestRun(dice);
  t.run = r;
  if (r){
    var take = (straightPick !== null && straightPick <= r.length) ? straightPick : r.length;
    r.taken = take;
    r.reward = straightReward(take, r.biggest);
    t.attack += r.reward.attack || 0;
    t.energy += r.reward.energy || 0;
    t.shipPrize = r.reward.ship || 0;
  }
  if (flagPanel) applyPanel(flagPanel, t, dice);
  return t;
}

// Upkeep is gone. Ships used to cost Energy every round to stay operational, and
// any you could not pay for sat out as "docked". v11 removed it because price was
// already doing that job on its own, and it left a trail of dead words behind -
// fuel, upkeep, docked - that described a rule the game no longer has.

function newShip(sides){ return { s: sides, dmg: null, back: 0 }; }
function startingDice(){
  var a = [], i;
  for (i = 0; i < K("startDice"); i++) a.push(newShip(4));
  return a;
}
// A crippled ship still rolls, but half its faces come up blank. Red-damaged
// loses the evens - its guns - and keeps blocking and healing. Blue-damaged
// loses the odds and can still shoot. A blank face is value 0, which every
// scoring rule already ignores, so nothing else had to learn about it.
function rollFace(ship){
  var v = roll(ship.s);
  if (ship.dmg === "red"  && v % 2 === 0) return 0;
  if (ship.dmg === "blue" && v % 2 === 1) return 0;
  return v;
}
function repairShips(side){
  var i;
  for (i = 0; i < side.dice.length; i++)
    if (side.dice[i].dmg && side.dice[i].back <= G.round) side.dice[i].dmg = null;
}

// ── state ────────────────────────────────────────────────────────────────
var G, sel;
var panelPick = { face: null };
var straightPick = null;      // which tier of your straight you are cashing in
// Which dice should tumble on the NEXT render, and only that one. render()
// rebuilds every die element from scratch, so a flag left set on the die itself
// replays the animation every time anything re-renders - including a tap.
var animate = {};
var charged = false;         // paid to fire a charged flagship panel this round
var pending = null;          // the round, resolved but waiting on your brace choice
var braceChoice = null;      // which ship you have tapped to take the hit
var reactorPick = null;      // 'now' or 'base', when the flagship offers the Reactor
var flagInLine = false;      // is the flagship's number part of your straight?
// The flagship is a d6 with a number on it, and it does BOTH: its boost fires AND
// its number joins your straight. It used to be a choice between the two, and
// making you pick was the wrong call - the moment worth building toward is your
// whole fleet lining up, flagship included.
//
// It costs nothing to give it away, because raising the minimum from four to five
// already paid for the ninth die: a mid fleet used to land a straight in 82% of
// rounds and now lands one in 59%, which is still less often than before.
//
// It lends its NUMBER only. It never scores as attack or shields, or the flagship
// would be doing three jobs off one roll.

function newGame(){
  G = {
    round: 1,
    phase: "roll",
    you:  { dice: startingDice(), values: [], energy: 0, damage: 0, rolls: 1,
            hp: K("startHP"), base: 0, flag: { panels: starterPanels(), face: 0 } },
    them: { dice: startingDice(), values: [], energy: 0, damage: 0,
            hp: K("startHP"), base: 0, flag: { panels: starterPanels(), face: 0 } },
    report: null
  };
  sel = {};
  panelPick.face = null;
  straightPick = null;
  charged = false;
  reactorPick = null;
  rollAll(G.you);
  render();
}

function rollAll(side){
  side.values = side.dice.map(function(d){ return { sides: d.s, value: rollFace(d), ship: d }; });
  if (side === G.you){
    animate = { flag: true };
    for (var i = 0; i < side.values.length; i++) animate[i] = true;
  }
  side.flag.face = Math.floor(Math.random() * 6);
}
function flagPanel(side){ return side.flag.panels[side.flag.face]; }
function flagNumber(side){ return side.flag.face + 1; }
// Your roll, plus the flagship if you have sent it into the line.
function runDice(side){
  return liveDice(side).concat([{ sides: 6, value: flagNumber(side), flag: true }]);
}
function rollFlag(side){ side.flag.face = Math.floor(Math.random() * 6); }

function liveDice(side){ return side.values; }

// You tap the dice you want to CHANGE, always - whether the roll is free or paid.
// Three free rolls a round, then 1 Energy per die after that.
//
// The decision has teeth because the dice you send back to chase a longer
// straight are dice whose attack you are gambling: reroll an 8 and a 10 hunting
// one more number and you have staked 18 attack on it.
function pickedDice(){
  var out = [], i;
  for (i = 0; i < G.you.values.length; i++) if (sel[i]) out.push(i);
  return out;
}
function doReroll(){
  var picked = pickedDice(), free = G.you.rolls < K("rollsPerRound");
  if (!picked.length && !sel.flag) return toast("Tap the dice you want to reroll");
  if (!free){
    var cost = picked.length * K("rerollCost");
    if (G.you.energy < cost) return toast("That costs " + cost + " Energy");
    G.you.energy -= cost;
  } else {
    G.you.rolls++;
  }
  animate = {};
  picked.forEach(function(i){
    G.you.values[i].value = roll(G.you.values[i].sides);
    animate[i] = true;                       // only the dice that actually moved
  });
  if (sel.flag){ rollFlag(G.you); animate.flag = true; }
  sel = {};
  render();
}

// They hold whatever helps their longest straight, then top up on high numbers,
// and they get the same number of rolls you do.
function playThem(){
  rollAll(G.them);
  for (var r = 1; r < K("rollsPerRound"); r++){
    var keep = botHolds(G.them.values);
    for (var i = 0; i < G.them.values.length; i++){
      if (!keep[i]) G.them.values[i].value = roll(G.them.values[i].sides);
    }
  }
}

// Hold one die of each value inside the most promising window, plus any die
// already showing a high number.
function botHolds(vals){
  var keep = {}, bestWin = null, st, v, i, need;
  for (st = 1; st <= 10; st++){
    need = [];
    for (v = st; v < st + K("runMin") + 2 && v <= 10; v++){
      for (i = 0; i < vals.length; i++)
        if (vals[i].value === v && need.indexOf(i) < 0){ need.push(i); break; }
    }
    if (!bestWin || need.length > bestWin.length) bestWin = need;
  }
  for (i = 0; i < bestWin.length; i++) keep[bestWin[i]] = true;
  for (i = 0; i < vals.length; i++)
    if (!keep[i] && vals[i].value > vals[i].sides * 0.7) keep[i] = true;
  return keep;
}

function submit(){
  playThem();
  var you = tally(runDice(G.you), flagPanel(G.you), charged);
  if (charged) G.you.energy -= chargeOf(flagPanel(G.you));
  var them = tally(runDice(G.them), flagPanel(G.them), false);

  var bump = escalation();
  // Direct is added AFTER shields have done their work, which is the whole point
  // of it - it is the only damage in the game the other side cannot answer.
  var youDealt  = Math.max(0, you.attack  + bump - them.defense) + you.direct;
  var themDealt = Math.max(0, them.attack + bump - you.defense)  + them.direct;

  if (flagPanel(G.you) === "reactor"){
    if (reactorPick === "base" && G.you.base < K("reactorCap")) G.you.base++;
    else you.energy += K("reactorNow");
  }
  if (flagPanel(G.them) === "reactor"){
    // They take the engine while there is time for it to pay, and the cash after.
    if (G.them.base < K("reactorCap") && G.round <= 7) G.them.base++;
    else them.energy += K("reactorNow");
  }
  var youLaunched  = launchIfRocket(G.you);
  var themLaunched = launchIfRocket(G.them);

  if (you.shipPrize && G.you.dice.length < K("maxDice")){
    G.you.dice.push(newShip(you.shipPrize));
    you.shipBuilt = you.shipPrize;
  }

  // Everything is settled except where THEIR shot lands. That is yours to decide,
  // so the round pauses here.
  pending = { you: you, them: them, youDealt: youDealt, themDealt: themDealt,
              incoming: themDealt, soaked: 0, sacrificed: null, bump: bump,
              shipBuilt: you.shipBuilt || 0,
              themDice: liveDice(G.them).slice(),
              youPanel: youLaunched || flagPanel(G.you),
              themPanel: themLaunched || flagPanel(G.them),
              youLaunched: youLaunched, themLaunched: themLaunched, charged: charged };
  braceChoice = null;
  if (themDealt > 0 && canSoak(G.you) && K("soakPerShip") > 0){
    G.phase = "brace";
    return render();
  }
  settleRound();
}

// Apply the round once you have decided how to take the hit.
function settleRound(){
  var p = pending, you = p.you, them = p.them;
  p.themDealt = Math.max(0, p.incoming - p.soaked);
  var themDealt = p.themDealt, youDealt = p.youDealt;
  // Their side braces too.
  youDealt = themBrace(youDealt);
  p.youDealt = youDealt;

  G.you.hp  += you.heal;
  G.them.hp += them.heal;
  G.you.hp  -= themDealt;
  G.them.hp -= youDealt;
  G.you.damage  += youDealt;
  G.them.damage += themDealt;
  G.you.energy  += you.energy  + G.you.base;
  G.them.energy += them.energy + G.them.base;

  G.report = p;
  pending = null;
  G.phase = "report";
  render();
}

// ── taking the hit ───────────────────────────────────────────────────────
// The attacker never chooses a target. The DEFENDER decides where the damage
// lands, which is what stops the death spiral that killed attacker-chosen
// targeting: nobody ever picks a trade that is worse for them than the
// alternative, so the victim always controls their own decline.
//
// One ship a round. It soaks a flat amount whatever its size, because half a d10
// is barely worth more than half a d4 - so a scaled soak would make your biggest
// ship the best fodder, which is backwards. Flat makes cheap hulls the fodder.
function canSoak(side){ return side.dice.length > 0; }
function soakWith(side, i, half){
  var ship = side.dice[i], soak = K("soakPerShip");
  if (ship.dmg){                       // already crippled - finish it off
    side.dice.splice(i, 1);
    return { soak: soak, lost: ship.s };
  }
  ship.dmg = half;
  ship.back = G.round + K("soakRounds");
  return { soak: soak, lost: 0 };
}
// They brace when the hit is big enough to matter against what is left of them.
function themBrace(dmg){
  var t = G.them, i, ship;
  if (dmg <= 0 || !t.dice.length) return dmg;
  if (dmg < K("soakPerShip") && t.hp > 20) return dmg;
  if (t.hp - dmg > 30) return dmg;
  for (i = 0; i < t.dice.length; i++) if (t.dice[i].dmg){ ship = i; break; }
  if (ship === undefined){
    ship = 0;
    for (i = 1; i < t.dice.length; i++) if (t.dice[i].s < t.dice[ship].s) ship = i;
  }
  var r = soakWith(t, ship, Math.random() < 0.5 ? "red" : "blue");
  return Math.max(0, dmg - r.soak);
}

function escalation(){
  var from = K("escFrom");
  if (!from || G.round <= from) return 0;
  return (G.round - from) * K("escPer");
}
// The match is over when a flagship is destroyed. There is no round limit any
// more - measured across 54,000 uncapped matches, not one failed to end, because
// attack scales with fleet quality while healing per die shrinks as your ships
// get bigger. The ramp is already in the dice.
function matchOver(){
  return G.you.hp <= 0 || G.them.hp <= 0 || G.round >= K("rounds");
}
function nextRound(){
  if (matchOver()){ G.phase = "over"; return render(); }
  G.round++;
  G.phase = "shop";
  render();
}

function startRound(){
  repairShips(G.you); repairShips(G.them);
  G.you.rolls = 1;
  sel = {};
  straightPick = null;
  charged = false;
  reactorPick = null;
  rollAll(G.you);
  G.phase = "roll";
  render();
}

// Spending Energy mid-round: move one die by one. A reroll is a gamble that
// only helps this round, so paying for extra rerolls was always the wrong
// call; a nudge is precise, and it is usually what completes a run.
function doNudge(delta){
  var ids = pickedDice();
  if (ids.length !== 1) return toast("Tap exactly one die to nudge");
  if (G.you.energy < K("nudgeCost")) return toast("Not enough Energy");
  var d = G.you.values[ids[0]];
  var next = d.value + delta;
  if (next < 1 || next > d.sides) return toast("That die can't go past " + (next < 1 ? 1 : d.sides));
  G.you.energy -= K("nudgeCost");
  d.value = next;
  animate = {};
  animate[ids[0]] = true;
  render();
}

// ── shop ─────────────────────────────────────────────────────────────────
function buyDie(sides){
  var cost = priceOf(sides);
  if (G.you.dice.length >= K("maxDice")) return toast("No room \u2014 sell a ship first");
  if (G.you.energy < cost) return;
  G.you.energy -= cost;
  G.you.dice.push(newShip(sides));
  toast("d" + sides + " joined your fleet");
  render();
}
function sellDie(i){
  if (G.you.dice.length <= 1) return toast("You need at least one ship");
  var sides = G.you.dice[i].s;
  G.you.energy += sellValue(sides);
  G.you.dice.splice(i, 1);
  toast("Scrapped a d" + sides + " for " + sellValue(sides) + " Energy");
  render();
}

// The opponent grows on a fixed schedule so it keeps pace.
// They grow on a schedule rather than thinking. botPace scales how much they
// get: 1 is an even match, lower makes them easier to beat.
function themGrow(){
  var t = G.them, pace = K("botPace"), i, nx;
  // they fit one stronger panel partway through, keeping the max-2 rule
  if (G.round === 5 && Math.random() < pace) t.flag.panels[0] = "atkEach2";
  if (G.round === 8 && Math.random() < pace) t.flag.panels[5] = "atk9";
  // They bolt on a rocket late, which is when the measurements say it is worth
  // buying - so you get to feel it coming as well as firing it.
  if (G.round === 7 && Math.random() < pace * 0.6 && countPanel(t.flag, "rocket") === 0)
    mountPanel(t.flag, 2, "rocket");
  var buyOn = [2, 4, 6], growOn = [3, 5, 7, 9];
  if (buyOn.indexOf(G.round) >= 0 && Math.random() < pace && t.dice.length < K("maxDice")) t.dice.push(newShip(4));
  if (growOn.indexOf(G.round) >= 0 && Math.random() < pace){
    for (i = 0; i < t.dice.length; i++){
      nx = { 4:6, 6:8, 8:10 }[t.dice[i].s];
      if (nx){ t.dice[i].s = nx; break; }
    }
  }
}

// ── views ────────────────────────────────────────────────────────────────
// The hull is the shape: triangle for a d4, square for a d6, diamond for a d8,
// pentagon for a d10. Once the silhouette carries the size, the little "d4"
// caption is redundant and comes off - you read the ship at a glance instead of
// reading a label.
//
// Numbers sit at each shape's visual centre, which is not the same as its
// geometric one. A triangle's mass is low so the digit drops; a pentagon's is
// slightly high so it lifts.
// Each hull has its own centre of mass, so the number and the Energy bolts sit
// where they would actually be printed on that face rather than at the geometric
// middle. A triangle is widest at the bottom, so its bolts tuck low; a diamond
// narrows fast, so its number rides higher to leave room beneath.
//
// The bolts are large now, which makes the polygon walls the real constraint. A
// bolt at scale r is 12r tall and about 7r wide, so two of them at boltY need
// (9r + 7r) of clear width there. The diamond is the tightest — at y 76 it is
// only 34 units across — so it runs smaller bolts than the others.
var HULLS = {
  4:  { pts:"50,10 93,84 7,84",            textY:50, scale:0.95, boltY:69, boltR:1.70 },
  6:  { pts:"15,15 85,15 85,85 15,85",     textY:48, scale:0.92, boltY:68, boltR:1.70 },
  8:  { pts:"50,6 92,50 50,94 8,50",       textY:48, scale:0.95, boltY:67, boltR:1.50 },
  10: { pts:"50,5 94,38 77,92 23,92 6,38", textY:52, scale:1.00, boltY:72, boltR:1.80 }
};

// One small lightning glyph, drawn rather than typed, so it scales cleanly and
// never turns into an emoji on someone's phone.
var BOLT = "M0,-6 L-3.4,1 L-0.6,1 L-2.4,6 L3.4,-1.4 L0.6,-1.4 Z";
// A medical cross, drawn at the same 12-unit height as the bolt so the two
// symbols sit in exactly the same place on the face and read as siblings.
var CROSS = "M-2,-6 L2,-6 L2,-2 L6,-2 L6,2 L2,2 L2,6 L-2,6 L-2,2 L-6,2 L-6,-2 L-2,-2 Z";
// Direct: a double chevron. It points, because that is what the damage does - it
// goes through rather than landing on something.
var CHEV = "M-4,-6 L1.2,0 L-4,6 L-1.2,6 L4,0 L-1.2,-6 Z";

// One row of symbols, centred, drawn inside the hull below the number. Bolts on
// a 1 or a 2, crosses on a 3 - never both, so they can share the same slot.
function marksSvg(count, glyph, colour, y, r, gap, cls){
  if (!count) return "";
  var out = "", start = -(gap * (count - 1)) / 2, i;
  for (i = 0; i < count; i++){
    out += '<path class="' + cls + '" d="' + glyph + '" fill="' + colour + '" ' +
      'transform="translate(' + (50 + start + i * gap) + ',' + y + ') scale(' + r + ')"/>';
  }
  return out;
}
function boltsSvg(count, boltY, r){
  return marksSvg(count, BOLT, "var(--nrg)", boltY, r, 9 * r, "mk");
}
// The cross is 12 units across where the bolt is only 7. Two things ran the
// three of them together into a solid bar: the bolt's gap was narrower than a
// cross, and the hull's glow is a 5px drop-shadow, which bled across whatever
// space was left. So crosses get a smaller scale, a much wider gap, and a
// tighter shadow of their own (see .hull path.cr).
// Gap tuned by eye against the glyph: a space about 60% of a cross's width
// reads as three symbols without drifting apart. 13r was too airy, 9r too tight.
function crossesSvg(count, y, r){
  return marksSvg(count, CROSS, "var(--hp)", y, r * 0.52, 10 * r, "cr");
}
function chevronsSvg(count, y, r){
  return marksSvg(count, CHEV, "var(--direct)", y, r * 0.9, 9 * r, "ch");
}
// A 4 only carries Direct while the flagship is actually firing it, so the mark
// never promises damage that is not happening.
function directLive(){
  return G && G.you && flagPanel(G.you) === "direct" ? K("panelDirect") : 0;
}

function hullSvg(size, value, kind){
  var h = HULLS[size] || HULLS[6];
  var col = kind === "attack" ? "var(--red)" : kind === "defense" ? "var(--blue)" : "var(--faint)";
  return '<svg class="hull" viewBox="0 0 100 100" aria-hidden="true">' +
    '<polygon points="' + h.pts + '" fill="' + col + '" fill-opacity="0.13" ' +
      'stroke="' + col + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<text x="50" y="' + h.textY + '" text-anchor="middle" fill="' + col + '" ' +
      'font-size="' + (40 * h.scale) + '" font-weight="800" ' +
      'style="font-variant-numeric:tabular-nums">' + value + '</text>' +
    boltsSvg(energyOf(value), h.boltY, h.boltR) +
    crossesSvg(healOf(value) ? Math.min(healOf(value), 4) : 0, h.boltY, h.boltR) +
    chevronsSvg(value === 4 && kind !== "dry" ? Math.min(directLive(), 4) : 0, h.boltY, h.boltR) +
    '</svg>';
}

function dieHtml(d, i, clickable){
  var k = kindOf(d.value);
  var cls = k === "attack" ? "r" : "b";
  var label = k === "attack" ? "Attack" : "Shield";
  var extra = (d.inrun ? " inrun" : "") + (animate[i] ? " rolled" : "") +
    (d.value === 4 && directLive() ? " pierce" : "");
  return '<div class="die ' + cls + (sel[i] ? " sel" : "") + extra + '"' +
    (clickable ? ' data-die="' + i + '"' : '') + '>' +
    hullSvg(d.sides, d.value, k) +
    '<div class="kind">' + label + '</div></div>';
}

// Nine cells. The flagship holds the middle; the fleet forms up around it.
function gridHtml(){
  var cells = [], fleet = G.you.values.slice(0, 8), i;
  for (i = 0; i < 9; i++){
    if (i === 4){ cells.push(flagHtml()); continue; }
    var ix = i < 4 ? i : i - 1;
    cells.push(ix < fleet.length ? dieHtml(fleet[ix], ix, true) : '<div class="slot"></div>');
  }
  return '<div class="grid">' + cells.join("") + '</div>';
}

function flagHtml(){
  var id = flagPanel(G.you), p = PANELS[id], c = chargeOf(id);
  return '<div class="die flag' + (sel.flag ? ' sel' : '') + (charged ? ' lit' : '') +
    (flagInLine ? ' inrun' : '') +
    (animate.flag ? ' rolled' : '') + '" data-flag="1">' +
    '<div class="lbl">Flagship \u00b7 ' + flagNumber(G.you) + '</div>' +
    '<div class="pname">' + p.name + '</div>' +
    '<div class="pdesc">' + p.desc + '</div>' +
    (c ? '<div class="chg">' + (charged ? "FIRING" : c + "\u26a1 to fire") + '</div>' : '') +
    '</div>';
}

// A small reference so the payoffs are never a mystery.
function straightTableHtml(){
  var sizes = [4,6,8,10], rows = "";
  var lo = K("runMin");
  for (var L = lo; L <= lo + 2; L++){
    rows += '<tr><td>' + L + ' in a row</td>';
    for (var i = 0; i < sizes.length; i++){
      var r = straightReward(L, sizes[i]);
      rows += '<td>' + (r.kind === "energy" ? r.energy + "\u26a1"
                      : r.kind === "ship" ? "d" + r.ship
                      : r.attack) + '</td>';
    }
    rows += '</tr>';
  }
  return '<table class="stab"><tr><th>biggest ship</th>' +
    sizes.map(function(s){ return '<th>d' + s + '</th>'; }).join("") + '</tr>' + rows +
    '</table><p class="hint">Four pays Energy, five hits, six builds you a ship.</p>';
}

function rollView(){
  var live = runDice(G.you);
  var t = tally(live, flagPanel(G.you), charged);
  var vals = live.map(function(d){ return d.value; });
  var fn = flagNumber(G.you);
  flagInLine = !!(t.run && fn >= t.run.start && fn <= t.run.top);
  if (t.run){
    for (var v = t.run.start; v <= t.run.top; v++){
      var ix = vals.indexOf(v);
      if (ix >= 0) live[ix].inrun = true;
    }
  }
  var rollsLeft = Math.max(0, K("rollsPerRound") - G.you.rolls);
  var picked = pickedDice().length;
  var payCost = picked * K("rerollCost");

  // Heading, the grid, then the roll buttons immediately beneath it so the dice
  // are still on screen when they change.
  var h = '<h2>Roll ' + G.you.rolls + ' of ' + K("rollsPerRound") + '</h2>' +
    '<p class="say"><span class="red">Even hits</span> \u00b7 <span class="blue">odd blocks</span> \u00b7 ' +
    'a <span class="blue">1</span> or <span class="red">2</span> also pays <span class="nrg">Energy</span></p>' +
    gridHtml() +
    '<div class="row rollrow">' +
    (rollsLeft
      ? '<button class="go" id="reroll"' + (picked || sel.flag ? '' : ' disabled') + '>' +
          'Reroll ' + (picked ? picked + ' ' : '') + '\u2014 ' + rollsLeft + ' roll' +
          (rollsLeft===1?'':'s') + ' left</button>'
      : '<button id="reroll"' + (picked && G.you.energy >= payCost ? '' : ' disabled') + '>' +
          'Reroll ' + (picked ? picked + ' ' : '') + 'for ' + (payCost || K("rerollCost")) + '\u26a1</button>') +
    (picked === 1 ? '<button id="up"' + (G.you.energy >= K("nudgeCost") ? '' : ' disabled') +
        '>+1 \u2014 ' + K("nudgeCost") + '\u26a1</button>' +
      '<button id="down"' + (G.you.energy >= K("nudgeCost") ? '' : ' disabled') +
        '>\u22121 \u2014 ' + K("nudgeCost") + '\u26a1</button>' : '') +
    '</div>' +
    '<p class="hint">' + (rollsLeft
      ? 'Tap the dice you want to change \u2014 they outline in <b>white</b>. Anything you send back gambles its attack.'
      : 'Free rolls are gone. From here a reroll costs ' + K("rerollCost") +
        ' Energy a die, or nudge one die up or down by one.') + '</p>';

  if (flagPanel(G.you) === "reactor"){
    var atCap = G.you.base >= K("reactorCap");
    h += '<div class="choose">Reactor — your flagship is offering a choice</div>' +
      '<div class="picks">' +
      '<button class="pick' + (reactorPick === "now" ? " on" : "") + '" data-reactor="now">' +
      '<b>Cash</b><span>' + K("reactorNow") + ' Energy, right now</span>' +
      '<i>' + (reactorPick === "now" ? "Chosen" : "Choose") + '</i></button>' +
      '<button class="pick' + (reactorPick === "base" ? " on" : "") + '" data-reactor="base"' +
      (atCap ? ' disabled' : '') + '>' +
      '<b>Engine</b><span>+1 Energy every round from now on' +
      (atCap ? ' — already at +' + K("reactorCap") : ' (yours is +' + G.you.base + ')') +
      '</span><i>' + (reactorPick === "base" ? "Chosen" : "Choose") + '</i></button></div>';
  }

  if (chargeOf(flagPanel(G.you))){
    h += '<div class="row"><button class="' + (charged ? 'gold' : '') + '" id="charge"' +
      (!charged && G.you.energy < chargeOf(flagPanel(G.you)) ? ' disabled' : '') + '>' +
      (charged ? 'Stand down' : 'Fire ' + PANELS[flagPanel(G.you)].name + ' \u2014 ' +
        chargeOf(flagPanel(G.you)) + '\u26a1') + '</button></div>';
  }

  if (t.run){
    var picks = straightChoices(t.run.length, t.run.biggest);
    h += '<div class="run"><span class="tag">' + t.run.length + ' in a row</span>' +
      '<span class="t"><b>' + t.run.start + ' through ' + t.run.top + '</b>' +
      '<small>' + (flagInLine
        ? 'Your flagship is in the line — and it still fires. '
        : 'The orange bars mark the ships in it. ') +
      'Biggest is a d' + t.run.biggest + '.</small></span></div>';
    // A longer straight can always be cashed as a shorter one, which means this
    // is a real decision and not a readout - so it has to look like one.
    h += '<div class="choose">Choose your reward' +
      (picks.length > 1 ? ' <em>\u2014 ' + picks.length + ' ways to take it</em>' : '') + '</div>';
    h += '<div class="picks">' + picks.map(function(p){
      var on = (t.run.taken === p.length);
      var full = p.reward.ship && G.you.dice.length >= K("maxDice");
      var kind = p.reward.ship ? "Build" : p.reward.attack ? "Strike" : "Refuel";
      return '<button class="pick' + (on ? ' on' : '') + '"' + (full ? ' disabled' : '') +
        ' data-take="' + p.length + '">' +
        '<b>' + kind + ' \u00b7 take it as ' + p.length + ' in a row</b>' +
        '<span>' + p.reward.label + (full ? ' \u2014 no slot free' : '') + '</span>' +
        '<i>' + (on ? 'Chosen' : 'Choose') + '</i></button>';
    }).join("") + '</div>';
  } else {
    h += '<p class="hint">' + K("runMin") + ' or more numbers in a row makes a <b>straight</b>. ' +
         'Longer pays far more than bigger.</p>' + straightTableHtml();
  }

  h += '<div class="tot">' +
    '<div class="a"><div class="n">' + t.attack + '</div><div class="l">Attack</div></div>' +
    '<div class="d"><div class="n">' + t.defense + '</div><div class="l">Shields</div></div>' +
    '<div class="e"><div class="n">' + t.energy + '</div><div class="l">Energy</div></div>' +
    '<div class="h"><div class="n">' + t.heal + '</div><div class="l">Health</div></div>' +
    (t.direct ? '<div class="dir"><div class="n">' + t.direct + '</div><div class="l">Direct</div></div>' : '') +
    '</div>';
  return h;
}

// You have seen the number. Now: eat it, or put a ship in front of it.

}

// Swap one face of the flagship for something stronger. Max 2 of any panel,
// because with only one face showing per roll your expected value is just the
// average of your six - so six copies of the best panel would always win.
function panelStoreHtml(){
  var flag = G.you.flag;
  var faces = flag.panels.map(function(id, i){
    var p = PANELS[id];
    return '<div class="buy' + (panelPick.face === i ? ' picked' : '') + '" data-face="' + i + '">' +
      '<div class="i"><b>Face ' + (i+1) + ' \u2014 ' + p.name + '</b><small>' + p.desc + '</small></div>' +
      '<button data-face="' + i + '">' + (panelPick.face === i ? 'Chosen' : 'Replace') + '</button></div>';
  }).join("");

  var offers = "";
  if (panelPick.face !== null){
    offers = storePanels().map(function(id){
      var p = PANELS[id], cost = panelCost(id);
      // A one-shot fills several faces, so the usual "max 2 of a kind" test does
      // not apply to it - instead you may only carry one at a time.
      var tooMany;
      if (isOneShot(id)){
        tooMany = countPanel(flag, id) > 0;
      } else {
        tooMany = countPanel(flag, id) - (flag.panels[panelPick.face] === id ? 1 : 0) + 1 > K("maxSame");
      }
      var broke = G.you.energy < cost;
      var takes = facesUsed(id) > 1
        ? ' Takes faces ' + facesUsed(id) + ' at a time, starting here.' : '';
      return '<div class="buy"><div class="i"><b>' + p.name + '</b><small>' + p.desc + takes +
        (tooMany ? (isOneShot(id) ? ' \u2014 one at a time' : ' \u2014 already have ' + K("maxSame")) : '') +
        '</small></div>' +
        '<button data-panel="' + id + '"' + (tooMany || broke ? ' disabled' : '') + '>' +
        cost + '\u26a1</button></div>';
    }).join("");
    offers = '<h3 style="margin-top:12px">Fit which panel?</h3>' + offers;
  }

  return '<div class="card"><h3>Flagship panels</h3>' +
    '<p>Your flagship rolls one of these six faces each round. Every starting panel ' +
    'helps the rest of your fleet \u2014 the store sells stronger versions. ' +
    'No more than ' + K("maxSame") + ' of any one panel.</p>' +
    faces + offers + '</div>';
}

function shopView(){
  themGrow();
  var full = G.you.dice.length >= K("maxDice");
  var buys = [4,6,8,10].map(function(s){
    var c = priceOf(s);
    return '<div class="buy"><div class="i"><b>d' + s + '</b><small>rolls 1 to ' + s +
      ' \u00b7 ' + Math.max(0, Math.ceil((s - 2) / 2)) + ' attack faces, ' +
      Math.floor((s - 2) / 2) + ' shield' +
      '</small></div>' +
      '<button data-buysize="' + s + '"' +
      (full || G.you.energy < c ? ' disabled' : '') + '>' + c + '\u26a1</button></div>';
  }).join("");
  var sells = G.you.dice.map(function(d,i){ var s = d.s;
    return '<div class="buy"><div class="i"><b>d' + s + '</b><small>scrap for ' +
      sellValue(s) + ' Energy, freeing a slot</small></div>' +
      '<button data-sell="' + i + '"' + (G.you.dice.length <= 1 ? ' disabled' : '') + '>Scrap</button></div>';
  }).join("");

  return '<h2>Between rounds</h2>' +
    '<p class="say">You have <span class="nrg">' + G.you.energy + ' Energy</span>. ' +
    'Spend it now on your fleet, or save it to nudge dice and fire your flagship.</p>' +
    '<div class="card"><h3>Shipyard</h3>' +
    '<p>You have ' + G.you.dice.length + ' of ' + K("maxDice") + ' slots filled' +
    (full ? ' \u2014 scrap something to make room.' : '.') +
    ' A bigger ship costs more but rolls bigger, and only bigger ships reach the high straights.</p>' +
    buys + '</div>' +
    '<div class="card"><h3>Scrapyard</h3>' +
    '<p>Selling returns ' + K("sellBack") + '% of what you paid. You lose on the deal, ' +
    'so scrap to make room for something better \u2014 not to raise cash.</p>' + sells + '</div>' +
    panelStoreHtml() +
    '<p class="hint">Their fleet: ' + G.them.dice.length + ' dice, largest d' + Math.max.apply(null, G.them.dice.map(function(d){ return d.s; })) + '.</p>';
}

function tuneView(){
  var rows = Object.keys(C).map(function(k){
    var c = C[k];
    return '<div class="tune">' +
      '<div class="i"><b>' + c.label + '</b>' +
      (c.note ? '<small>' + c.note + '</small>' : '') + '</div>' +
      '<input type="number" data-set="' + k + '" value="' + c.v + '" ' +
      'min="' + c.min + '" max="' + c.max + '" step="' + (c.step || 1) + '"></div>';
  }).join("");
  return '<h2>Tune the game</h2>' +
    '<p class="say">Change anything, then start a fresh match to feel it. ' +
    'These are the numbers worth arguing about \u2014 nothing here is settled.</p>' +
    '<div class="card">' + rows + '</div>' +
    '<div class="row"><button class="go" id="restart">Start a fresh match</button>' +
    '<button id="back">Back to the game</button>' +
    '<button id="reset">Reset to defaults</button></div>';
}

// Everyone fires at once across the galaxy, so both flagships going up in the
// same volley is not an edge case - measured at 18.9% of matches, near enough
// one in five. It needs a real answer rather than a shrug.
//
// The cascade, in order:
//   1. the heavier final volley - decided by the round you just watched, and it
//      lets someone steal it with one enormous last salvo
//   2. most damage across the whole match - level only 4.7% of the time after
//      step one, so this almost always settles it
//   3. a true mutual destruction - which lands in about 1 match in 5,000
function winner(){
  var mine = G.you.hp, yours = G.them.hp, r = G.report || {};
  if (mine > 0 && yours > 0)
    return { who: mine > yours ? "you" : mine < yours ? "them" : "draw", why: "health" };
  if (yours <= 0 && mine > 0) return { who: "you",  why: "kill" };
  if (mine <= 0 && yours > 0) return { who: "them", why: "kill" };
  if ((r.youDealt || 0) !== (r.themDealt || 0))
    return { who: r.youDealt > r.themDealt ? "you" : "them", why: "volley" };
  if (G.you.damage !== G.them.damage)
    return { who: G.you.damage > G.them.damage ? "you" : "them", why: "total" };
  return { who: "draw", why: "mutual" };
}

function overView(){
  var yours = Math.max(0, G.you.hp), theirs = Math.max(0, G.them.hp);
  var v = winner(), r = G.report || {}, headline, sub;
  var won = v.who === "you";

  if (v.why === "kill"){
    headline = won ? "Their flagship is destroyed" : "Your flagship is destroyed";
    sub = won ? "You won it in " + G.round + " rounds."
              : "They finished it in " + G.round + " rounds.";
  } else if (v.why === "volley"){
    headline = won ? "You win the exchange" : "You lose the exchange";
    sub = "Both flagships went up in round " + G.round +
      ". The heavier final volley takes it — <b>" + (r.youDealt || 0) + "</b> against <b>" +
      (r.themDealt || 0) + "</b>.";
  } else if (v.why === "total"){
    headline = won ? "You win on the record" : "You lose on the record";
    sub = "Both flagships destroyed, and the last volleys were level. " +
      "Damage across the whole match decides it.";
  } else if (v.why === "mutual"){
    headline = "Mutual destruction";
    sub = "Both flagships gone, the final volleys level, and neither of you " +
      "dealt a point more than the other across " + G.round + " rounds. Nobody wins this one.";
  } else {
    headline = v.who === "draw" ? "Dead heat" : won ? "You win on health" : "You lose on health";
    sub = "Neither flagship fell inside " + K("rounds") + " rounds.";
  }
  return '<div class="card center">' +
    '<h3>' + headline + '</h3>' +
    '<div style="font-size:46px;font-weight:800;margin:10px 0" class="hp">' + yours + ' – ' + theirs + '</div>' +
    '<p>' + sub + '</p>' +
    '<p class="say">You dealt <b>' + G.you.damage + '</b> damage across the match; they dealt <b>' +
      G.them.damage + '</b>.</p>' +
    '<button class="go" id="again">Play again</button></div>';
}

function render(){
  var body = G.phase === "tune" ? tuneView()
           : G.phase === "brace" ? braceView()
           : G.phase === "roll" ? rollView()
           : G.phase === "report" ? reportView()
           : G.phase === "shop" ? shopView() : overView();
  var label = G.phase === "brace" ? ""
            : G.phase === "roll" ? "Submit round"
            : G.phase === "report" ? (matchOver() ? "See result" : "Continue")
            : G.phase === "shop" ? "Roll round " + G.round : "";

  document.getElementById("app").innerHTML =
    '<div class="wrap"><header><h1>Fleet Dice <span class="ver">v' + VERSION + '</span></h1>' +
    '<span><button class="tiny" id="tune">Tune</button> ' +
    '<span class="pill">' + (G.phase === "over" ? "Finished" : "Round " + G.round) + '</span></span></header>' +
    '<div class="board"><div><div class="who">You</div><div class="val hp">' + Math.max(0, G.you.hp) + '</div></div>' +
    '<div class="mid">FLAGSHIP<br>HEALTH</div>' +
    '<div class="r"><div class="who">Them</div><div class="val hp">' + Math.max(0, G.them.hp) + '</div></div></div>' +
    body + '</div>' +
    (G.phase === "over" || G.phase === "tune" || G.phase === "brace" ? "" :
      '<div class="dock"><div class="dockin"><div class="met">' +
      '<div><div class="n p">' + G.you.energy + '</div><div class="l">Energy</div></div>' +
      '<div><div class="n">' + G.you.dice.length + '/' + K("maxDice") + '</div><div class="l">Ships</div></div>' +
      '</div><button class="go" id="next">' + label + '</button></div></div>');

  wire();
  animate = {};        // consumed - a tap re-renders without replaying it
}

function wire(){
  var n = document.getElementById("next");
  if (n) n.onclick = function(){
    if (G.phase === "roll") submit();
    else if (G.phase === "report") nextRound();
    else if (G.phase === "shop") startRound();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-take]"), function(el){
    el.onclick = function(){
      straightPick = +el.getAttribute("data-take");
      render();
    };
  });
  var ch = document.getElementById("charge");
  if (ch) ch.onclick = function(){
    var c = chargeOf(flagPanel(G.you));
    if (!charged && G.you.energy < c) return toast("Not enough Energy");
    charged = !charged;
    render();
  };
  var rr = document.getElementById("reroll");
  if (rr) rr.onclick = doReroll;
  var up = document.getElementById("up");
  if (up) up.onclick = function(){ doNudge(1); };
  var dn = document.getElementById("down");
  if (dn) dn.onclick = function(){ doNudge(-1); };
  var ag = document.getElementById("again");
  if (ag) ag.onclick = newGame;

  Array.prototype.forEach.call(document.querySelectorAll("[data-reactor]"), function(el){
    el.onclick = function(){ reactorPick = el.getAttribute("data-reactor"); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-brace]"), function(el){
    el.onclick = function(){
      var i = +el.getAttribute("data-brace");
      braceChoice = (braceChoice === i) ? null : i;
      render();
    };
  });
  function doSoak(half){
    var d = G.you.dice[braceChoice], r = soakWith(G.you, braceChoice, half);
    pending.soaked = r.soak;
    pending.sacrificed = r.lost
      ? "Your d" + r.lost + " went in front of the shot and was destroyed. It soaked " +
        r.soak + " and its slot is free again."
      : "Your d" + d.s + " took the hit and lost its " + (half === "red" ? "guns" : "screen") +
        " for " + K("soakRounds") + " rounds. It soaked " + r.soak + ".";
    braceChoice = null;
    render();
  }
  var br = document.getElementById("brace-red");   if (br) br.onclick = function(){ doSoak("red"); };
  var bb = document.getElementById("brace-blue");  if (bb) bb.onclick = function(){ doSoak("blue"); };
  var bk = document.getElementById("brace-kill");  if (bk) bk.onclick = function(){ doSoak("kill"); };
  var bn = document.getElementById("brace-none");  if (bn) bn.onclick = settleRound;
  var bd = document.getElementById("brace-done");  if (bd) bd.onclick = settleRound;

  Array.prototype.forEach.call(document.querySelectorAll("button[data-face]"), function(el){
    el.onclick = function(){
      var i = +el.getAttribute("data-face");
      panelPick.face = (panelPick.face === i) ? null : i;
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-panel]"), function(el){
    el.onclick = function(){
      var id = el.getAttribute("data-panel"), p = PANELS[id], cost = panelCost(id);
      if (panelPick.face === null || G.you.energy < cost) return;
      var flag = G.you.flag;
      if (isOneShot(id)){
        if (countPanel(flag, id) > 0) return toast("One " + p.name + " at a time");
      } else {
        var would = countPanel(flag, id) - (flag.panels[panelPick.face] === id ? 1 : 0) + 1;
        if (would > K("maxSame")) return toast("Only " + K("maxSame") + " of any panel");
      }
      G.you.energy -= cost;
      mountPanel(flag, panelPick.face, id);
      panelPick.face = null;
      toast(p.name + (facesUsed(id) > 1
        ? " bolted across " + facesUsed(id) + " faces" : " fitted to the flagship"));
      render();
    };
  });

  var tn = document.getElementById("tune");
  if (tn) tn.onclick = function(){
    if (G.phase === "tune"){ G.phase = G.resume || "roll"; }
    else { G.resume = G.phase; G.phase = "tune"; }
    render();
  };
  var bk = document.getElementById("back");
  if (bk) bk.onclick = function(){ G.phase = G.resume || "roll"; render(); };
  var rs = document.getElementById("restart");
  if (rs) rs.onclick = newGame;
  var rd = document.getElementById("reset");
  if (rd) rd.onclick = function(){ Object.keys(C).forEach(function(k){ C[k].v = DEFAULTS[k]; }); newGame(); };

  Array.prototype.forEach.call(document.querySelectorAll("[data-set]"), function(el){
    el.onchange = function(){
      var k = el.getAttribute("data-set"), c = C[k];
      var v = parseFloat(el.value);
      if (isNaN(v)) v = c.v;
      C[k].v = Math.max(c.min, Math.min(c.max, v));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-die]"), function(el){
    el.onclick = function(){
      var i = el.getAttribute("data-die");
      sel[i] = !sel[i];
      render();
    };
  });
  var fl = document.querySelector("[data-flag]");
  if (fl) fl.onclick = function(){
    sel.flag = !sel.flag;
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-buysize]"), function(el){
    el.onclick = function(){ buyDie(+el.getAttribute("data-buysize")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sell]"), function(el){
    el.onclick = function(){ sellDie(+el.getAttribute("data-sell")); };
  });
}

function toast(msg){
  var old = document.querySelector(".toast");
  if (old) old.remove();
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2200);
}

newGame();
</script>
</body>
</html>

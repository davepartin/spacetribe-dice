  if (r.you.run) notes += '<div class="line">Your <b>' + r.you.run.taken +
    ' in a row</b> paid <b>' + r.you.run.reward.label + '</b>.</div>';
  if (r.shipBuilt) notes += '<div class="line">Your straight built you a free <b>d' +
    r.shipBuilt + '</b>.</div>';
  if (yWasted) notes += '<div class="line"><b class="blue">' + yWasted +
    '</b> of their shielding went to waste — they over-defended.</div>';
  if (tWasted) notes += '<div class="line"><b class="blue">' + tWasted +
    '</b> of your shielding went to waste — you out-shielded their shot.</div>';
  if (r.fed && r.fed.length) notes += '<div class="line">' + r.fed.map(function(f){
    return 'Your <b>d' + f.s + '</b> in slot ' + f.slot; }).join(" and ") +
    ' took the hit, so ' + (r.fed.length === 1 ? 'it is' : 'they are') +
    ' <b>damaged</b> next round — no roll, no scrapping.</div>';
  notes += '<div class="line">Your flagship fired <b style="color:var(--gold)">' +
    PANELS[r.youPanel].name +
    '</b>; theirs fired <b style="color:var(--gold)">' + PANELS[r.themPanel].name + '</b>.</div>';
  notes += '<div class="line">You banked <b class="nrg">' + r.you.energy +
    ' Energy</b> from low rolls' + (r.them.heal ? ', and their 3s repaired them <b class="hp">' +
    r.them.heal + '</b>' : '') + '.</div>';

  return '<h2>Round ' + G.round + ' result</h2>' +
    '<div class="tot three">' +
      '<div class="a"><div class="n">' + r.youDealt + '</div><div class="l">You dealt</div></div>' +
      '<div class="t"><div class="n">' + r.themDealt + '</div><div class="l">You took</div></div>' +
      '<div class="h"><div class="n">' + (r.you.heal ? "+" : "") + r.you.heal +
        '</div><div class="l">Repaired</div></div>' +
    '</div>' +
    '<p class="say">Flagships — yours <b class="hp">' + Math.max(0, G.you.hp) +
      '</b>, theirs <b class="hp">' + Math.max(0, G.them.hp) + '</b>.</p>' +
    '<div class="card rolls">' +
      rollRow("You",  r.youDice,  r.you.run,  r.you.run  && r.you.run.taken) +
      rollRow("Them", r.themDice, r.them.run, r.them.run && r.them.run.taken) +
      '<div class="leg">The white die ringed in gold is a flagship \u2014 its number ' +
      'joins the line but never fires on its own.</div>' +
    '</div>' +
    '<div class="leds">' +
      '<div class="card led"><div class="ledh"><span>Your shot</span>' +
        '<b class="red">' + r.youDealt + '</b></div>' + mine + '</div>' +
      '<div class="card led"><div class="ledh"><span>Their shot</span>' +
        '<b class="red">' + r.themDealt + '</b></div>' + theirs + '</div>' +
    '</div>' +
    '<div class="card"><div class="rep">' + notes + '</div></div>';
}


// Swap one face of the flagship for something stronger. Max 2 of any panel,
// because with only one face showing per roll your expected value is just the
// average of your six - so six copies of the best panel would always win.
// Upgrade the whole flagship a level. Every face goes up by one at once, so it
// is one purchase and one number rather than six little decisions.
function flagUpgradeHtml(){
  var lvl = G.you.flag.lvl || 1;
  if (lvl >= 3){
    return '<div class="card"><div class="rep"><div class="line">' +
      'Your flagship is at <b style="color:var(--gold)">level 3</b> \u2014 every face pays <b>4</b>. ' +
      'That is the ceiling.</div></div></div>';
  }
  var next = lvl + 1, cost = flagLvlCost(next), broke = G.you.energy < cost;
  return '<div class="buy"><div class="i"><b>Flagship \u2014 level ' + next + '</b><small>' +
    'Every face goes from ' + (lvl + 1) + ' to ' + (next + 1) +
    ' \u2014 including the Reactor.</small></div>' +
    '<button data-flagup="1"' + (broke ? ' disabled' : '') + '>' + cost + '\u26a1</button></div>';
}


// What a hull actually carries. The old shop said a d10 had "4 attack faces,
// 4 shield" - it was quietly skipping the 1 and the 2, which was true of a rule
// we dropped long ago. Every face fights: evens hit, odds block, and the 1 and 2
// pay Energy ON TOP of that. Counted here rather than described, so the shop
// cannot drift away from the engine again.
// A heading should say what you can DO here. "Shipyard" is a place; "Buy a new
// ship" is an action, and the colour says which of the three rooms you are in.
function shopHead(tone, title, sub){
  return '<div class="shead ' + tone + '"><h3>' + title + '</h3>' +
    '<div class="ssub">' + sub + '</div></div>';
}

// The only thing you can buy for the flagship. There is nothing to choose - one
// purchase lifts all six faces together - so there is nothing here to get wrong.
function flagshipSectionHtml(){
  var lvl = G.you.flag.lvl || 1;
  return '<div class="card">' +
    shopHead("gold", "Upgrade your flagship",
      lvl >= 3 ? "Fully upgraded \u2014 every face pays 4"
               : "One purchase lifts all six faces at once") +
    '<p>Your flagship rolls one of its six faces each round, and each one boosts ' +
    'the dice showing the number it lands on. A level raises every face together.</p>' +
    '<div class="lvlbar">' + [1,2,3].map(function(n){
      return '<div class="lvl' + (n === lvl ? " now" : n < lvl ? " past" : "") + '">' +
        '<div class="ln">Level ' + n + '</div>' +
        '<div class="lp">every face pays <b>' + (n + 1) + '</b></div></div>';
    }).join("") + '</div>' +
    '<div class="faceref">' + [1,2,3,4,5,6].map(function(n){
      var p = PANELS[G.you.flag.panels[n-1]];
      return '<div class="fref"><b>' + n + '</b><span>' + p.name + '</span></div>';
    }).join("") + '</div>' +
    flagUpgradeHtml() + '</div>';
}

function hullFacts(sides){
  var f = { hit:0, block:0, energy:0, repair:0, direct:0 }, v;
  for (v = 1; v <= sides; v++){
    if (v % 2 === 0) f.hit++; else f.block++;
    if (energyOf(v)) f.energy++;
    if (healOf(v))   f.repair++;
    if (directOf(v)) f.direct++;
  }
  return f;
}

// A ship you are thinking of buying should look like the ship you will get, so
// this is the same hull the board draws. Reading a row of text and then finding
// a shape on the grid was two different languages for one object.
function buyCardHtml(sides){
  var cost = priceOf(sides), f = hullFacts(sides);
  var full = G.you.dice.length >= K("maxDice");
  var short = cost - G.you.energy;
  var can = !full && short <= 0;
  return '<div class="ship' + (can ? " can" : " cant") + '">' +
    hullSvg(sides, sides, can ? "attack" : "dry") +
    '<div class="sname">d' + sides + '</div>' +
    '<div class="sfaces"><b class="red">' + f.hit + '</b> hit · ' +
      '<b class="blue">' + f.block + '</b> block</div>' +
    '<div class="sfaces avg">averages <b>' + ((sides + 1) / 2).toFixed(1) + '</b> a roll</div>' +
    '<div class="sline">straights pay at the <b>d' + sides + '</b> tier</div>' +
    '<button class="sbuy" data-buysize="' + sides + '"' + (can ? '' : ' disabled') + '>' +
      '<b>' + cost + '⚡</b>' +
      (full ? '<i>no berth free</i>' : short > 0 ? '<i>' + short + ' short</i>' : '') +
    '</button></div>';
}

// The scrapyard is your own board, not a list. Same 3x3, same hulls, same berth
// numbers - so "scrap the d4 in slot 2" is a thing you can see rather than
// something you have to translate.
function fleetGridHtml(){
  var cells = [], i, ix, d, hurt;
  for (i = 0; i < 9; i++){
    if (i === 4){
      cells.push('<div class="die flag shopflag"><div class="flbl">Flagship</div>' +
        '<div class="fcap hp">' + Math.max(0, G.you.hp) + '</div>' +
        '<div class="chg">level ' + (G.you.flag.lvl || 1) + '</div></div>');
      continue;
    }
    ix = i < 4 ? i : i - 1;
    d = G.you.dice[ix];
    if (!d){
      cells.push('<div class="slot"><span class="slotno">' + (ix + 1) + '</span>' +
        '<span class="berth">berth free</span></div>');
      continue;
    }
    hurt = isDamaged(d);
    cells.push('<div class="die noPick' + (hurt ? " hurt" : "") + '">' +
      '<span class="slotno">' + (ix + 1) + '</span>' +
      hullSvg(d.s, "", hurt ? "dry" : "defense") +
      '<div class="kind">d' + d.s + '</div>' +
      '<button class="scrapb" data-sell="' + ix + '"' +
        (hurt || G.you.dice.length <= 1 ? ' disabled' : '') + '>' +
        (hurt ? 'Damaged' : 'Scrap ' + sellValue(d.s) + '⚡') + '</button></div>');
  }
  return '<div class="grid">' + cells.join("") + '</div>';
}

function shopView(){
  themGrow();
  var full = G.you.dice.length >= K("maxDice");
  var filled = G.you.dice.length, cap = K("maxDice");
  var theirBig = Math.max.apply(null, G.them.dice.map(function(d){ return d.s; }));

  return '<h2>Between rounds</h2>' +

    '<div class="tot three purse">' +
      '<div class="e"><div class="n">' + G.you.energy + '</div><div class="l">Energy to spend</div></div>' +
      '<div><div class="n">' + filled + '/' + cap + '</div><div class="l">Berths filled</div></div>' +
      '<div><div class="n">' + G.them.dice.length + '<span class="sub"> · d' + theirBig +
        '</span></div><div class="l">Their fleet</div></div>' +
    '</div>' +
    '<p class="say">Prices are on the <b class="nrg">Energy</b> page at the top ' +
    'if you want to check what saving another round would get you.</p>' +

    // Scrapping is the only thing in here that RAISES Energy, so it comes before
    // the two rooms that spend it.
    '<div class="card">' +
    shopHead("red", "Scrap a ship for Energy",
      'You get back ' + K("sellBack") + '% of what you paid') +
    '<p>You lose on every trade, so scrap to free a berth for something better — ' +
    'never to raise cash. A damaged ship cannot be scrapped until it is back.</p>' +
    fleetGridHtml() + '</div>' +

    '<div class="card">' +
    shopHead("blue", "Buy a new ship",
      full ? 'Every berth is full — scrap one first'
           : (cap - filled) + ' of ' + cap + ' berths still free') +
    '<p>A bigger hull rolls higher and reaches further up the straight ladder — ' +
    'and the biggest ship in a line decides what that line pays.</p>' +
    '<div class="samefaces">Every hull carries the same low faces — ' +
      glyph(BOLT, "var(--nrg)", 0.6) + '<b class="nrg">1</b> ' +
      glyph(BOLT, "var(--nrg)", 0.6) + '<b class="nrg">2</b> ' +
      glyph(CROSS, "var(--hp)", 0.55) + '<b class="hp">3</b> ' +
      glyph(CHEV, "var(--direct)", 0.62) + '<b class="dir">4</b>' +
      ' — so paying more never buys you more Energy, repair or Direct. ' +
      'It buys reach and size.</div>' +
    '<div class="ships">' + [4,6,8,10].map(buyCardHtml).join("") + '</div></div>' +

    flagshipSectionHtml();
}
// ── the two reference screens ────────────────────────────────────────────────
// Energy was the one number on the board with no explanation anywhere. You could
// watch it climb for six rounds without ever learning that a single point of it,
// spent at the right moment, is what turns four-in-a-row into five.
function costsView(){
  function row(what, price, why){
    return '<div class="cr"><div class="cw">' + what + '</div>' +
      '<div class="cp">' + price + '</div>' +
      '<div class="cy">' + why + '</div></div>';
  }
  var e = G.you.energy;
  // What another round of saving would actually reach. This is the whole point of
  // the page: the decision is always "buy now, or wait one more round".
  var afford = [4,6,8,10].filter(function(sd){ return e >= priceOf(sd); });
  var biggest = afford.length ? afford[afford.length - 1] : 0;
  var reach = [4,6,8,10].filter(function(sd){ return e < priceOf(sd); })[0] || 0;

  return '<h2>Prices</h2>' +
    '<p class="say">You have <b class="nrg">' + e + ' Energy</b>' +
    (G.you.base ? ' and <b class="nrg">+' + G.you.base + '</b> comes in each round' : '') +
    '. ' + (biggest
      ? 'Enough for a <b>d' + biggest + '</b> right now'
      : 'Not enough for anything yet') +
    (reach ? ', and <b class="nrg">' + (priceOf(reach) - e) + '</b> more reaches a <b>d' +
      reach + '</b>.' : '.') + '</p>' +

    '<div class="card">' +
    shopHead("blue", "Ships", "Bought between rounds") +
    '<div class="ctab">' +
      [4,6,8,10].map(function(sd){
        var can = e >= priceOf(sd);
        return row('A <b>d' + sd + '</b>' + (can ? ' <span class="ok">you can afford this</span>' : ''),
          priceOf(sd) + '⚡',
          'Averages ' + ((sd + 1) / 2).toFixed(1) + ' a roll, hits on ' + (sd / 2) +
          ' faces and blocks on ' + (sd / 2) + ', and lifts a straight to the d' + sd + ' tier.');
      }).join("") +
    '</div>' +
    '<p class="hint">You have ' + (K("maxDice") - G.you.dice.length) + ' of ' + K("maxDice") +
    ' berths free. Scrapping a ship returns only ' + K("sellBack") +
    '% of its price, so a berth filled cheaply costs you money to empty again.</p></div>' +

    '<div class="card">' +
    shopHead("gold", "Flagship levels", "One purchase lifts all six faces") +
    '<div class="ctab">' +
      row('<b>Level 2</b> — every face pays 3', K("flagUp2") + '⚡',
          'Your flagship boosts every ship showing its number. This raises all six ' +
          'faces at once.') +
      row('<b>Level 3</b> — every face pays 4', K("flagUp3") + '⚡',
          'The ceiling. Nothing on the flagship goes higher.') +
    '</div>' +
    '<p class="hint">You are on <b style="color:var(--gold)">level ' +
    (G.you.flag.lvl || 1) + '</b>, so every face pays <b>' + flagMul(G.you) + '</b>.</p></div>' +

    '<div class="card">' +
    shopHead("nrg", "Extra rerolls", "Spent during a round, not after") +
    '<div class="ctab">' +
      row('One more roll of a die, past your ' + K("rollsPerRound") + ' free ones',
          K("rerollCost") + '⚡ each',
          'The only thing Energy buys mid-round. Whatever you send back gambles the ' +
          'attack it was already showing.') +
    '</div></div>' +

    '<div class="card">' +
    shopHead("nrg", "Where it comes from", "Every round, without asking") +
    '<div class="ctab">' +
      row('Every <b>1</b> you roll', '+' + K("oneEnergy") + '⚡', 'The best low roll on any die.') +
      row('Every <b>2</b> you roll', '+' + K("twoEnergy") + '⚡', 'And it still hits for 2.') +
      row('Your standing income', '+' + G.you.base + '⚡ a round',
          'The flagship\'s <b>#1</b> face raises this for the rest of the match.') +
      row('A straight of ' + K("runMin"), 'Energy',
          'That tier pays Energy instead of damage — see How to play.') +
    '</div></div>' +

    '<div class="card"><div class="rep"><div class="line">' +
    '<b>Save or spend?</b> You only have ' + K("maxDice") + ' berths, and scrapping ' +
    'loses half the price — so a berth is worth more than the Energy it takes to fill. ' +
    'Waiting a round for a <b>d10</b> beats filling two berths with <b>d4</b>s you will ' +
    'later pay to remove. Buy small early because you need dice on the board; buy big ' +
    'once the board is filling up.</div></div></div>' +

    '<div class="row"><button class="go" id="back">Back to the game</button></div>';
}
function helpView(){
  return '<h2>How to play</h2>' +
    '<p class="say">Every die is a ship. Your <b style="color:var(--gold)">flagship</b> ' +
    'sits in the middle with <b class="hp">' + K("startHP") + '</b> hit points, and the ' +
    'match ends the moment one flagship is destroyed. There is no round limit.</p>' +

    '<div class="card">' +
    shopHead("blue", "A round, start to finish", "Four steps, always the same") +
    '<div class="rep">' +
      '<div class="line"><b>1 · Roll.</b> Every ship rolls, and your flagship rolls too. ' +
      'You get ' + K("rollsPerRound") + ' rolls — tap the dice you want to change and ' +
      'roll again. What you send back gambles the attack it was showing.</div>' +
      '<div class="line"><b>2 · Submit.</b> Both fleets fire at once. Your attack meets ' +
      'their shields; theirs meets yours. Whatever is left over lands on a flagship.</div>' +
      '<div class="line"><b>3 · Take the hit.</b> You choose where their damage goes — ' +
      'all on your flagship, or put one ship in front of it. The attacker never picks ' +
      'the target.</div>' +
      '<div class="line"><b>4 · Spend.</b> Between rounds you scrap, buy and upgrade. ' +
      'Then it starts again.</div>' +
    '</div></div>' +

    '<div class="card">' + shopHead("red", "How to read a die", "One rule, then four exceptions") +
    legendHtml().replace('<h3 class="ktitle">How to read a die</h3>', '') + '</div>' +

    '<div class="card">' +
    shopHead("gold", "Your flagship", "Six faces, one per number") +
    '<p>It rolls like any other die, but it never fights. Its number joins your ' +
    'straight, and whichever face it lands on <b>boosts every ship showing that ' +
    'same number</b> — so a flagship <b>3</b> pays extra repair for each of your 3s. ' +
    'Those dice get a thin ring in the flagship\'s colour so you can see it happening. ' +
    'The <b>#1</b> face is the exception: it raises your standing Energy for the rest ' +
    'of the match, so it rings nothing.</p>' +
    '<div class="faceref">' + [1,2,3,4,5,6].map(function(n){
      var p = PANELS[G.you.flag.panels[n-1]];
      return '<div class="fref"><b>' + n + '</b><span>' + p.name + '</span></div>';
    }).join("") + '</div></div>' +

    '<div class="card">' +
    shopHead("blue", "Straights", "The reason to reroll") +
    '<p>' + K("runMin") + ' or more numbers in a row across your whole fleet — and your ' +
    'flagship\'s number counts toward the line. <b>Length</b> decides what kind of prize ' +
    'you get; the <b>biggest ship</b> in the line decides how large it is. You may ' +
    'always cash a long straight as a shorter one if you would rather have the Energy ' +
    'than the hit.</p>' + straightTableHtml() + '</div>' +

    '<div class="card">' +
    shopHead("red", "Taking damage", "The defender always chooses") +
    '<p>When their volley gets through you may put <b>' + K("soakMax") +
    '</b> ship in front of it. That ship blocks damage equal to its own size — a d10 ' +
    'blocks 10 — and is then <b>damaged</b> for the next round: it will not roll, and ' +
    'you cannot scrap it. It is back the round after.</p>' +
    '<p><b class="dir">Direct</b> is the exception. Every <b>4</b> pays ' +
    K("fourDirect") + ' Direct, and nothing stops it — not shields, not a ship thrown ' +
    'in the way. It always reaches the flagship.</p></div>' +

    '<div class="card">' +
    shopHead("gold", "Winning", "And the long game") +
    '<p>Destroy their flagship. If you both fall in the same round, the fleet that ' +
    'dealt more damage over the match wins. After round ' + K("escFrom") +
    ' the war escalates and every attack starts hitting harder, so stalemates do not last.</p>' +
    '</div>' +

    '<div class="row"><button class="go" id="back">Back to the game</button></div>';
}

function tuneView(){
  var rows = Object.keys(C).map(function(k){
    var c = C[k];
    return '<div class="tune">' +
      '<div class="i"><b>' + c.label + '</b>' +
      (c.note ? '<small>' + c.note + '</small>' : '') + '</div>' +
      '<input type="number" data-set="' + k + '" value="' + c.v + '" ' +
      'min="' + c.min + '" max="' + c.max + '" step="' + (c.step || 1) + '"></div>';
  }).join("");
  return '<h2>Tune the game</h2>' +
    '<p class="say">Change anything, then start a fresh match to feel it. ' +
    'These are the numbers worth arguing about \u2014 nothing here is settled.</p>' +
    '<div class="card">' + rows + '</div>' +
    '<div class="row"><button class="go" id="restart">Start a fresh match</button>' +
    '<button id="back">Back to the game</button>' +
    '<button id="reset">Reset to defaults</button></div>';
}

// Everyone fires at once across the galaxy, so both flagships going up in the
// same volley is not an edge case - measured at 18.9% of matches, near enough
// one in five. It needs a real answer rather than a shrug.
//
// The cascade, in order:
//   1. the heavier final volley - decided by the round you just watched, and it
//      lets someone steal it with one enormous last salvo
//   2. most damage across the whole match - level only 4.7% of the time after
//      step one, so this almost always settles it
//   3. a true mutual destruction - which lands in about 1 match in 5,000
function winner(){
  var mine = G.you.hp, yours = G.them.hp, r = G.report || {};
  if (mine > 0 && yours > 0)
    return { who: mine > yours ? "you" : mine < yours ? "them" : "draw", why: "health" };
  if (yours <= 0 && mine > 0) return { who: "you",  why: "kill" };
  if (mine <= 0 && yours > 0) return { who: "them", why: "kill" };
  if ((r.youDealt || 0) !== (r.themDealt || 0))
    return { who: r.youDealt > r.themDealt ? "you" : "them", why: "volley" };
  if (G.you.damage !== G.them.damage)
    return { who: G.you.damage > G.them.damage ? "you" : "them", why: "total" };
  return { who: "draw", why: "mutual" };
}

function overView(){
  var yours = Math.max(0, G.you.hp), theirs = Math.max(0, G.them.hp);
  var v = winner(), r = G.report || {}, headline, sub;
  var won = v.who === "you";

  if (v.why === "kill"){
    headline = won ? "Their flagship is destroyed" : "Your flagship is destroyed";
    sub = won ? "You won it in " + G.round + " rounds."
              : "They finished it in " + G.round + " rounds.";
  } else if (v.why === "volley"){
    headline = won ? "You win the exchange" : "You lose the exchange";
    sub = "Both flagships went up in round " + G.round +
      ". The heavier final volley takes it — <b>" + (r.youDealt || 0) + "</b> against <b>" +
      (r.themDealt || 0) + "</b>.";
  } else if (v.why === "total"){
    headline = won ? "You win on the record" : "You lose on the record";
    sub = "Both flagships destroyed, and the last volleys were level. " +
      "Damage across the whole match decides it.";
  } else if (v.why === "mutual"){
    headline = "Mutual destruction";
    sub = "Both flagships gone, the final volleys level, and neither of you " +
      "dealt a point more than the other across " + G.round + " rounds. Nobody wins this one.";
  } else {
    headline = v.who === "draw" ? "Dead heat" : won ? "You win on health" : "You lose on health";
    sub = "Neither flagship fell inside " + K("rounds") + " rounds.";
  }
  return '<div class="card center">' +
    '<h3>' + headline + '</h3>' +
    '<div style="font-size:46px;font-weight:800;margin:10px 0" class="hp">' + yours + ' – ' + theirs + '</div>' +
    '<p>' + sub + '</p>' +
    '<p class="say">You dealt <b>' + G.you.damage + '</b> damage across the match; they dealt <b>' +
      G.them.damage + '</b>.</p>' +
    '<button class="go" id="again">Play again</button></div>';
}

function render(){
  var body = G.phase === "tune" ? tuneView()
           : G.phase === "costs" ? costsView()
           : G.phase === "help" ? helpView()
           : G.phase === "brace" ? braceView()
           : G.phase === "roll" ? rollView()
           : G.phase === "report" ? reportView()
           : G.phase === "shop" ? shopView() : overView();
  var label = G.phase === "brace" ? ""
            : G.phase === "roll" ? "Submit round"
            : G.phase === "report" ? (matchOver() ? "See result" : "Continue")
            : G.phase === "shop" ? "Roll round " + G.round : "";

  document.getElementById("app").innerHTML =
    '<div class="wrap"><header><h1>Fleet Dice <button class="ver" id="tune">v' + VERSION + '</button></h1>' +
    '<span><button class="tiny nrg" id="costs">Energy ⚡</button> ' +
    '<span class="pill">' + (G.phase === "over" ? "Finished" : "Round " + G.round) + '</span></span></header>' +
    '<div class="board"><div><div class="who">You</div><div class="val hp">' + Math.max(0, G.you.hp) + '</div></div>' +
    (G.phase === "roll" ? rerollBtnHtml() : '<div class="mid">FLAGSHIP<br>HEALTH</div>') +
    '<div class="r"><div class="who">Them</div><div class="val hp">' + Math.max(0, G.them.hp) + '</div></div></div>' +
    body + '</div>' +
    (G.phase === "over" || G.phase === "tune" || G.phase === "costs" ||
      G.phase === "help" || G.phase === "brace" ? "" :
      '<div class="dock"><div class="dockin"><div class="met">' + dockMetrics() +
      '</div><button class="tiny howto" id="help">How<br>to play</button>' +
      '<button class="go" id="next">' + label + '</button></div></div>');

  wire();
  animate = {};        // consumed - a tap re-renders without replaying it
}

function wire(){
  var n = document.getElementById("next");
  if (n) n.onclick = function(){
    if (G.phase === "roll") submit();
    else if (G.phase === "report") nextRound();
    else if (G.phase === "shop") startRound();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-take]"), function(el){
    el.onclick = function(){
      straightPick = +el.getAttribute("data-take");
      render();
    };
  });
  var rr = document.getElementById("reroll");
  if (rr) rr.onclick = doReroll;
  var ag = document.getElementById("again");
  if (ag) ag.onclick = newGame;

  Array.prototype.forEach.call(document.querySelectorAll("[data-brace]"), function(el){
    el.onclick = function(){
      var i = +el.getAttribute("data-brace");
      feedShip(i);
    };
  });
  function feedShip(i){
    var d = G.you.dice[i], soak = soakWith(G.you, i);
    pending.fed = pending.fed || [];
    pending.fed.push({ s: d.s, slot: i + 1, soak: soak });
    pending.soaked += soak;
    render();
  }
  var bd = document.getElementById("brace-done");  if (bd) bd.onclick = settleRound;

  var fu = document.querySelector("[data-flagup]");
  if (fu) fu.onclick = function(){
    var lvl = G.you.flag.lvl || 1, cost = flagLvlCost(lvl + 1);
    if (lvl >= 3 || G.you.energy < cost) return;
    G.you.energy -= cost;
    G.you.flag.lvl = lvl + 1;
    toast("Flagship upgraded \u2014 every face now pays " + flagMul(G.you));
    render();
  };

  var cs = document.getElementById("costs");
  if (cs) cs.onclick = function(){ G.resume = G.phase; G.phase = "costs"; render(); };
  var hp = document.getElementById("help");
  if (hp) hp.onclick = function(){ G.resume = G.phase; G.phase = "help"; render(); };
  var tn = document.getElementById("tune");
  if (tn) tn.onclick = function(){
    if (G.phase === "tune"){ G.phase = G.resume || "roll"; }
    else { G.resume = G.phase; G.phase = "tune"; }
    render();
  };
  var bk = document.getElementById("back");
  if (bk) bk.onclick = function(){ G.phase = G.resume || "roll"; render(); };
  var rs = document.getElementById("restart");
  if (rs) rs.onclick = newGame;
  var rd = document.getElementById("reset");
  if (rd) rd.onclick = function(){ Object.keys(C).forEach(function(k){ C[k].v = DEFAULTS[k]; }); newGame(); };

  Array.prototype.forEach.call(document.querySelectorAll("[data-set]"), function(el){
    el.onchange = function(){
      var k = el.getAttribute("data-set"), c = C[k];
      var v = parseFloat(el.value);
      if (isNaN(v)) v = c.v;
      C[k].v = Math.max(c.min, Math.min(c.max, v));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-die]"), function(el){
    el.onclick = function(){
      var i = el.getAttribute("data-die");
      sel[i] = !sel[i];
      render();
    };
  });
  var fl = document.querySelector("[data-flag]");
  if (fl) fl.onclick = function(){
    sel.flag = !sel.flag;
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-buysize]"), function(el){
    el.onclick = function(){ buyDie(+el.getAttribute("data-buysize")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sell]"), function(el){
    el.onclick = function(){ sellDie(+el.getAttribute("data-sell")); };
  });
}

function toast(msg){
  var old = document.querySelector(".toast");
  if (old) old.remove();
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2200);
}

newGame();
</script>
